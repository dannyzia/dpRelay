plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jlleitschuh.gradle.ktlint' version '11.6.1'
}

apply from: '../ktlint.gradle'

android {
    namespace 'com.digitalpapyrus.dprelay.reader'
    compileSdk 34

    defaultConfig {
        applicationId "com.digitalpapyrus.dprelay.reader"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "5.4.0"

        // Non-secret default endpoint (docs/Plan/11-ENV-VARS.md public-client
        // rules): the production server URL, so onboarding is pre-filled. The
        // operator can re-point the app at staging from the onboarding screen
        // without a recompile — the stored value always wins over this default.
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"https://dprelay-api-hug8.onrender.com\""
    }

    buildFeatures {
        buildConfig true
    }

    // ISSUE-49: release builds are signed with the private dP Relay keystore.
    // The keystore and its password live in the OS keyring (service `dprelay`,
    // never this repo, never chat — ADR-016); a build wrapper materializes
    // them into these four env vars. assembleRelease FAILS CLOSED when any is
    // missing — no silent debug-signed or unsigned fallback — because the
    // installed reader holds PAYMENT_READER_SECRET.
    signingConfigs {
        release {
            def storePath = System.getenv("READER_RELEASE_STORE_FILE")
            storeFile storePath ? file(storePath) : null
            storePassword System.getenv("READER_RELEASE_STORE_PASSWORD") ?: null
            keyAlias System.getenv("READER_RELEASE_KEY_ALIAS") ?: null
            keyPassword System.getenv("READER_RELEASE_KEY_PASSWORD") ?: null
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            // Unit tests run on the JVM: pure-Kotlin parser/queue logic only,
            // no Android framework mocking needed (returnDefaultValues keeps
            // accidental framework calls from throwing).
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// Fail-closed preflight (ISSUE-49): abort a release build early, naming the
// missing VAR NAMES (never values) instead of failing deep inside AGP with a
// cryptic signing error. Debug builds never hit this guard.
tasks.configureEach { task ->
    if (task.name == "assembleRelease" || task.name == "packageRelease") {
        task.doFirst {
            def required = [
                "READER_RELEASE_STORE_FILE",
                "READER_RELEASE_STORE_PASSWORD",
                "READER_RELEASE_KEY_ALIAS",
                "READER_RELEASE_KEY_PASSWORD",
            ]
            def missing = required.findAll { name ->
                def value = System.getenv(name)
                return value == null || value.isEmpty()
            }
            if (!missing.isEmpty()) {
                throw new GradleException(
                    "Release signing is fail-closed (ISSUE-49): missing env vars " +
                        missing.join(", ") +
                        ". Materialize them from the OS keyring (secret-tool, " +
                        "service dprelay) per payment-reader/README.md — release " +
                        "builds never fall back to debug or unsigned output."
                )
            }
            if (!file(System.getenv("READER_RELEASE_STORE_FILE")).isFile()) {
                throw new GradleException(
                    "Release signing is fail-closed (ISSUE-49): " +
                        "READER_RELEASE_STORE_FILE does not point at an existing " +
                        "keystore file."
                )
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Offline queue with backoff (AC: unsent items persist locally and retry)
    // — same artifact the gateway already ships.
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    // EncryptedSharedPreferences for PAYMENT_READER_SECRET (AC; same artifact
    // the gateway uses for its secrets — ADR-016: never BuildConfig).
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    testImplementation 'junit:junit:4.13.2'
}
