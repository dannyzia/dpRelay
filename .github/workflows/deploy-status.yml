name: Deploy Status

# ISSUE-13 recurrence guard, as its own push-triggered workflow. It lived in
# pr-checks.yml first, where `if: github.event_name == 'push'` could never be
# true — that workflow only subscribes to `pull_request`, so the guard was
# dead code (and every PR showed it as "skipping"). A push to master is the
# only event where "did this commit reach production?" is the right question.
#
# Pass condition (learned from the first live run, which green-lit too early):
# the guard waits for a deploy OF THE COMMIT UNDER CHECK ($TARGET_SHA) to reach live —
# a *previous* commit's live deploy proves nothing about this push. Render
# skips deploys for pushes that change nothing under the service's rootDir
# (`server/`); observed with workflow-only commit 9684366, which got no
# deploy at all. So "no deploy for this commit" fails the run only when the
# push actually touched server/.
#
# workflow_dispatch exists so any commit's deploy can be re-verified on
# demand (e.g. after investigating a red run) without pushing anything to
# master. The optional `sha` input selects the commit to check; on push runs
# it is empty and TARGET_SHA falls back to the pushed commit, so the pass
# condition is identical for both triggers.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to verify (defaults to the workflow ref's SHA)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy-status:
    # For 8 commits every test suite was green while production silently
    # served a stale build because Render's auto-deploy was failing. This job
    # fails when this push's new_commit deploy is not live, making a broken
    # deploy chain a visible CI failure instead of a stale /health.
    runs-on: ubuntu-latest
    steps:
      - name: Check latest Render deploy is live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          GH_TOKEN: ${{ github.token }}
          # `inputs.sha` is empty on push runs; `||` then yields github.sha, so
          # the push path checks exactly the pushed commit (unchanged behavior).
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::warning::RENDER_API_KEY/RENDER_SERVICE_ID secrets not set - deploy-status check skipped (not a failure)."
            exit 0
          fi

          # Does this push touch the service's rootDir (server/)? The GitHub
          # commit API lists changed files (GITHUB_TOKEN avoids a checkout).
          SERVER_FILES=$(curl -sS -m 30 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA" \
            | jq -r '.files[].filename' | grep -c '^server/' || true)
          if [ "$SERVER_FILES" -eq 0 ]; then
            echo "No server/ changes in $TARGET_SHA - Render deploy not expected. OK."
            exit 0
          fi

          echo "Waiting for the Render auto-deploy of $TARGET_SHA to go live..."

          # Report EVERY problem, then exit once. Same discipline as the Pages
          # credential preflight, and for the same reason: this job exists
          # because for 8 commits every suite was green while production served
          # a stale build. A guard that names the wrong cause is barely better
          # than one that names none.
          #
          # The defect that motivated this: `curl -sS` puts an HTTP error and a
          # good response through the same pipe, so a rejected token or a 5xx
          # body reached jq, jq reduced it to "none", and the loop then polled
          # for ten minutes before reporting "no deploy appeared" — a different
          # fault, sending the owner to fix the deploy chain when the credential
          # was the thing at fault. Each distinct cause is now classified where
          # it can be seen, and reported for what it is.
          failures=0
          note_fail() { echo "::error::$1"; failures=$((failures + 1)); }

          api_problem=""
          terminal_status=""
          saw_deploy_for_target=0
          body_file=$(mktemp)

          for i in $(seq 1 20); do
            # -w separates the status code from the body, -o keeps the body
            # intact. Without this an error page is indistinguishable from an
            # empty deploy list.
            http_code=$(curl -sS -m 30 -o "$body_file" -w '%{http_code}' \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=10") || http_code="curl_error"

            if [ "$http_code" != "200" ]; then
              case "$http_code" in
                401|403)
                  api_problem="RENDER_API_KEY is REJECTED by Render (HTTP ${http_code})  ->  the CREDENTIAL AT FAULT IS THE KEY. Fix: replace the RENDER_API_KEY secret. This is NOT a deploy-chain problem, and retrying will not change it." ;;
                404)
                  api_problem="Render returns HTTP 404 for service '${RENDER_SERVICE_ID}'  ->  RENDER_SERVICE_ID does not name a service this key can see. Fix the id, or grant the key access to that service." ;;
                curl_error)
                  api_problem="the Render deploys request did not complete (curl failed or timed out)  ->  a network or TLS failure, not a deploy verdict." ;;
                *)
                  api_problem="Render returned HTTP ${http_code} for the deploys request  ->  unexpected API response; body was: $(head -c 200 "$body_file")" ;;
              esac
              break
            fi

            # A 200 that is not a JSON array is still a failure. jq would
            # otherwise reduce it to "none" and send us round the loop again,
            # which is the exact misattribution this step exists to remove.
            if ! jq -e 'type == "array"' "$body_file" >/dev/null 2>&1; then
              api_problem="Render returned HTTP 200 whose body is not a deploy array: $(head -c 200 "$body_file")  ->  treated as an API failure, not as 'no deploy yet'."
              break
            fi

            DEPLOYS=$(cat "$body_file")
            STATUS=$(echo "$DEPLOYS" | jq -r '[.[] | select(.deploy.trigger == "new_commit")][0] | .deploy.status // "none"')
            # .deploy.commit is an OBJECT ({id, createdAt, message}) — compare .id,
            # not the object itself, or the comparison never matches.
            COMMIT=$(echo "$DEPLOYS" | jq -r '[.[] | select(.deploy.trigger == "new_commit")][0] | .deploy.commit.id // "none"')
            echo "attempt $i: newest new_commit deploy = $STATUS (commit ${COMMIT:0:7})"

            if [ "$COMMIT" != "$TARGET_SHA" ]; then
              # Deploy for THIS push hasn't appeared yet. A previous commit's
              # live deploy is not evidence for this one — keep waiting.
              sleep 30
              continue
            fi

            saw_deploy_for_target=1
            case "$STATUS" in
              live) rm -f "$body_file"; echo "Deploy is live."; exit 0 ;;
              update_failed|create_failed|build_failed|canceled|deactivated)
                terminal_status="$STATUS"
                break ;;
            esac
            sleep 30
          done
          rm -f "$body_file"

          # Deliberately NOT an if/elif chain: these are separate findings and
          # an owner with a bad credential also does not have a verified
          # deploy. Reporting only the first would send them round the loop
          # again to discover the second.
          if [ -n "$api_problem" ]; then
            note_fail "$api_problem"
          fi
          if [ -n "$terminal_status" ]; then
            note_fail "the Render deploy of ${TARGET_SHA:0:7} reached terminal status '${terminal_status}'  ->  production is NOT current. Fix the deploy chain (ISSUE-13 class of failure)."
          fi
          if [ "$saw_deploy_for_target" -eq 0 ] && [ -z "$terminal_status" ]; then
            note_fail "no new_commit deploy for ${TARGET_SHA:0:7} reached a terminal state within 10 minutes although server/ changed  ->  the auto-deploy chain is broken (ISSUE-13 class of failure)."
          fi

          if [ "$failures" -ne 0 ]; then
            echo "::error::Deploy check found ${failures} problem(s). All are listed above — fix them in one pass; this step reports every problem rather than stopping at the first."
            exit 1
          fi
          echo "Deploy check found no problems."
