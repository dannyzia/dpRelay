name: PR Checks
on:
  pull_request:
    branches: [develop, main, master]
    # No workflow-level `paths` filter: most jobs here are cheap repo-wide gates
    # that should run even on docs-only PRs, and GitHub only supports `paths`
    # at workflow level (which would re-scope every job). Path scoping for
    # dashboard/ is done per-job via the `changes` job below.

jobs:
  android-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Android Lint
        working-directory: authenticator-app
        run: ./gradlew lintDebug
      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: authenticator-app/app/build/reports/lint-results-debug.html
          if-no-files-found: error

  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ktlint
        uses: ScaCap/action-ktlint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          file_pattern: "authenticator-app/**/*.kt"

  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
      - name: Run Unit Tests
        working-directory: authenticator-app
        run: ./gradlew testDebugUnitTest
      # Pin v5 (shasum-verified releases) — @v3 fails on deprecated upload backend.
      # fail_ci_if_error=false: a codecov.io transport failure must not mask green tests.
      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          files: authenticator-app/app/build/reports/jacoco/testDebugUnitTestCoverage.xml
          fail_ci_if_error: false
          verbose: true

  # STAGE F8 (ISSUE-90): the dedicated Payment Reader app gets the same three
  # Android gates as the gateway — lint, ktlint, unit tests. They run on every
  # PR, exactly like the three authenticator-app jobs above.
  payment-reader-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Android Lint
        working-directory: payment-reader
        run: ./gradlew lintDebug
      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: payment-reader-lint-report
          path: payment-reader/app/build/reports/lint-results-debug.html
          if-no-files-found: error

  payment-reader-ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ktlint
        uses: ScaCap/action-ktlint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          file_pattern: "payment-reader/**/*.kt"

  payment-reader-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('payment-reader/**/*.gradle') }}
      - name: Run Unit Tests
        working-directory: payment-reader
        run: ./gradlew testDebugUnitTest

  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run Tests
        run: npm test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Blocks a credential from reaching the index. Deliberately separate from
      # the dependency check below: that finds vulnerable packages, this finds
      # leaked secrets, and only one of them is about what we committed.
      # Works on the default shallow checkout: the gate reads `git ls-files` and
      # the working tree only, never history, so fetch-depth: 0 is not needed.
      - name: Secret gate
        run: bash scripts/secret-scan.sh
      # v4 functions/ plane removed (decommission) — the npm-audit step that
      # scanned it went with it; remediation is moot post-decommission.
      - name: Run dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Authenticator'
          path: '.'
          format: 'ALL'

  # Path predicate for the dashboard job below, computed with native git instead
  # of a third-party filter action. pr-checks only runs on pull_request events,
  # where checkout lands on the merge commit (refs/pull/N/merge): HEAD^ = the
  # base tip, so HEAD^..HEAD is exactly the PR's changed files — no extra refs
  # to fetch. The two CI workflow files are included so CI edits are always
  # smoke-validated.
  changes:
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      webv5: ${{ steps.filter.outputs.webv5 }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect dashboard changes
        id: filter
        run: |
          if git diff --name-only "HEAD^" "HEAD" | grep -qE '^(dashboard/|\.github/workflows/(pr-checks|dashboard-pages-deploy)\.yml)'; then
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
          else
            echo "dashboard=false" >> "$GITHUB_OUTPUT"
          fi
          # web-v5 gets its own predicate (hyphenated output names are not
          # addressable in `needs.*` expressions, hence `webv5`).
          if git diff --name-only "HEAD^" "HEAD" | grep -qE '^(web-v5/|\.github/workflows/pr-checks\.yml)'; then
            echo "webv5=true" >> "$GITHUB_OUTPUT"
          else
            echo "webv5=false" >> "$GITHUB_OUTPUT"
          fi
          # landing (STAGE F6): content files, the zero-dep checker, or this
          # workflow — CI edits must always smoke-validate the gate they edit.
          if git diff --name-only "HEAD^" "HEAD" | grep -qE '^(landing/|scripts/check-landing\.mjs|\.github/workflows/pr-checks\.yml)'; then
            echo "landing=true" >> "$GITHUB_OUTPUT"
          else
            echo "landing=false" >> "$GITHUB_OUTPUT"
          fi

  # PR-time gate for the dashboard SPA: typecheck + build when dashboard/ is
  # touched. (Master pushes get the full build+deploy via
  # dashboard-pages-deploy.yml.) npm ci pins the lockfile committed since #29.
  dashboard-build:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build

  # PR-time gate for the web-v5 SPA (QUEUE AMENDMENT #2): typecheck + vitest +
  # build when web-v5/ (or this workflow) is touched. `npm ci` pins the
  # committed lockfile, same discipline as dashboard-build above.
  web-v5-build:
    needs: changes
    if: needs.changes.outputs.webv5 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-v5/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build

  # STAGE F6 (ISSUE-86): static marketing site gate — zero-dependency
  # structural checks (internal links, per-page SEO, owner-verbatim guide
  # pins, SMTP-free FAQ, AGPL pattern) on plain Node. landing/ has no
  # package.json by contract, so there is deliberately no install step.
  landing-checks:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check landing site
        run: node scripts/check-landing.mjs

  # ISSUE-103: the v5 Playwright suite in CI, no-credentials skip mode. Boots
  # a throwaway API server (fresh SQLite, runtime-minted secrets) plus the
  # dashboard dev server on the runner, then runs `npx playwright test` with
  # NO E2E_* variables: the register / sign-in / connect-app tests execute and
  # gate the PR, while the app-plane suites take their test.skip guards.
  #
  # Skip mode is the security posture, not a compromise: the job holds no
  # stored secret, so a PR cannot exfiltrate one and nothing it does can touch
  # a shared environment — both endpoints are this job's own localhost
  # instances. DASHBOARD_URL and VITE_API_BASE_URL are set precisely because
  # the defaults point at production (playwright.config.ts falls back to the
  # deployed pages.dev dashboard, dashboard/src/api.ts to the Render API).
  #
  # Unconditional on every PR (same discipline as server-tests): auth
  # regressions are not path-scoped, and a skipped required check is
  # indistinguishable from a passing one.
  dashboard-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Declared once: every step below reads them. Loopback ports on a clean
      # runner — change them here and nowhere else.
      SERVER_PORT: 3879
      DASHBOARD_PORT: 5275
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            dashboard/package-lock.json
      - name: Install Playwright (repo root)
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Generate throwaway runtime env
        # Secrets are minted per run and never stored in the repo or in
        # Actions settings — skip mode needs no credential at all. The values
        # only ever exist in this runner's temp dir.
        run: |
          {
            echo "PORT=${SERVER_PORT}"
            echo "HOST=127.0.0.1"
            echo "LOG_LEVEL=warn"
            echo "DB_PATH=${RUNNER_TEMP}/e2e.db"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "OPERATOR_SECRET=$(openssl rand -hex 16)"
            echo "APP_PROVISIONING_SECRET=$(openssl rand -hex 16)"
            echo "BULK_ENABLED=true"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:${DASHBOARD_PORT}"
          } > "${RUNNER_TEMP}/e2e.env"
      - name: Start API server
        working-directory: server
        # Migrations run at boot (server/src/db.ts), so a fresh DB_PATH is
        # schema-current without a separate step.
        run: |
          set -a; source "${RUNNER_TEMP}/e2e.env"; set +a
          nohup npx tsx src/index.ts > "${RUNNER_TEMP}/server.log" 2>&1 &
      - name: Start dashboard dev server
        working-directory: dashboard
        # VITE_API_BASE_URL bakes the API origin into the served SPA — without
        # it the dashboard would silently talk to the production API.
        run: |
          VITE_API_BASE_URL="http://127.0.0.1:${SERVER_PORT}" \
            nohup npm run dev -- --port "${DASHBOARD_PORT}" --strictPort \
            > "${RUNNER_TEMP}/vite.log" 2>&1 &
      - name: Wait for the stack
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${SERVER_PORT}/health" >/dev/null 2>&1 \
              && curl -sf "http://localhost:${DASHBOARD_PORT}/" >/dev/null 2>&1; then
              echo "stack ready (attempt ${i})"
              exit 0
            fi
            sleep 2
          done
          echo "::error::stack did not become ready within 60s"
          exit 1
      - name: Run e2e (no credentials — gated suites skip)
        # Deliberately NO E2E_APP_ID / E2E_APP_SECRET / E2E_OPERATOR_SECRET:
        # auth + connect-app regressions run; app-plane suites skip cleanly.
        env:
          DASHBOARD_URL: http://localhost:${{ env.DASHBOARD_PORT }}
        run: npx playwright test
      - name: Diagnose failure
        if: failure()
        run: |
          echo "--- server.log ---"; tail -n 100 "${RUNNER_TEMP}/server.log" 2>/dev/null || true
          echo "--- vite.log ---"; tail -n 100 "${RUNNER_TEMP}/vite.log" 2>/dev/null || true
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-e2e-results
          path: test-results/
          if-no-files-found: ignore
