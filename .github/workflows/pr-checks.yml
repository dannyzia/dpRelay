name: PR Checks
on:
  pull_request:
    branches: [develop, main, master]
    # No workflow-level `paths` filter: most jobs here are cheap repo-wide gates
    # that should run even on docs-only PRs, and GitHub only supports `paths`
    # at workflow level (which would re-scope every job). Path scoping for
    # dashboard/ is done per-job via the `changes` job below.

jobs:
  android-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Android Lint
        working-directory: authenticator-app
        run: ./gradlew lintDebug
      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: authenticator-app/app/build/reports/lint-results-debug.html
          if-no-files-found: error

  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ktlint
        uses: ScaCap/action-ktlint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          file_pattern: "authenticator-app/**/*.kt"

  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
      - name: Run Unit Tests
        working-directory: authenticator-app
        run: ./gradlew testDebugUnitTest
      # Pin v5 (shasum-verified releases) — @v3 fails on deprecated upload backend.
      # fail_ci_if_error=false: a codecov.io transport failure must not mask green tests.
      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          files: authenticator-app/app/build/reports/jacoco/testDebugUnitTestCoverage.xml
          fail_ci_if_error: false
          verbose: true

  cloud-function-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Tests
        # test:unit = no-emulator scope (index.test.js). Bare `npm test` needs
        # Firebase emulators (test/setup.js) and cannot pass on the runner.
        run: npm run test:unit
      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          files: functions/coverage/lcov.info
          fail_ci_if_error: false

  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run Tests
        run: npm test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run npm audit
        working-directory: functions
        # Advisory only: no audit level (low→critical) passes on master (1 critical,
        # 8 high, 13 moderate, 2 low; prod tree alone carries highs via firebase-admin).
        # Hard-gating here blocked every PR while the tree stays unfixed — remediation
        # (`npm audit fix` on functions/) needs its own pass. Report stays visible.
        run: npm audit --audit-level=low
        continue-on-error: true
      - name: Run dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Authenticator'
          path: '.'
          format: 'ALL'

  # Path predicate for the dashboard job below, computed with native git instead
  # of a third-party filter action. pr-checks only runs on pull_request events,
  # where checkout lands on the merge commit (refs/pull/N/merge): HEAD^ = the
  # base tip, so HEAD^..HEAD is exactly the PR's changed files — no extra refs
  # to fetch. The two CI workflow files are included so CI edits are always
  # smoke-validated.
  changes:
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect dashboard changes
        id: filter
        run: |
          if git diff --name-only "HEAD^" "HEAD" | grep -qE '^(dashboard/|\.github/workflows/(pr-checks|dashboard-pages-deploy)\.yml)'; then
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
          else
            echo "dashboard=false" >> "$GITHUB_OUTPUT"
          fi

  # PR-time gate for the dashboard SPA: typecheck + build when dashboard/ is
  # touched. (Master pushes get the full build+deploy via
  # dashboard-pages-deploy.yml.) npm ci pins the lockfile committed since #29.
  dashboard-build:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
