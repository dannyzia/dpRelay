plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'jacoco'
    id 'org.jlleitschuh.gradle.ktlint' version '11.6.1'
}

apply from: '../ktlint.gradle'

android {
    namespace 'com.digitalpapyrus.authenticator'
    compileSdk 34

    signingConfigs {
        // Gateway builds sign with the shared debug keystore (standard "android"
        // credentials — public, not a secret) so assembleRelease produces an
        // installable APK without per-machine setup. Swap for a real release
        // keystore before any store distribution.
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DUMMY.SF']
        }
    }

    // Disable AAR metadata check that's causing build failures
    aaptOptions {
        additionalParameters '--warn-manifest-validation'
    }

    defaultConfig {
        applicationId "com.digitalpapyrus.authenticator"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "4.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Cloud Run URLs for Firebase Functions v2 (2nd Gen) - enrollment secret is runtime-only (ADR-016)
        buildConfigField "String", "CF_START_VERIFICATION_URL", "\"https://startverification-giwymuyuka-as.a.run.app\""
        buildConfigField "String", "CF_CHECK_AUTH_URL", "\"https://checkauth-giwymuyuka-as.a.run.app\""
        buildConfigField "String", "CF_REGISTER_AUTHENTICATOR_URL", "\"https://registerauthenticator-giwymuyuka-as.a.run.app\""
        // OTP phase URLs (Phase 12) - update with actual deployed URLs
        buildConfigField "String", "CF_SEND_OTP_URL", "\"https://sendotp-giwymuyuka-as.a.run.app\""
        buildConfigField "String", "CF_VERIFY_OTP_URL", "\"https://verifyotp-giwymuyuka-as.a.run.app\""
        buildConfigField "String", "CF_OTP_STATUS_URL", "\"https://otpstatus-giwymuyuka-as.a.run.app\""
        buildConfigField "String", "CF_APP_ID", "\"\""
        // dP Relay v5 server (M2 parallel run, PLAN §9). V5_API_ENABLED is the
        // compile-time toggle: false keeps the legacy Firebase plane as the only
        // active one; flip to true for the cutover build. Base URL is a
        // non-secret (server URL, per 11-ENV-VARS.md public-client rules).
        buildConfigField "String", "V5_API_BASE_URL", "\"https://dprelay-api-hug8.onrender.com\""
        // V5_SERVER_URL is the explicit, operator-settable v5 endpoint for the
        // parallel-run APK (PLAN §10 Step 2). V5ApiClient prefers this over
        // V5_API_BASE_URL so a deployed build can be re-pointed at a staging
        // server without a recompile; both default to the production host.
        buildConfigField "String", "V5_SERVER_URL", "\"https://dprelay-api-hug8.onrender.com\""
        buildConfigField "boolean", "V5_API_ENABLED", "true"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// Jacoco configuration for code coverage
android {
    buildTypes {
        debug {
            testCoverageEnabled true
        }
    }
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    
    reports {
        xml.required = true
        html.required = true
    }
    
    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/databinding/**',
        '**/android/databinding/**',
        '**/androidx/databinding/**',
        '**/di/**',
        '**/hilt/**',
        '**/*_Factory.*',
        '**/*_MembersInjector.*',
        '**/Dagger*Component*.*',
        '**/Hilt_*.*',
        '**/*_Impl*.*'
    ]
    
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"
    
    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: "$buildDir", includes: [
        "jacoco/testDebugUnitTest.exec",
        "outputs/code_coverage/debugAndroidTest/connected/**/*.ec"
    ]))
}

dependencies {
    // Firebase BoM for version management
    implementation platform('com.google.firebase:firebase-bom:33.1.2')

    // Firebase dependencies
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    
    // Firebase coroutines support for Tasks.await()
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.0'
    
    // AndroidX
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Apply Google Services plugin at the bottom
apply plugin: 'com.google.gms.google-services'

// Disable AAR metadata check that's causing build failures
tasks.whenTaskAdded { task ->
    if (task.name.contains("checkAarMetadata")) {
        task.enabled = false
    }
}
