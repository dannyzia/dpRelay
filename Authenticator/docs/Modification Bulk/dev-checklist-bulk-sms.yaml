      - id: BCF-10
        status: "todo"
        task: "Write unit and integration tests for all bulk Cloud Functions"
        files_to_create:
          - "functions/test/bulk/createBulkCampaign.test.js"
          - "functions/test/bulk/dispatchBulkJobs.test.js"
          - "functions/test/bulk/campaignLifecycle.test.js"
          - "functions/test/bulk/bulkCredits.test.js"
          - "functions/test/bulk/security.test.js"
          - "functions/test/bulk/e2e-bulk.test.js"
        test_cases:
          createBulkCampaign:
            - "Valid CSV with 100 rows: campaign created with status='pending', totalCount=100, 1 batch doc with 100 phones."
            - "CSV with 10,001 rows: rejected 400 max_campaign_size_exceeded."
            - "CSV with malformed E.164 numbers on rows 3 and 7: rejected 400 with errors listing lines 3 and 7."
            - "Bulk credits balance = 0: rejected 402 insufficient_bulk_credits."
            - "Invalid appId/appSecret: rejected 403."
            - "Message exceeding 459 chars: rejected 400."
            - "Empty message: rejected 400."
            - "Missing csvFile field: rejected 400."
          dispatchBulkJobs:
            - "Campaign in 'pending' state: transitions to 'sending', first batch dispatched to RTDB."
            - "Campaign in 'paused' state: zero jobs dispatched on scheduler tick."
            - "Campaign in 'cancelled' state: zero jobs dispatched."
            - "Dispatch tick: exactly BULK_DISPATCH_BATCH_SIZE job nodes written to RTDB."
            - "Duplicate dispatch (same jobId): RTDB set() is idempotent — count of RTDB nodes does not increase."
            - "dispatchCursor increments after each batch is dispatched."
          campaignLifecycle:
            - "pauseCampaign on sending campaign: status = 'paused', pausedAt set."
            - "pauseCampaign on already-paused campaign: 409 campaign_not_pausable."
            - "pauseCampaign on completed campaign: 409 campaign_not_pausable."
            - "cancelCampaign by admin on sending campaign: status = 'cancelled', pending RTDB jobs deleted, credits refunded."
            - "cancelCampaign on completed campaign: 409 campaign_already_terminal."
            - "cancelCampaign by non-admin: 403 admin_only."
            - "retryFailedJobs on completed campaign with failures: failed RTDB jobs reset to pending, status = 'sending'."
            - "retryFailedJobs on sending campaign: 409 retry_not_allowed."
            - "onBulkJobStatusChange 'sent': sentCount incremented in Firestore."
            - "onBulkJobStatusChange 'sent' — last job: status = 'completed', completedAt set."
            - "onBulkJobStatusChange 'failed' with attempts < maxRetries: RTDB job reset to 'pending'."
            - "onBulkJobStatusChange 'failed' with attempts == maxRetries: failedCount incremented, failed_jobs audit record written with hashed phone."
          bulkCredits:
            - "approveBulkCredit on pending transaction: balance incremented, status = 'approved'."
            - "approveBulkCredit called twice: second call returns 409 already_resolved, balance unchanged."
            - "getBulkCredits with no document: returns { balance: 0, lifetimePurchased: 0 }."
            - "submitBulkTrxId with duplicate trxId from another transaction: rejected."
          security:
            - "createBulkCampaign with no auth: 403."
            - "getCampaignStatus for another tenant's campaign: 403 access_denied."
            - "pauseCampaign for another tenant's campaign: 403."
            - "cancelCampaign by non-admin caller: 403 admin_only."
            - "approveBulkCredit by non-admin caller: 403."
            - "Direct RTDB /bulk_sms_queue write by client SDK: denied by RTDB rules."
            - "Direct Firestore bulk_campaigns write by non-owner client SDK: denied by Firestore rules."
          e2e_bulk:
            - "Full cycle via emulator: create campaign → dispatchBulkJobs tick → simulate Android sets status='sent' → BCF-07 fires → sentCount=totalCount → status='completed'."
            - "OTP sendOtp still works after bulk system deployed: non-regression smoke test."
        verification:
          - type: command
            run: "cd functions && npm test -- --testPathPattern=test/bulk/"
            expect_exit: 0
        depends_on:
          [BCF-01, BCF-02, BCF-03, BCF-04, BCF-05, BCF-06, BCF-07, BCF-08]
        priority: critical
        notes: >
          The e2e_bulk test must simulate the Android device by writing status='sent' to
          /bulk_sms_queue/{jobId} via the Firebase Admin SDK in the test setup.
          This is the correct simulation because BCF-07 is an RTDB onUpdate trigger — it
          fires on field writes, not on node deletion.

      - id: BCF-11
        status: "todo"
        task: "Add CORS middleware and HTTP method guards to all bulk HTTPS Cloud Functions"
        files_to_modify:
          - "functions/src/bulk/createBulkCampaign.js"
          - "functions/src/bulk/getCampaignStatus.js"
          - "functions/src/bulk/pauseCampaign.js"
          - "functions/src/bulk/cancelCampaign.js"
          - "functions/src/bulk/retryFailedJobs.js"
          - "functions/src/bulk/upsertBulkPackage.js"
          - "functions/src/bulk/requestBulkCredit.js"
          - "functions/src/bulk/submitBulkTrxId.js"
          - "functions/src/bulk/approveBulkCredit.js"
          - "functions/src/bulk/getBulkCredits.js"
        changes:
          - "Import and apply the existing CORS middleware used by OTP functions (e.g. functions/src/middleware/cors.js). Do not create a new CORS utility — reuse what exists."
          - "Method guards: createBulkCampaign accepts POST only, getCampaignStatus accepts GET only, all other HTTPS functions accept POST only. Return 405 { error: 'method_not_allowed', allowed: ['POST'] } for disallowed methods."
          - "Handle CORS preflight OPTIONS requests: immediately return 204 with CORS headers, before any auth or business logic."
          - "Allowed origins: read from BULK_SMS_CORS_ORIGIN env var. Default to CORS_ORIGIN if set; otherwise deny all cross-origin requests (do not default to wildcard *). Flag if neither var is set."
          - "All error responses must include Content-Type: application/json header and a JSON body with at minimum: { error: string, message?: string }. Never return HTML error pages from HTTPS Cloud Functions."
        verification:
          - type: contains
            file: "functions/src/bulk/createBulkCampaign.js"
            patterns:
              - "cors\\|CORS\\|Access-Control"
              - "method.*POST\\|req\\.method"
              - "OPTIONS\\|preflight"
              - "method_not_allowed\\|405"
          - type: anti_pattern_check
            file: "functions/src/bulk/createBulkCampaign.js"
            forbidden: "Access-Control-Allow-Origin.*\\*"
            description: "Wildcard CORS origin is forbidden — use env var BULK_SMS_CORS_ORIGIN"
        depends_on: [BCF-01, BCF-03, BCF-04, BCF-05, BCF-06, BCF-08]
        priority: high
        notes: >
          ⚠️ FLAG: BULK_SMS_CORS_ORIGIN is a new environment variable.
          Add it to functions/.env.example and docs/Plan/11-ENV-VARS.md.
          Without CORS headers, the CreateCampaignPage in the React dashboard will
          fail with a CORS preflight error on every call.

      - id: BCF-12
        status: "todo"
        task: "Configure memory, timeout, and concurrency settings for all new Cloud Functions"
        files_to_modify:
          - "functions/index.js"
        changes:
          - "createBulkCampaign: memory = '512MiB', timeoutSeconds = 540. Rationale: CSV parsing and batched Firestore writes for 10,000 recipients can consume significant memory; 9-min timeout allows large batch creation."
          - "dispatchBulkJobs: memory = '256MiB', timeoutSeconds = 540. Rationale: 540s matches maximum Cloud Scheduler window; scheduler fires every 60s so timeout is effectively unbounded."
          - "onBulkJobStatusChange: memory = '256MiB', timeoutSeconds = 60. Rationale: Counter update is a fast transaction; short timeout prevents runaway trigger loops."
          - "getCampaignStatus: memory = '256MiB', timeoutSeconds = 30. Fast read-only function."
          - "pauseCampaign / cancelCampaign / retryFailedJobs: memory = '256MiB', timeoutSeconds = 120. cancelCampaign requires time for RTDB batch deletes."
          - "All billing functions (upsertBulkPackage, requestBulkCredit, submitBulkTrxId, approveBulkCredit, getBulkCredits): memory = '256MiB', timeoutSeconds = 60."
          - "Apply settings using functions.runWith({ memory, timeoutSeconds }) (Gen1) or options object (Gen2). Match whatever runtime version the project uses."
        verification:
          - type: contains
            file: "functions/index.js"
            patterns:
              - "512MiB\\|512M\\|memory.*512"
              - "timeoutSeconds.*540\\|540.*timeout"
              - "createBulkCampaign.*runWith\\|runWith.*createBulkCampaign"
        depends_on: [BCF-09]
        priority: high
        notes: >
          ⚠️ FLAG: Memory and timeout values above are recommendations based on known
          workload characteristics. Verify against actual performance profiling in staging
          before locking in for production. Overly high memory allocations increase
          billing costs; too low causes OOM crashes on large campaigns.

  # ─────────────────────────────────────────────────────────────────────────────
  - id: B3
    name: "Android App Modifications"
    blocking: true
    description: >
      Extend the existing Kotlin foreground service to: listen to the new
      /bulk_sms_queue RTDB node alongside /pending_sms; enforce a cross-queue
      device-level rate limiter (minimum 2 seconds between any two SMS sends);
      write status ('sent' or 'failed') to RTDB before job deletion so BCF-07
      can fire; and propagate error codes from SmsManager for retry intelligence.
      The existing /pending_sms flow and its OA3–OA5 implementation must remain
      completely unmodified.
    items:
      - id: BAN-01
        status: "todo"
        task: "Implement a global cross-queue SMS rate limiter in the Android foreground service"
        files_to_modify:
          - "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
        changes:
          - "Add: private val smsHandlerThread = HandlerThread('sms-rate-limiter').also { it.start() }"
          - "Add: private val smsHandler = Handler(smsHandlerThread.looper)"
          - "Add: private val MIN_INTERVAL_MS: Long = 2000L  // 30 SMS/min max — carrier-safe"
          - "Add: @Volatile private var lastSendTimestampMs: Long = 0L"
          - "Add private fun enqueueSend(to: String, message: String, priority: SmsJobPriority = SmsJobPriority.BULK, onSuccess: () -> Unit, onFailure: (error: String) -> Unit): Unit."
          - "SmsJobPriority enum: OTP (higher, posts with 0ms delay ignoring MIN_INTERVAL_MS), BULK (normal, posts with computed delay)."
          - "OTP priority: when priority == OTP, remove all pending BULK Runnables from smsHandler queue (smsHandler.removeCallbacksAndMessages(BULK_TOKEN)), then post the OTP Runnable immediately at the front. This ensures OTP sends are never starved behind a long bulk burst."
          - "BULK priority: computes delay = maxOf(0L, MIN_INTERVAL_MS - (SystemClock.elapsedRealtime() - lastSendTimestampMs)) and posts normally."
          - "enqueueSend computes: val delay = maxOf(0L, MIN_INTERVAL_MS - (SystemClock.elapsedRealtime() - lastSendTimestampMs))"
          - "enqueueSend posts a Runnable to smsHandler with that delay. Inside the Runnable: set lastSendTimestampMs = SystemClock.elapsedRealtime(), then call the existing SmsManager.sendTextMessage() logic."
          - "The enqueueSend method is the ONLY way to invoke SmsManager.sendTextMessage() anywhere in this class."
          - "The existing /pending_sms (OTP) ChildEventListener must call enqueueSend(..., priority = SmsJobPriority.OTP, ...) to ensure OTP messages always preempt bulk."
          - "Start smsHandlerThread in onStartCommand. Stop it in onDestroy via smsHandlerThread.quitSafely()."
          - "This rate limiter is shared by both /pending_sms (OTP) and /bulk_sms_queue (bulk) sends."
        verification:
          - type: contains
            file: "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
            patterns:
              - "MIN_INTERVAL_MS"
              - "smsHandler\\|HandlerThread"
              - "enqueueSend"
              - "lastSendTimestampMs"
              - "SmsJobPriority\\|OTP.*priority\\|priority.*OTP"
              - "removeCallbacksAndMessages\\|BULK_TOKEN"
          - type: anti_pattern_check
            file: "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
            forbidden: "SmsManager.*sendTextMessage.*(?!enqueueSend)"
            description: "All SmsManager.sendTextMessage() calls must go through enqueueSend — direct calls bypass the rate limiter"
        depends_on: []
        priority: critical
        security_notes:
          - "MIN_INTERVAL_MS = 2000ms enforces a maximum of 30 SMS/min, matching BULK_SMS_RATE_LIMIT_PER_MINUTE default. Do not reduce below 1500ms (40/min)."
          - "The Android rate limiter is the last hardware-level defence against carrier blocking. The Cloud Function dispatcher (BCF-02) is the first software-level control."
        notes: >
          ⚠️ FLAG: MIN_INTERVAL_MS is hardcoded to 2000L. For future flexibility, this
          should be configurable via Firebase Remote Config without an APK release. Flag
          for v1.1 scope. Add a TODO comment: // TODO (v1.1): read MIN_INTERVAL_MS from
          Firebase Remote Config with 2000L as fallback.

      - id: BAN-02
        status: "todo"
        task: "Add a `ChildEventListener` for `/bulk_sms_queue` in the foreground service"
        files_to_modify:
          - "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
        changes:
          - "Add: private lateinit var bulkQueueRef: DatabaseReference  // = database.getReference('bulk_sms_queue')"
          - "Add: private val bulkQueueListener = object : ChildEventListener { ... }"
          - "In onChildAdded: extract jobId (snapshot.key), to (snapshot.child('to').value as String), message (snapshot.child('message').value as String), campaignId (snapshot.child('campaignId').value as String)."
          - "Call: enqueueSend(to = to, message = message, priority = SmsJobPriority.BULK, onSuccess = { updateBulkJobStatus(jobId, 'sent', null) }, onFailure = { errorCode -> updateBulkJobStatus(jobId, 'failed', errorCode) })"
          - "CRITICAL — In onChildChanged: BCF-07 retries failed jobs by updating the RTDB node's status back to 'pending' and resetting attempts. Without handling this event, retried jobs are silently ignored. Handle onChildChanged: if snapshot.child('status').value == 'pending': re-call enqueueSend for the job (same logic as onChildAdded). If status is anything else (e.g. 'sent' or 'failed' written by this device), ignore — these are self-writes."
          - "In onChildRemoved: BCF-07 removes nodes after they are fully processed. Cancel any pending Runnables in smsHandler for the removed jobId (via handler token keyed to jobId). This prevents processing a job whose node no longer exists."
          - "In onCancelled: log the RTDB DatabaseError. Do NOT crash. Schedule a listener re-attach with 5-second exponential backoff."
          - "Add private fun updateBulkJobStatus(jobId: String, status: String, error: String?): write Map('status' to status, 'error' to error) to /bulk_sms_queue/{jobId} using updateChildren(). Do NOT call removeValue() — BCF-07 deletes the node after processing."
          - "Attach bulkQueueListener in onStartCommand after Firebase auth succeeds (same lifecycle position as /pending_sms listener)."
          - "Remove bulkQueueListener in onDestroy alongside the /pending_sms listener removal."
          - "Do NOT modify the existing /pending_sms ChildEventListener in any way."
        verification:
          - type: contains
            file: "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
            patterns:
              - "bulk_sms_queue"
              - "bulkQueueListener\\|bulkQueueRef"
              - "updateBulkJobStatus"
              - "status.*sent"
              - "onChildChanged"
              - "onChildRemoved"
              - "onCancelled.*bulk\\|bulk.*onCancelled"
              - "status.*pending.*retry\\|retry.*pending"
          - type: anti_pattern_check
            file: "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
            forbidden: "bulk_sms_queue.*removeValue\\|removeValue.*bulk_sms_queue"
            description: "CRITICAL: bulk queue jobs must NOT be deleted by the Android app. BCF-07 deletes nodes after the status update trigger fires."
        depends_on: [BAN-01, BCFS-04]
        priority: critical
        notes: >
          CRITICAL DIFFERENCE from the /pending_sms (OTP) flow:
            /pending_sms: Android calls removeValue() on the node directly on success.
            /bulk_sms_queue: Android calls updateChildren({ status: 'sent' }) BEFORE any deletion.
          The BCF-07 RTDB onUpdate trigger fires on the status field change, then deletes
          the node after updating Firestore counters. If the Android app calls removeValue()
          directly, the onDelete trigger fires instead of onUpdate — BCF-07 uses onUpdate,
          so the counter update would be silently skipped. This is the most critical
          implementation detail in Phase B3.

      - id: BAN-03
        status: "todo"
        task: "Propagate SmsManager error codes to RTDB and implement send timeout guard"
        files_to_modify:
          - "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
        changes:
          - "In the SmsManager SentIntent PendingIntent callback: map Android result codes to human-readable error strings:"
          - "  SmsManager.RESULT_ERROR_GENERIC_FAILURE → 'generic_failure'"
          - "  SmsManager.RESULT_ERROR_NO_SERVICE → 'no_service'"
          - "  SmsManager.RESULT_ERROR_RADIO_OFF → 'radio_off'"
          - "  SmsManager.RESULT_ERROR_NULL_PDU → 'null_pdu'"
          - "  Other codes → 'unknown_error_$resultCode'"
          - "On any error code: call updateBulkJobStatus(jobId, 'failed', mappedErrorString). BCF-07 handles retry logic."
          - "Timeout guard: in enqueueSend, after posting the send Runnable, post a secondary timeout Runnable to smsHandler with 30_000L delay: if SentIntent has not yet been received (use AtomicBoolean resolved flag), call updateBulkJobStatus(jobId, 'failed', 'send_timeout')."
          - "Do NOT retry on the Android side. All retry logic is server-side in BCF-07."
        verification:
          - type: contains
            file: "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
            patterns:
              - "RESULT_ERROR_GENERIC_FAILURE\\|RESULT_ERROR_NO_SERVICE"
              - "send_timeout"
              - "updateBulkJobStatus.*failed"
              - "AtomicBoolean\\|resolved"
        depends_on: [BAN-02]
        priority: high
        notes: >
          The 30-second timeout guard prevents zombie jobs: if the device silently loses
          SMS capability (no failure callback from the OS), the job is explicitly failed
          after 30 seconds. Without this guard, jobs remain 'pending' indefinitely and
          the campaign can never reach 'completed' state.

      - id: BAN-04
        status: "todo"
        task: "Update foreground service notification to show combined OTP + bulk queue depth"
        files_to_modify:
          - "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
        changes:
          - "Add a ValueEventListener on /bulk_sms_queue that counts children with status='pending'. Store result in: private var bulkQueueDepth: Int = 0."
          - "Update the notification content text to: '{otpQueueDepth} OTP pending, {bulkQueueDepth} bulk pending'."
          - "Refresh the notification whenever either counter changes (call notificationManager.notify() with updated content)."
          - "Do not change the existing notification channel ID, priority, or icon."
        verification:
          - type: contains
            file: "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
            patterns:
              - "bulkQueueDepth\\|bulk pending"
              - "OTP pending"
        depends_on: [BAN-02]
        priority: medium
        notes: >
          ⚠️ FLAG: This is a UX enhancement. If the ValueEventListener for notification
          depth update introduces observable performance overhead on low-end devices, defer
          to v1.1 and keep the existing notification text unchanged.

      - id: BAN-05
        status: "todo"
        task: "Increment Android version code and document bulk SMS changes in build.gradle"
        files_to_modify:
          - "app/build.gradle"
        changes:
          - "Increment versionCode by 1."
          - "Update versionName to reflect bulk SMS release (follow project's existing versioning scheme)."
          - "Add comment above the version block: // v{new version} — Bulk SMS: /bulk_sms_queue listener + cross-queue rate limiter (BAN-01–04)"
        verification:
          - type: contains
            file: "app/build.gradle"
            patterns:
              - "versionCode"
              - "Bulk SMS\\|bulk_sms_queue"
        depends_on: [BAN-01, BAN-02, BAN-03]
        priority: medium

      - id: BAN-06
        status: "todo"
        task: "Support multi-segment SMS (>160 chars) and multi-SIM device configuration"
        files_to_modify:
          - "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
        changes:
          - "Replace SmsManager.sendTextMessage() in the enqueueSend Runnable with a branch: if message.length > 160, call SmsManager.sendMultipartTextMessage(). Use SmsManager.divideMessage(message) to split, then sendMultipartTextMessage(destinationAddress, scAddress, parts, sentIntents, deliveryIntents)."
          - "Multi-SIM support: read subscriptionId from SharedPreferences key 'sms_subscription_id' (default to -1 = system default). If subscriptionId != -1, obtain: val manager = SmsManager.getSmsManagerForSubscriptionId(subscriptionId). Otherwise use SmsManager.getDefault()."
          - "Expose a settings screen toggle (or document as admin-set preference) to configure the preferred SIM subscription ID on dual-SIM devices."
          - "Sent/delivery intents: for multipart messages, provide one SentIntent PendingIntent per part. Report job as 'sent' only when ALL part SentIntents succeed. Report as 'failed' if any part SentIntent returns an error code."
          - "Timeout guard from BAN-03 must cover the entire multipart send (not just one part)."
        verification:
          - type: contains
            file: "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
            patterns:
              - "sendMultipartTextMessage\\|divideMessage"
              - "getSmsManagerForSubscriptionId\\|subscriptionId"
              - "sms_subscription_id\\|SharedPreferences.*subscription"
          - type: anti_pattern_check
            file: "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
            forbidden: "sendTextMessage.*message\\.length.*>\\s*160"
            description: "Messages over 160 chars must use sendMultipartTextMessage, never sendTextMessage (which silently truncates)"
        depends_on: [BAN-02, BAN-03]
        priority: high
        notes: >
          The bulk SMS campaign schema allows messages up to 459 chars (3 segments).
          Without sendMultipartTextMessage, messages >160 chars are silently truncated
          by the Android API, delivering incomplete messages and wasting credits.
          This is a silent data-integrity bug — no error is returned on truncation.

      - id: BAN-07
        status: "todo"
        task: "Implement Firebase Auth token refresh and RTDB listener reconnection logic"
        files_to_modify:
          - "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
        changes:
          - "Add FirebaseAuth.getInstance().addAuthStateListener in onStartCommand: if user signs out or token is revoked, immediately stop both /pending_sms and /bulk_sms_queue listeners, then attempt re-auth."
          - "Add FirebaseDatabase.getInstance().getReference('.info/connected').addValueEventListener to detect RTDB connectivity state. When connected = false: log 'RTDB disconnected, queuing paused'. When connected = true: re-attach both ChildEventListeners if they are not already active."
          - "Reconnection backoff: on repeated disconnections within 60 seconds, apply exponential backoff (2s, 4s, 8s, max 60s) before re-attaching listeners to avoid hammering the server."
          - "Token refresh: call FirebaseAuth.getInstance().currentUser?.getIdToken(true) before re-attaching listeners after a connectivity gap > 30 minutes, to force an ID token refresh."
          - "Log all connectivity transitions at INFO level. Do NOT log auth tokens or user IDs at any log level."
        verification:
          - type: contains
            file: "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
            patterns:
              - ".info/connected\\|connected.*RTDB"
              - "addAuthStateListener\\|AuthStateListener"
              - "reconnect\\|re-attach\\|reattach"
              - "getIdToken.*true\\|forceRefresh"
        depends_on: [BAN-02]
        priority: high
        notes: >
          Without reconnection logic, an RTDB connectivity blip (e.g. network timeout)
          will silently stop job processing. The service remains running but no new jobs
          are processed until the app is restarted. This is invisible to the operator
          and will cause stalled campaigns.

      - id: BAN-08
        status: "todo"
        task: "Add wake-lock management and battery optimization bypass guidance for dedicated devices"
        files_to_modify:
          - "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
          - "app/src/main/AndroidManifest.xml"
          - "docs/Modification Bulk/device-setup-guide.md"
        changes:
          - "In SmsDispatchService.onStartCommand: acquire a PARTIAL_WAKE_LOCK when there are jobs in the bulk queue (bulkQueueDepth > 0). Release it when bulkQueueDepth returns to 0. Wake lock tag: 'Authenticator:BulkSmsWakeLock'."
          - "In AndroidManifest.xml: add permission: <uses-permission android:name='android.permission.WAKE_LOCK' />"
          - "Create docs/Modification Bulk/device-setup-guide.md documenting the recommended setup for dedicated SMS gateway devices:"
          - "  (1) Disable battery optimisation for the Authenticator app: Settings > Battery > Battery Optimisation > All Apps > Authenticator > Don't Optimise."
          - "  (2) Enable auto-start (if OEM supports it) to ensure the foreground service survives reboots."
          - "  (3) Disable adaptive battery and screen-off restrictions for the app."
          - "  (4) Keep the device on a stable Wi-Fi + power connection; mobile data alone may cause higher RTDB latency."
        verification:
          - type: contains
            file: "app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
            patterns:
              - "WAKE_LOCK\\|WakeLock\\|wakeLock"
              - "PowerManager"
          - type: contains
            file: "app/src/main/AndroidManifest.xml"
            patterns:
              - "android.permission.WAKE_LOCK"
          - type: file_exists
            path: "docs/Modification Bulk/device-setup-guide.md"
        depends_on: [BAN-04]
        priority: medium
        notes: >
          On stock Android, aggressive battery optimisation kills foreground services
          during low-battery or idle periods. For a dedicated SMS gateway device, the
          operator must explicitly disable battery optimisation. The device-setup-guide.md
          is the runbook for provisioning new gateway devices.

      - id: BAN-09
        status: "todo"
        task: "Write Android unit and instrumentation tests for BAN-01 through BAN-07"
        files_to_create:
          - "app/src/test/java/com/authenticator/service/SmsRateLimiterTest.kt"
          - "app/src/test/java/com/authenticator/service/BulkQueueListenerTest.kt"
          - "app/src/androidTest/java/com/authenticator/service/SmsDispatchIntegrationTest.kt"
        test_cases:
          unit_SmsRateLimiterTest:
            - "Enqueue 5 BULK jobs: timestamps are MIN_INTERVAL_MS apart (Robolectric ShadowSystemClock)."
            - "Enqueue 1 OTP job after 4 BULK jobs are queued: OTP job fires first (delay == 0), BULK jobs continue after."
            - "Two concurrent enqueueSend OTP calls: both execute, neither is dropped."
            - "MIN_INTERVAL_MS = 2000: no two SMS fire less than 1990ms apart (10ms jitter tolerance)."
          unit_BulkQueueListenerTest:
            - "onChildAdded with status='pending': enqueueSend called once."
            - "onChildChanged with status='pending': enqueueSend called again (retry path)."
            - "onChildChanged with status='sent': enqueueSend NOT called (self-write filter)."
            - "onChildRemoved: pending Runnable for that jobId is cancelled, no NullPointerException."
            - "onCancelled: listener re-attach is scheduled with backoff."
          instrumentation_SmsDispatchIntegrationTest:
            - "Service starts, connects to Firebase Test emulator, receives 3 bulk jobs: updateBulkJobStatus called 3 times with 'sent'."
            - "RTDB connection drops mid-batch: service detects disconnection, reconnects, continues processing remaining jobs."
        verification:
          - type: command
            run: "cd app && ./gradlew testDebugUnitTest --tests '*.SmsRateLimiterTest' --tests '*.BulkQueueListenerTest'"
            expect_exit: 0
        depends_on: [BAN-01, BAN-02, BAN-03, BAN-06, BAN-07]
        priority: critical
        notes: >
          Use Robolectric for unit tests (no emulator needed). For instrumentation tests,
          point Firebase config at the local emulator suite:
          FirebaseApp.initializeApp(context, FirebaseOptions.Builder()...build())
          Set RTDB emulator host in test setup: database.useEmulator('localhost', 9000).

      - id: BAN-10
        status: "todo"
        task: "Build, sign, and deploy updated APK to dedicated SMS gateway device(s)"
        files_to_modify:
          - "app/build.gradle"
        changes:
          - "Ensure keystore credentials are stored in environment variables (not hardcoded in build.gradle): KEYSTORE_PATH, KEYSTORE_PASS, KEY_ALIAS, KEY_PASS."
          - "Build release APK: ./gradlew assembleRelease"
          - "Verify APK signature: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"
          - "Install on device via ADB: adb install -r app/build/outputs/apk/release/app-release.apk"
          - "Verify service auto-starts after install: adb shell am start-foreground-service com.authenticator/.service.SmsDispatchService"
          - "Rollback procedure: keep the previous APK at a known path (e.g. releases/app-{previousVersionCode}-release.apk). To roll back: adb install -r releases/app-{previousVersionCode}-release.apk."
          - "Document the gateway device IMEI/serial number, Android version, and SIM card details in the device registry at docs/Modification Bulk/device-registry.md."
        verification:
          - type: anti_pattern_check
            file: "app/build.gradle"
            forbidden: 'storePassword.*=.*[''"][^$]'
            description: "Keystore password must never be hardcoded in build.gradle — must reference env var or gradle.properties (gitignored)"
          - type: manual_check
            description: "APK installed on device, SmsDispatchService foreground notification visible, OTP + bulk smoke tests pass."
        depends_on: [BAN-01, BAN-02, BAN-03, BAN-06, BAN-07, BAN-09, BAN-05]
        priority: critical
        notes: >
          Rollback APK must be retained for at least 30 days post-deployment.
          If the device is remote, document the ADB-over-TCP procedure or
          TeamViewer/MDM-based deployment alternative in device-setup-guide.md.

  # ─────────────────────────────────────────────────────────────────────────────
  - id: B4
    name: "Web UI (React) Additions"
    blocking: false
    description: >
      Add bulk SMS pages and components to the existing React dashboard.
      All new files live under web/src/pages/bulk/ and web/src/components/bulk/.
      The feature is gated by the VITE_BULK_SMS_ENABLED environment variable.
      Existing routes, components, and pages must remain unmodified unless a
      task explicitly states an edit. Do not restructure any existing file.
    items:
      - id: BUI-00
        status: "todo"
