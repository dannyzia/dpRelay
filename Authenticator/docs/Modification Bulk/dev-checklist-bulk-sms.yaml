    2. Deploy Phase B2 Cloud Functions — new exports only, no existing function modified.
    3. Release Phase B3 Android APK — new RTDB listener alongside existing /pending_sms listener.
    4. Enable Phase B4 UI — set VITE_BULK_SMS_ENABLED=true in hosting env only after APK is live.
    Rollback: set VITE_BULK_SMS_ENABLED=false to hide UI instantly. Roll back CF via
    firebase functions:rollback. Redeploy previous APK. No data migration needed at any step.
