# Development Checklist – Authenticator Service: Bulk SMS Extension
# Format: YAML 1.2
# AI Instructions:
# - This checklist EXTENDS docs/Modification 3/dev-checklist.yaml. The base system is assumed complete.
# - Parse this file at the start of each bulk SMS implementation session.
# - Do NOT begin Phase B2 until Phase B1 is fully complete.
# - Do NOT begin Phase B3 until BCF-01 through BCF-03 (B2) are deployed to emulators.
# - The existing OTP flow (sendOtp, verifyOtp, otpStatus) must remain UNTOUCHED
#   unless a task explicitly states a modification. Any accidental regression is BLOCK_DEPLOY.
# - Track completion state in your agent or session tooling.

version: "1.1"
project: "AuthenticatorService — Bulk SMS Extension"
total_phases: 6
extends: "docs/Modification 3/dev-checklist.yaml"

non_regression_constraint: >
  The existing sendOtp → /pending_sms → Android SmsDispatchService → status flow
  must remain fully operational throughout all phases. No existing Cloud Function,
  RTDB node, Firestore collection, or Android class may be removed or renamed.
  All changes are strictly additive unless a task explicitly states otherwise.
  Before merging any PR that touches functions/index.js or SmsDispatchService.kt,
  BTST-01 (OTP regression test suite) must pass with 0 failures.

architecture_decisions:
  recipient_storage: >
    Phone numbers from the uploaded CSV are chunked into batches of 100 and stored
    as Firestore sub-collection documents under bulk_campaigns/{campaignId}/recipient_batches/.
    This yields at most 100 Firestore documents for a 10,000-recipient campaign, enabling
    cheap cursor-based pagination by the dispatcher without downloading a full CSV from Storage.
    The raw CSV is also retained in Firebase Storage for audit/re-processing purposes.
  job_queue: >
    RTDB /bulk_sms_queue/{jobId} serves as the transient job queue consumed by the
    Android device — identical in spirit to /pending_sms but separate to prevent
    any coupling with the OTP flow. Jobs are written by the dispatchBulkJobs scheduler
    and deleted by the BCF-07 RTDB trigger after final status resolution.
  rate_limiting: >
    Two independent layers enforce carrier-safe send rates:
    (1) Cloud Functions layer — dispatchBulkJobs pushes at most BULK_DISPATCH_BATCH_SIZE
        jobs per minute to RTDB (default 30).
    (2) Android layer — MIN_INTERVAL_MS (2000 ms) enforces a minimum 2-second gap between
        any two SMS sends across both OTP and bulk queues combined.
    Both layers must always be active. Neither alone is sufficient.
  counter_updates: >
    The Android app NEVER writes to Firestore. It only updates the RTDB job status field
    (pending → sent | failed). A Cloud Functions RTDB onUpdate trigger (BCF-07) reacts to
    those status changes and atomically increments sentCount/failedCount in the Firestore
    bulk_campaigns document. This keeps Firestore business logic server-side and the
    Android app simple.
  bulk_credits: >
    Bulk SMS credits are kept in a separate Firestore collection (bulk_credits) that is
    entirely independent of app_credits (OTP credits). This allows different pricing,
    independent quota management, and zero risk of OTP and bulk credit pools interfering.
  deterministic_job_ids: >
    Each RTDB job node is keyed as "{campaignId}:{recipientIndex}" (e.g.
    "abc123:0042"). This makes the dispatch operation idempotent: if dispatchBulkJobs
    fires twice in the same minute, the second run overwrites RTDB nodes with identical
    data — no duplicate sends result.

critical_path:
  - phase: B1
    name: "Firestore Schema, RTDB Rules & Firebase Storage Setup"
    must_complete_before: [B2, B3, B4]
    reason: >
      All Cloud Functions (B2), Android code (B3), and React UI (B4) depend on the
      Firestore collection schemas, RTDB rules for /bulk_sms_queue, Firebase Storage
      rules for CSV uploads, composite Firestore indexes, and environment variables
      defined in this phase.
  - phase: B2
    name: "Cloud Functions for Bulk SMS"
    must_complete_before: [B3, B4, B5]
    reason: >
      The Android app requires BCF-07 (RTDB trigger) and BCF-09 (index.js registration)
      to be deployed before end-to-end counter tracking can be verified. The React UI
      requires BCF-01 (createBulkCampaign), BCF-03 (getCampaignStatus), BCF-04/05
      (pause/cancel) deployed to emulators before UI integration tests can pass.
  - phase: B3
    name: "Android App Modifications"
    must_complete_before: [B5]
    reason: >
      The rate limiter (BAN-01) and /bulk_sms_queue listener (BAN-02) must be present
      in the APK before any end-to-end or manual tests in Phase B5 can run against
      a real device.
  - phase: B4
    name: "Web UI (React) Additions"
    must_complete_before: [B5]
    reason: >
      The dashboard pages (BulkCampaignsPage, CreateCampaignPage, CampaignDetailPage)
      are required for the manual verification steps in BTST-05.
  - phase: B5
    name: "Testing & Monitoring"
    must_complete_before: [B6]
    reason: "B6 documentation and runbook must be written against the deployed, verified system."
  - phase: B6
    name: "Documentation, Environment Variables & Runbook"
    must_complete_before: []
    reason: "Final sign-off gate. BDOC-02 (runbook) must be complete before BTST-07 (production deploy) is signed off."

phases:
  # ─────────────────────────────────────────────────────────────────────────────
  - id: B1
    name: "Firestore Schema, RTDB Rules & Firebase Storage Setup"
    blocking: true
    description: >
      Establish every data-layer artefact the bulk SMS feature depends on.
      Covers: three new top-level Firestore collections (bulk_campaigns, bulk_credits,
      bulk_transactions) plus one new collection (bulk_packages) and one sub-collection
      (recipient_batches under bulk_campaigns); RTDB security rules for /bulk_sms_queue;
      Firebase Storage security rules for CSV uploads; Firestore composite indexes; and
      new environment variables in .env.example files. No existing Firestore collections,
      RTDB nodes, security rules, or env vars may be modified in this phase.
    items:
      - id: BCFS-01
        status: "todo"
        task: "Author bulk SMS data model documentation and define `bulk_campaigns` collection schema"
        files_to_create:
          - "docs/Modification Bulk/data-model-bulk.md"
        schema:
          collection: "bulk_campaigns"
          document_id: "auto-generated via crypto.randomUUID() at campaign creation time"
          fields:
            campaignId: "string — mirrors the document ID for convenient client-side access"
            ownerUid: "string — Firebase Auth UID of the creating user"
            appId: "string — must reference an active entry in RTDB /registered_apps/{appId}"
            name: "string — human-readable label (max 100 chars, required)"
            message: "string — SMS body text (1–459 chars; 160 = 1 SMS, 306 = 2, 459 = 3)"
            status: "string enum: 'pending' | 'sending' | 'paused' | 'completed' | 'cancelled' | 'failed'"
            totalCount: "number — total valid recipients parsed from the uploaded CSV"
            sentCount: "number — atomically incremented by BCF-07 when a job transitions to 'sent'"
            failedCount: "number — atomically incremented by BCF-07 when a job permanently fails (attempts >= maxRetries)"
            dispatchCursor: "number — zero-based index of the next recipient_batches document to dispatch"
            createdAt: "Firestore Timestamp"
            startedAt: "Firestore Timestamp | null — set on first dispatch by dispatchBulkJobs"
            completedAt: "Firestore Timestamp | null — set by BCF-07 when sentCount + failedCount == totalCount"
            estimatedFinishAt: "Firestore Timestamp | null — recalculated each dispatch tick"
            csvStoragePath: "string — Firebase Storage path: bulk_campaigns/{campaignId}/recipients.csv"
            rateLimit: "number — max SMS per minute for this campaign (1–60, default from BULK_SMS_RATE_LIMIT_PER_MINUTE env var)"
            maxRetries: "number — max retry attempts per failed job (1–5, default BULK_SMS_MAX_RETRIES)"
            maxSmsPerCampaign: "number — hard cap enforced at createBulkCampaign time (default BULK_SMS_MAX_PER_CAMPAIGN)"
            bulkCreditTxId: "string | null — references bulk_transactions/{txId} that funded this campaign"
            pausedAt: "Firestore Timestamp | null — set by pauseCampaign CF when status transitions to 'paused'"
            cancelledAt: "Firestore Timestamp | null — set by cancelCampaign CF; null for non-cancelled campaigns"
            updatedAt: "Firestore Timestamp — updated on every status transition; enables admin list ordering"
            totalBatches: "number — ceil(totalCount / 100); total number of recipient_batches documents"
            segmentsPerMessage: "number — 1, 2, or 3 (message.length ≤160=1, ≤306=2, ≤459=3). Snapshotted at creation so billing is stable."
            totalCost: "number — totalCount × segmentsPerMessage. Bulk credits atomically deducted at campaign creation via runTransaction."
          sub_collections:
            - name: "recipient_batches"
              document_id: "zero-padded batch index, e.g. '0000', '0001', …, '0099'"
              fields:
                batchIndex: "number — same as document ID parsed to integer"
                phones: "array<string> — up to 100 E.164 phone numbers per document"
                dispatched: "boolean — set to true by dispatchBulkJobs after all phones in this batch are queued"
            - name: "failed_jobs"
              document_id: "jobId — deterministic {campaignId}:{recipientIndex} matching the RTDB key"
              fields:
                jobId: "string — mirrors document ID"
                phoneHash: "string — SHA-256 hex hash of the E.164 phone number. NEVER store raw phone PII."
                error: "string — final error code from SmsManager mapping or 'send_timeout'"
                attempts: "number — total attempt count when permanently failed"
                failedAt: "Firestore Timestamp"
                recipientIndex: "number — zero-based index into the total recipient list"
        verification:
          - type: file_exists
            path: "docs/Modification Bulk/data-model-bulk.md"
          - type: contains
            file: "docs/Modification Bulk/data-model-bulk.md"
            patterns:
              - "bulk_campaigns"
              - "dispatchCursor"
              - "recipient_batches"
              - "sentCount"
              - "failedCount"
              - "pausedAt"
              - "cancelledAt"
              - "totalCost"
              - "segmentsPerMessage"
              - "failed_jobs"
              - "phoneHash"
        depends_on: []
        priority: critical
        notes: >
          The dispatchCursor points to the next recipient_batches document index, not a raw
          phone-number index. Each batch holds up to 100 phones, so a 10,000-recipient campaign
          produces exactly 100 batch documents and a cursor range of 0–99.
          Storing phones in batches (rather than individual Firestore documents per phone) keeps
          the sub-collection at ≤100 documents for the maximum campaign size, making reads cheap.

      - id: BCFS-02
        status: "todo"
        task: "Define `bulk_credits`, `bulk_transactions`, and `bulk_packages` collection schemas"
        files_to_modify:
          - "docs/Modification Bulk/data-model-bulk.md"
        schema:
          - collection: "bulk_credits"
            document_id: "appId — one document per registered app"
            fields:
              appId: "string"
              balance: "number — current bulk SMS credits available"
              lifetimePurchased: "number — total credits ever purchased (audit trail)"
              updatedAt: "Firestore Timestamp"
              lastTransactionId: "string | null — references most recent approved bulk_transactions doc"
              ownerUid: "string — Firebase Auth UID of the app owner. Populated by approveBulkCredit on first approval; used by Firestore security rules for non-admin read access. CRITICAL: appId ≠ auth.uid — they are different identifiers."
          - collection: "bulk_transactions"
            document_id: "auto-generated UUID (crypto.randomUUID)"
            fields:
              txId: "string — mirrors document ID"
              appId: "string"
              packageId: "string — references bulk_packages/{packageId} at time of purchase"
              smsQuota: "number — credits to be added on approval (snapshotted from package)"
              amountBdt: "number — price in BDT (snapshotted from package)"
              trxId: "string | null — bKash TrxID submitted by client via submitBulkTrxId"
              status: "string enum: 'pending' | 'approved' | 'rejected'"
              requestedAt: "Firestore Timestamp"
              approvedAt: "Firestore Timestamp | null"
              adminUid: "string | null"
              adminNotes: "string | null"
          - collection: "bulk_packages"
            document_id: "auto-generated UUID"
            fields:
              packageId: "string — mirrors document ID"
              name: "string (e.g. 'Bulk Starter — 500 SMS')"
              smsQuota: "number — bulk credits granted on approval"
              priceBdt: "number — price in BDT"
              isActive: "boolean"
              createdAt: "Firestore Timestamp"
        verification:
          - type: contains
            file: "docs/Modification Bulk/data-model-bulk.md"
            patterns:
              - "bulk_credits"
              - "bulk_transactions"
              - "bulk_packages"
              - "balance"
              - "smsQuota"
              - "already intentionally separate from app_credits"
        depends_on: [BCFS-01]
        priority: critical
        notes: >
          bulk_credits is intentionally separate from app_credits (OTP credits) to allow
          independent pricing, quota management, and auditing for bulk vs. OTP workloads.
          The billing flow mirrors the existing OTP billing pattern (BK-00 through BK-03)
          but targets a completely different Firestore collection hierarchy.

      - id: BCFS-03
        status: "todo"
        task: "Add Firestore security rules for all four new bulk collections"
        files_to_modify:
          - "firestore.rules"
        rules:
          bulk_campaigns:
            read: "request.auth != null && (request.auth.token.admin == true || resource.data.ownerUid == request.auth.uid)"
            write: "false  # Cloud Functions Admin SDK only"
            sub_collection_recipient_batches:
              read: "request.auth != null && (request.auth.token.admin == true || get(/databases/$(database)/documents/bulk_campaigns/$(campaignId)).data.ownerUid == request.auth.uid)"
              write: "false  # Cloud Functions Admin SDK only"
          bulk_credits:
            read: "request.auth != null && (request.auth.token.admin == true || resource.data.ownerUid == request.auth.uid)"
            write: "false  # Cloud Functions Admin SDK only"
          bulk_transactions:
            read: "request.auth != null && (request.auth.token.admin == true || resource.data.appId == request.auth.uid)"
            write: "false  # Cloud Functions Admin SDK only"
          bulk_packages:
            read: "request.auth != null"
            write: "false  # upsertBulkPackage CF (Admin SDK) only"
        verification:
          - type: file_exists
            path: "firestore.rules"
          - type: contains
            file: "firestore.rules"
            patterns:
              - "bulk_campaigns"
              - "bulk_credits"
              - "bulk_transactions"
              - "bulk_packages"
              - "ownerUid"
          - type: anti_pattern_check
            file: "firestore.rules"
            forbidden: "bulk_campaigns.*write.*true"
            description: "bulk_campaigns must never allow direct client writes"
        depends_on: [BCFS-01, BCFS-02]
        priority: critical
        security_notes:
          - "Client SDK can only read its own campaigns (ownerUid guard). Cross-tenant reads are impossible."
          - "All writes go through Cloud Functions using Admin SDK — rules are defence-in-depth only."
          - "recipient_batches inherits parent campaign ownership via Firestore get() call to prevent phone number enumeration by other tenants."
          - "CRITICAL BUG FIX: bulk_credits rule uses resource.data.ownerUid (not resource.data.appId) for non-admin reads. appId is the app registration ID and is NOT the same as the Firebase Auth UID. The original appId == auth.uid comparison would deny ALL non-admin reads, making the balance unreadable by the app owner. ownerUid is populated by approveBulkCredit on first credit approval."

      - id: BCFS-04
        status: "todo"
        task: "Add RTDB security rules and `.indexOn` config for the new `/bulk_sms_queue` node"
        files_to_modify:
          - "database.rules.json"
        rules:
          "/bulk_sms_queue/{jobId}":
            read: "auth != null && (auth.token.admin == true || auth.token.role == 'authenticator')"
            write: "false  # Cloud Functions Admin SDK only"
            ".indexOn": ["campaignId", "status"]
        verification:
          - type: contains
            file: "database.rules.json"
            patterns:
              - "bulk_sms_queue"
              - "authenticator"
              - "indexOn"
          - type: anti_pattern_check
            file: "database.rules.json"
            forbidden: "pending_sms.*bulk_sms_queue\\|bulk_sms_queue.*pending_sms"
            description: "The two queue nodes must have independent rule blocks — never merge them"
        depends_on: [BCFS-01]
        priority: critical
        security_notes:
          - "The Android Authenticator app reads /bulk_sms_queue using the 'authenticator' custom RTDB claim, consistent with the existing /pending_sms pattern."
          - "Write is false for all non-Admin SDK callers — only Cloud Functions may create or update job entries."
          - ".indexOn [campaignId, status] is required for cancelCampaign (BCF-05) to efficiently query and delete all pending jobs belonging to a campaign."

      - id: BCFS-05
        status: "todo"
        task: "Add Firebase Storage security rules for CSV bulk recipient uploads"
        files_to_modify:
          - "storage.rules"
        rules:
          "bulk_campaigns/{campaignId}/recipients.csv":
            read: >
              request.auth != null &&
              (request.auth.token.admin == true ||
               firestore.get(/databases/(default)/documents/bulk_campaigns/$(campaignId)).data.ownerUid == request.auth.uid)
            write: >
              request.auth != null &&
              request.resource.size < 5 * 1024 * 1024 &&
              request.resource.contentType.matches('text/.*')
        verification:
          - type: file_exists
            path: "storage.rules"
          - type: contains
            file: "storage.rules"
            patterns:
              - "bulk_campaigns"
              - "5 * 1024 * 1024"
              - "text/"
              - "ownerUid"
        depends_on: [BCFS-01]
        priority: critical
        security_notes:
          - "5 MB size limit is enforced at the Storage rule level (~100,000 rows). The 10,000-row campaign cap is enforced separately in createBulkCampaign (BCF-01)."
          - "Content-type check (text/*) prevents upload of binary files or executables masquerading as CSVs."
          - "The Firestore cross-service read is supported in Firebase Security Rules language v2."

      - id: BCFS-06
        status: "todo"
        task: "Create Firestore composite indexes for bulk collections"
        files_to_modify:
          - "firestore.indexes.json"
        indexes:
          - collection: "bulk_campaigns"
            fields: ["ownerUid ASC", "createdAt DESC"]
            description: "Powers BulkCampaignsPage list: campaigns for a given user, newest first"
          - collection: "bulk_campaigns"
            fields: ["appId ASC", "status ASC", "createdAt DESC"]
            description: "Powers admin campaign list and dispatchBulkJobs query for sending-status campaigns"
          - collection: "bulk_campaigns"
            fields: ["status ASC", "dispatchCursor ASC"]
            description: "Powers dispatchBulkJobs: efficient scan for campaigns in 'sending' state with pending batches"
          - collection: "bulk_transactions"
            fields: ["appId ASC", "status ASC", "requestedAt DESC"]
            description: "Powers admin bulk transaction approval list"
          - collection: "bulk_campaigns"
            fields: ["cancelledAt DESC"]
            description: "Admin queries to list recently cancelled campaigns for audit"
          - collection: "bulk_campaigns"
            fields: ["ownerUid ASC", "updatedAt DESC"]
            description: "Admin and owner queries ordered by last status update"
          - collection: "bulk_campaigns" # collection group index for failed_jobs
            collectionGroup: "failed_jobs"
            fields: ["failedAt DESC"]
            description: "Admin collection group query to find recently failed jobs across all campaigns"
        verification:
          - type: file_exists
            path: "firestore.indexes.json"
          - type: contains
            file: "firestore.indexes.json"
            patterns:
              - "bulk_campaigns"
              - "ownerUid"
              - "dispatchCursor"
              - "bulk_transactions"
        depends_on: [BCFS-01, BCFS-02]
        priority: high
        notes: >
          Deploy indexes before running end-to-end tests: firebase deploy --only firestore:indexes
          In production, indexes take 1–10 minutes to build. Queries against unbuilt indexes
          return an error — plan deployment at least 15 minutes before live testing.

      - id: BCFS-07
        status: "todo"
        task: "Update `.env.example` files with all new bulk SMS environment variables"
        files_to_modify:
          - "functions/.env.example"
          - "web/.env.example"
        new_vars:
          functions:
            - "BULK_SMS_RATE_LIMIT_PER_MINUTE=   # Default SMS/min per campaign. Carrier-safe default: 30. Max: 60."
            - "BULK_SMS_MAX_PER_CAMPAIGN=         # Hard cap on recipients per campaign. Default: 10000."
            - "BULK_SMS_MAX_RETRIES=              # Max retry attempts per failed job. Default: 3."
            - "BULK_SMS_DISPATCH_BATCH_SIZE=      # Jobs pushed to RTDB per scheduler tick. Default: 30."
            - "BULK_SMS_JOB_TTL_HOURS=            # Hours before orphaned bulk jobs are purged. Default: 48."
          web:
            - "VITE_BULK_SMS_ENABLED=             # Set to 'true' to show Bulk SMS UI. Default: false."
            - "VITE_BULK_SMS_MAX_CSV_ROWS=        # Max rows the CSV preview validates client-side. Default: 10000."
        verification:
          - type: contains
            file: "functions/.env.example"
            patterns:
              - "BULK_SMS_RATE_LIMIT_PER_MINUTE"
              - "BULK_SMS_MAX_PER_CAMPAIGN"
              - "BULK_SMS_DISPATCH_BATCH_SIZE"
          - type: anti_pattern_check
            file: "functions/.env.example"
            forbidden: "BULK_SMS_RATE_LIMIT_PER_MINUTE=\\s*[0-9]"
            description: ".env.example must contain empty placeholders — not literal integer defaults that could be cargo-culted into production"
          - type: contains
            file: "web/.env.example"
            patterns:
              - "VITE_BULK_SMS_ENABLED"
              - "VITE_BULK_SMS_MAX_CSV_ROWS"
        depends_on: [BCFS-01]
        priority: critical
        notes: >
          Actual in-code defaults (e.g. BULK_RATE_LIMIT_DEFAULT = 30) are defined in
          functions/src/bulk/constants.js (BCF-00) and read from process.env at runtime
          with fallback to those constants. The .env.example values are documentation-only.

      - id: BCFS-08
        status: "todo"
        task: "Document and enforce the credits-per-segment billing rule across all layers"
        files_to_modify:
          - "docs/Modification Bulk/data-model-bulk.md"
          - "functions/src/bulk/constants.js"
        rules:
          credit_billing_model: >
            Credits are charged per SMS SEGMENT, not per message.
            1 segment  = message.length <= 160 chars = 1 credit
            2 segments = message.length <= 306 chars = 2 credits
            3 segments = message.length <= 459 chars = 3 credits
            This rule must be applied consistently in:
            (1) BCF-01 createBulkCampaign when computing totalCost,
            (2) BUI-02 CreateCampaignPage character counter UI,
            (3) BUI-05 BulkCreditsWidget insufficient-balance warning,
            (4) any admin reporting or billing reconciliation.
        verification:
          - type: contains
            file: "functions/src/bulk/constants.js"
            patterns:
              - "SEGMENT_1_MAX_CHARS\\s*=\\s*160\\|160.*segment"
              - "SEGMENT_2_MAX_CHARS\\s*=\\s*306\\|306.*segment"
              - "SEGMENT_3_MAX_CHARS\\s*=\\s*459\\|459.*segment"
              - "segmentsPerMessage\\|calcSegments"
          - type: contains
            file: "docs/Modification Bulk/data-model-bulk.md"
            patterns:
              - "credits.*segment\\|segment.*credit"
              - "160.*1.*credit\\|1.*credit.*160"
        depends_on: [BCFS-01, BCF-00]
        priority: critical
        notes: >
          This rule must be implemented as a shared utility function in constants.js:
            export function calcSegmentsPerMessage(messageText) {
              if (messageText.length <= 160) return 1;
              if (messageText.length <= 306) return 2;
              return 3;
            }
          Both BCF-01 (backend) and BUI-02 (frontend) must call equivalent logic.
          The frontend PapaParse-based preview must show: '1 credit/recipient (1 segment)'
          or '2 credits/recipient (2 segments)' based on the message textarea content.

  # ─────────────────────────────────────────────────────────────────────────────
  - id: B2
    name: "Cloud Functions for Bulk SMS"
    blocking: true
    description: >
      Implement all server-side business logic for bulk SMS as new Cloud Functions.
      No existing Cloud Functions (sendOtp, verifyOtp, otpStatus, registerApp,
      revokeApp, requestCredit, approveCredit, etc.) may be modified except where
      a task explicitly states otherwise. All new functions follow the same auth
      patterns as existing functions: admin operations require a Firebase Auth ID
      token with admin custom claim; client operations require appId + appSecret
      validation against /registered_apps in RTDB.
    items:
      - id: BCF-00
        status: "todo"
        task: "Create shared bulk SMS constants module and CSV/phone validator utilities"
        files_to_create:
          - "functions/src/bulk/constants.js"
          - "functions/src/bulk/validators.js"
        behaviour:
          - "constants.js: export BULK_RATE_LIMIT_DEFAULT, BULK_MAX_PER_CAMPAIGN, BULK_MAX_RETRIES, BULK_DISPATCH_BATCH_SIZE, BULK_JOB_TTL_HOURS, BULK_MAX_MESSAGE_CHARS (459), BULK_MIN_MESSAGE_CHARS (1), BULK_PHONE_REGEX (/^\\+[1-9]\\d{6,14}$/)."
          - "Each constant reads from process.env first, falls back to the hardcoded safe default. Never throw on missing env var — use fallback."
          - "validators.js: export validateE164(phone: string): boolean."
          - "validators.js: export validateMessage(msg: string): { valid: boolean, error: string | null }."
          - "validators.js: export parseCsvBuffer(buffer: Buffer, maxRows: number): { phones: string[], errors: Array<{line: number, value: string, reason: string}> }."
          - "parseCsvBuffer must: strip UTF-8 BOM, normalise CRLF to LF, skip blank lines, trim whitespace per cell, validate E.164 format, deduplicate phone numbers, and return structured errors with 1-based line numbers."
          - "parseCsvBuffer accepts single-column CSVs (phone number only) or two-column CSVs where the first column is the phone. Any additional columns are silently ignored."
        verification:
          - type: file_exists
            paths:
              - "functions/src/bulk/constants.js"
              - "functions/src/bulk/validators.js"
          - type: contains
            file: "functions/src/bulk/constants.js"
            patterns:
              - "BULK_RATE_LIMIT_DEFAULT"
              - "process\\.env"
              - "BULK_PHONE_REGEX"
              - "BULK_MAX_PER_CAMPAIGN"
          - type: contains
            file: "functions/src/bulk/validators.js"
            patterns:
              - "validateE164"
              - "parseCsvBuffer"
              - "\\+\\[1-9\\]"
          - type: anti_pattern_check
            file: "functions/src/bulk/constants.js"
            forbidden: "BULK_RATE_LIMIT_DEFAULT\\s*=\\s*0"
            description: "Rate limit default must never be 0 — would cause infinite dispatch loop"
        depends_on: [BCFS-07]
        priority: critical
        notes: >
          All other bulk Cloud Functions import from this module. The E.164 regex and
          rate-limit constants must not be duplicated across files. Any change to the
          regex or limits is made here and propagates automatically.

      - id: BCF-01
        status: "todo"
        task: "Implement `createBulkCampaign` Cloud Function (HTTPS POST, multipart/form-data)"
        files_to_create:
          - "functions/src/bulk/createBulkCampaign.js"
        behaviour:
          - "Authentication: validate appId + appSecret against RTDB /registered_apps/{appId} (same timingSafeEqual pattern as sendOtp). App must be active."
          - "Accept: multipart/form-data with fields { appId, appSecret, name, message, rateLimit?, idempotencyKey? } and file upload csvFile."
          - "Idempotency: if idempotencyKey is provided, check Firestore bulk_campaigns for an existing doc with the same appId + idempotencyKey. If found, return 200 with the existing campaignId (do not create a duplicate campaign)."
          - "Step 1: Validate appId + appSecret. Return 403 on mismatch."
          - "Step 2: Validate message using validateMessage(). Return 400 if invalid (empty, or > 459 chars)."
          - "Step 3: Compute segmentsPerMessage = calcSegmentsPerMessage(message) from constants.js (1, 2, or 3)."
          - "Step 4: Parse CSV using parseCsvBuffer(csvFile.buffer, BULK_MAX_PER_CAMPAIGN). Return 400 with { error: 'csv_parse_errors', errors: first10Errors } if any rows are invalid."
          - "Step 5: Enforce totalCount <= BULK_MAX_PER_CAMPAIGN. Return 400 { error: 'max_campaign_size_exceeded', limit: BULK_MAX_PER_CAMPAIGN } if exceeded."
          - "Step 6: Compute totalCost = totalCount * segmentsPerMessage."
          - "Step 7: Atomically check AND deduct credits using Firestore runTransaction on bulk_credits/{appId}:\n    - Read current balance.\n    - If balance < totalCost: abort, return 402 { error: 'insufficient_bulk_credits', balance: currentBalance, required: totalCost }.\n    - If balance >= totalCost: deduct atomically: newBalance = balance - totalCost. Write newBalance, updatedAt = now()."
          - "Step 8: Generate campaignId = crypto.randomUUID()."
          - "Step 9: Upload raw CSV bytes to Firebase Storage at bulk_campaigns/{campaignId}/recipients.csv."
          - "Step 10: Chunk phone array into batches of 100. Write each batch as a Firestore document in bulk_campaigns/{campaignId}/recipient_batches/{zeroPaddedIndex}. Use Firestore batched writes (max 500 ops each). Field: { batchIndex, phones, dispatched: false }."
          - "Step 11: Write Firestore bulk_campaigns/{campaignId}: { campaignId, ownerUid: auth.uid, appId, name, message, status: 'pending', totalCount, sentCount: 0, failedCount: 0, dispatchCursor: 0, createdAt: now(), updatedAt: now(), startedAt: null, completedAt: null, pausedAt: null, cancelledAt: null, estimatedFinishAt: null, rateLimit: rateLimit ?? BULK_RATE_LIMIT_DEFAULT, maxRetries: BULK_MAX_RETRIES, maxSmsPerCampaign: BULK_MAX_PER_CAMPAIGN, csvStoragePath, bulkCreditTxId: null, totalBatches: batches.length, segmentsPerMessage, totalCost }."
          - "ROLLBACK GUARD: If Step 9 or Step 10 fail after Step 7 has deducted credits, the Cloud Function must run a compensating runTransaction to refund the deducted totalCost back to bulk_credits/{appId}.balance. Log the rollback in a Firestore audit document."
          - "Step 12: Return 200 { campaignId, totalCount, totalCost, segmentsPerMessage, estimatedMinutes: Math.ceil(totalCount / rateLimit) }."
          - "Do NOT start dispatching immediately — dispatchBulkJobs (BCF-02) handles that on schedule."
        verification:
          - type: file_exists
            path: "functions/src/bulk/createBulkCampaign.js"
          - type: contains
            file: "functions/src/bulk/createBulkCampaign.js"
            patterns:
              - "parseCsvBuffer"
              - "recipient_batches"
              - "bulk_campaigns"
              - "bulk_credits"
              - "insufficient_bulk_credits"
              - "status.*pending"
              - "getStorage\\|bucket\\|Storage"
              - "timingSafeEqual"
              - "runTransaction"
              - "totalCost"
              - "segmentsPerMessage\\|calcSegments"
              - "ROLLBACK\\|compensat\\|refund.*failed"
              - "idempotencyKey"
          - type: anti_pattern_check
            file: "functions/src/bulk/createBulkCampaign.js"
            forbidden: "sendOtp\\|verifyOtp\\|pending_sms"
            description: "createBulkCampaign must not reference any OTP function or node"
        depends_on: [BCF-00, BCFS-01, BCFS-02, BCFS-03, BCFS-05]
        priority: critical
        security_notes:
          - "Phone numbers are validated as E.164 at parse time. Malformed numbers are rejected with line-number context, never silently dropped."
          - "Bulk credit check (Step 2) runs before CSV upload to fail fast and avoid wasting Storage quota on invalid campaigns."
          - "Phone numbers are stored in recipient_batches only, never in the top-level campaign document. This limits blast radius if the campaign document is over-shared."

      - id: BCF-02
        status: "todo"
        task: "Implement `dispatchBulkJobs` Cloud Function (Cloud Scheduler, every 1 minute)"
        files_to_create:
          - "functions/src/bulk/dispatchBulkJobs.js"
        schedule: "every 1 minutes"
        behaviour:
          - "Query Firestore bulk_campaigns where status IN ['pending', 'sending'] (uses composite index from BCFS-06). Limit to 3 campaigns per execution to stay within Cloud Function timeout."
          - "For each campaign in 'pending' status: update status = 'sending', startedAt = now()."
          - "For each campaign in 'sending' status:"
          - "  a. Read recipient_batches document at index dispatchCursor."
          - "  b. If batch.dispatched == true: increment dispatchCursor, continue to next iteration."
          - "  c. Determine jobs to dispatch this tick: min(batch.phones.length, BULK_DISPATCH_BATCH_SIZE)."
          - "  d. For each phone in the batch: construct deterministic jobId = `${campaignId}:${batchIndex * 100 + phoneIndex}`. Write to RTDB /bulk_sms_queue/{jobId} = { campaignId, appId, to: phone, message, status: 'pending', attempts: 0, createdAt: Date.now(), recipientIndex: batchIndex * 100 + phoneIndex }. Use RTDB set() — idempotent on duplicate jobId."
          - "  e. After dispatching all phones: update Firestore batch.dispatched = true, increment campaign.dispatchCursor."
          - "  f. Recalculate and write campaign.estimatedFinishAt = now() + ((totalCount - sentCount - failedCount) / rateLimit * 60000)."
          - "  g. Do NOT set status = 'completed' here. Completion is triggered by BCF-07 when counters match."
          - "Skip campaigns with status 'paused', 'cancelled', 'completed', or 'failed' entirely."
          - "If dispatchCursor >= total batch count AND campaign is still 'sending': this is a no-op tick — all batches are dispatched, waiting for BCF-07 to flip to 'completed'."
        verification:
          - type: file_exists
            path: "functions/src/bulk/dispatchBulkJobs.js"
          - type: contains
            file: "functions/src/bulk/dispatchBulkJobs.js"
            patterns:
              - "onSchedule\\|pubsub.*schedule\\|every 1 minutes"
              - "bulk_sms_queue"
              - "dispatchCursor"
              - "recipient_batches"
              - "status.*sending"
              - "BULK_DISPATCH_BATCH_SIZE"
          - type: anti_pattern_check
            file: "functions/src/bulk/dispatchBulkJobs.js"
            forbidden: "pending_sms"
            description: "dispatchBulkJobs must write to /bulk_sms_queue only, never /pending_sms"
        depends_on: [BCF-01, BCFS-04, BCFS-06]
        priority: critical
        notes: >
          The deterministic jobId ({campaignId}:{recipientIndex}) is the idempotency key.
          If the scheduler fires twice before one execution completes, the second run calls
          RTDB set() with an identical key and identical data — no duplicate SMS results.
          Processing 3 campaigns × 30 jobs = 90 RTDB writes + 6 Firestore reads/writes;
          well within the 540-second Cloud Functions v2 timeout and RTDB rate limits.

      - id: BCF-03
        status: "todo"
