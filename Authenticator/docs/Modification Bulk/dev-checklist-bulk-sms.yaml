        priority: high

# ─────────────────────────────────────────────────────────────────────────────
failure_conditions:
  - condition: "Android device rate limiter missing or disabled (MIN_INTERVAL_MS = 0)"
    check: "grep -c 'MIN_INTERVAL_MS' app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
    action: "BLOCK_DEPLOY — carrier blocking risk is unacceptable without the hardware-level rate limiter"

  - condition: "Android app calls removeValue() on /bulk_sms_queue nodes (BCF-07 trigger will not fire)"
    check: "grep -A10 'bulk_sms_queue' app/src/main/java/com/authenticator/service/SmsDispatchService.kt | grep -c 'removeValue'"
    action: "BLOCK_DEPLOY — bulk queue jobs must use updateChildren() to write status, never removeValue()"

  - condition: "dispatchBulkJobs does not respect BULK_DISPATCH_BATCH_SIZE (unlimited push to RTDB)"
    check: "grep -L 'BULK_DISPATCH_BATCH_SIZE\\|DISPATCH_BATCH_SIZE' functions/src/bulk/dispatchBulkJobs.js"
    action: "BLOCK_DEPLOY — unbounded dispatch will overwhelm the Android device and trigger carrier blocking"

  - condition: "createBulkCampaign does not check bulk_credits before creating the campaign"
    check: "grep -L 'insufficient_bulk_credits\\|bulk_credits' functions/src/bulk/createBulkCampaign.js"
    action: "BLOCK_DEPLOY — campaigns could be created without credit deduction, allowing free bulk SMS"

  - condition: "onBulkJobStatusChange uses update() instead of runTransaction() for counter increments"
    check: "grep -c 'runTransaction' functions/src/bulk/onBulkJobStatusChange.js"
    action: "BLOCK_DEPLOY — concurrent status updates will cause lost increments and incorrect campaign completion detection"

  - condition: "cancelCampaign credit refund not wrapped in runTransaction (race condition risk)"
    check: "grep -L 'runTransaction' functions/src/bulk/cancelCampaign.js"
    action: "BLOCK_DEPLOY — concurrent completions and cancellations will produce incorrect credit balances"

  - condition: "approveBulkCredit lacks idempotency check on transaction status (double-credit risk)"
    check: "grep -L 'already_resolved\\|status.*pending\\|pending.*status' functions/src/bulk/approveBulkCredit.js"
    action: "BLOCK_DEPLOY — admin double-click or network retry could credit the same transaction twice"

  - condition: "cancelCampaign accessible by non-admin callers"
    check: "grep -L 'admin_only\\|admin.*claim\\|token.*admin' functions/src/bulk/cancelCampaign.js"
    action: "BLOCK_DEPLOY — clients must not be able to cancel campaigns or trigger credit refunds"

  - condition: "RTDB /bulk_sms_queue missing .indexOn rules (cancelCampaign query will fail or be unacceptably slow)"
    check: "grep -c 'bulk_sms_queue' database.rules.json && grep -c 'indexOn\\|\\.indexOn' database.rules.json"
    action: "BLOCK_DEPLOY — cancelCampaign queries by campaignId will return all nodes without an index, causing full-table scans"

  - condition: "dispatchBulkJobs not registered as pubsub schedule in functions/index.js"
    check: "grep -L 'schedule.*every 1 minutes\\|pubsub.*schedule.*1.*minute' functions/index.js"
    action: "BLOCK_DEPLOY — campaigns will never transition from 'pending' to 'sending' without the scheduler"

  - condition: "Phone numbers stored as plaintext in bulk_campaigns top-level document"
    check: "grep -n 'phones\\|phoneNumber\\|phone_number' functions/src/bulk/createBulkCampaign.js | grep -v 'validateE164\\|parseCsv\\|recipient_batches\\|hash'"
    action: "REVIEW — phone numbers belong only in recipient_batches sub-collection, never in the campaign document root"

  - condition: "Raw phone numbers stored in failed_jobs audit records (PII violation)"
    check: "grep -n 'to:.*phone\\|\\.to\\b' functions/src/bulk/onBulkJobStatusChange.js | grep -v 'hash\\|sha256\\|createHash'"
    action: "BLOCK_DEPLOY — failed_jobs must store only hashed phone numbers (SHA-256)"

  - condition: "Existing sendOtp tests fail after bulk functions are deployed"
    check: "cd functions && npm test -- sendOtp.test.js 2>&1 | grep -c 'FAIL\\|failed'"
    action: "BLOCK_DEPLOY — roll back all bulk Cloud Function changes immediately and investigate"

  - condition: "Android BAN-02 does not implement onChildChanged (retried bulk jobs silently ignored)"
    check: "grep -c 'onChildChanged' app/src/main/java/com/authenticator/service/SmsDispatchService.kt"
    action: "BLOCK_DEPLOY — BCF-07 retry logic resets RTDB nodes to status='pending' via update(), which fires onChildChanged. Without this handler, retried jobs are never processed."

  - condition: "createBulkCampaign uses balance >= 1 check instead of runTransaction with totalCost deduction"
    check: "grep -L 'runTransaction' functions/src/bulk/createBulkCampaign.js"
    action: "BLOCK_DEPLOY — campaigns could run consuming more credits than the user has. Credit deduction must be atomic via runTransaction at campaign creation."

  - condition: "Bulk HTTPS Cloud Functions missing CORS headers (browser calls will fail with CORS error)"
    check: "grep -L 'cors\\|Access-Control-Allow-Origin' functions/src/bulk/createBulkCampaign.js"
    action: "BLOCK_DEPLOY — CreateCampaignPage and all bulk UI actions will fail with CORS preflight error in every browser."

  - condition: "bulk_credits Firestore rule uses resource.data.appId instead of resource.data.ownerUid (all non-admin reads denied)"
    check: "grep -n 'bulk_credits' firestore.rules | grep -c 'appId.*auth\\.uid\\|auth\\.uid.*appId'"
    action: "BLOCK_DEPLOY — if result > 0, the old broken rule is still present. Replace with ownerUid == request.auth.uid."

  - condition: "VITE_BULK_SMS_ENABLED missing from web/.env.example"
    check: "grep -c 'VITE_BULK_SMS_ENABLED' web/.env.example"
    action: "BLOCK_DEPLOY — the feature flag must be documented so developers can enable/disable the UI"

  - condition: "papaparse added without pinned version (supply-chain risk)"
    check: "grep 'papaparse' web/package.json | grep -c '\\^\\|~\\|\\*'"
    action: "REVIEW — pin papaparse to an exact version in package.json for reproducible builds"

  - condition: "bulk_campaigns Firestore composite indexes not deployed before Cloud Functions"
    check: "firebase firestore:indexes | grep -c 'bulk_campaigns'"
    action: "WARN — queries in dispatchBulkJobs, BulkCampaignsPage, and getCampaignStatus will fail until indexes are built"

# ─────────────────────────────────────────────────────────────────────────────
validation_commands:
  # Non-regression (run first, always)
  otp_regression_test: "cd functions && npm test -- sendOtp.test.js verifyOtp.test.js otpStatus.test.js creditCheck.test.js"

  # Bulk unit tests (no emulator needed)
  bulk_validators_test: "cd functions && npm test -- --testPathPattern=bulk/validators"
  bulk_unit_tests: "cd functions && npm test -- --testPathPattern=test/bulk/"

  # Android unit tests (no emulator needed, uses Robolectric)
  android_unit_tests: "cd app && ./gradlew testDebugUnitTest --tests '*.SmsRateLimiterTest' --tests '*.BulkQueueListenerTest'"

  # Bulk integration and e2e tests (require emulator)
  bulk_e2e_test: "cd functions && firebase emulators:exec --only auth,functions,firestore,database 'npm test -- bulk/e2e-bulk.test.js'"
  bulk_rate_limit_test: "cd functions && firebase emulators:exec --only functions,firestore,database 'npm test -- bulk/rateLimit.test.js'"
  bulk_state_machine_test: "cd functions && firebase emulators:exec --only functions,firestore,database 'npm test -- bulk/stateMachine.test.js'"
  bulk_concurrency_test: "cd functions && firebase emulators:exec --only auth,functions,firestore,database 'npm test -- bulk/concurrency.test.js'"
  bulk_security_test: "cd functions && firebase emulators:exec --only auth,functions,firestore,database 'npm test -- bulk/security.test.js'"

  # Security rules tests
  firestore_bulk_rules_test: "firebase emulators:exec --only firestore,auth 'npm test -- bulk/firestoreRules.test.js'"
  rtdb_bulk_rules_test: "firebase emulators:exec --only database,auth 'npm test -- bulk/rtdbRules.test.js'"

  # Frontend
  dashboard_build: "cd web && npm run build"
  dashboard_test: "cd web && npm test"

  # Full combined suite (CI gate)
  full_test_suite: "cd functions && npm test && cd ../web && npm test && cd ../app && ./gradlew testDebugUnitTest"

  # Deployment (ordered — do NOT change order)
  deploy_dry_run: "firebase deploy --only functions --dry-run"
  deploy_rules_and_indexes: "firebase deploy --only firestore:rules,firestore:indexes,database,storage:rules"
  deploy_functions: "firebase deploy --only functions"
  deploy_hosting: "cd web && npm run build && firebase deploy --only hosting"
  deploy_apk: "cd app && ./gradlew assembleRelease && adb install -r app/build/outputs/apk/release/app-release.apk"
  deploy_all: "firebase deploy --only firestore:rules,firestore:indexes,database,storage:rules && firebase deploy --only functions && cd web && npm run build && firebase deploy --only hosting"

