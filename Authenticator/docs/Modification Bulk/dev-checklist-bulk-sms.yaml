  # ─────────────────────────────────────────────────────────────────────────────
  - id: B5
    name: "Testing & Monitoring"
    blocking: false
    description: >
      Comprehensive test coverage to verify: (1) bulk SMS campaigns complete
      correctly end-to-end, (2) rate limiting prevents carrier blocking at both
      the Cloud Function and Android layers, (3) the existing OTP flow is
      completely unaffected by all changes, (4) the campaign state machine
      is correct for all valid and invalid transitions, and (5) concurrency
      edge cases (race conditions on counters, duplicate approvals) are handled.
    items:
      - id: BTST-01
        status: "todo"
        task: "Run the full existing OTP test suite — confirm zero regressions"
        commands:
          - "cd functions && npm test -- sendOtp.test.js verifyOtp.test.js otpStatus.test.js"
          - "cd functions && npm test -- registerApp.test.js revokeApp.test.js updateAppWebhook.test.js regenerateAppSecret.test.js"
          - "cd functions && npm test -- creditCheck.test.js approveCredit.test.js upsertPackage.test.js"
          - "cd functions && npm test -- e2e-billing.test.js"
        expected_outcome: >
          All existing tests pass with 0 failures. Any single failure is a regression
          introduced by the bulk SMS changes and must block deployment until resolved.
        verification:
          - type: command
            run: "cd functions && npm test -- sendOtp.test.js verifyOtp.test.js otpStatus.test.js"
            expect_exit: 0
          - type: command
            run: "cd functions && npm test -- creditCheck.test.js approveCredit.test.js"
            expect_exit: 0
        depends_on: [BCF-09]
        priority: critical
        notes: >
          This is the highest-priority test in Phase B5. Run it before any other B5 item.
          Verify that functions/index.js has not had sendOtp or verifyOtp modified:
          git diff HEAD~1 functions/index.js | grep '^[-+].*sendOtp\|^[-+].*verifyOtp'
          If any existing OTP export is altered, roll back immediately.

      - id: BTST-02
        status: "todo"
        task: "Test Cloud Function rate limiter: verify dispatch throttling with a 500-recipient campaign"
        files_to_create:
          - "functions/test/bulk/rateLimit.test.js"
        test_cases:
          - "Create a campaign with 500 recipients, rateLimit=30."
          - "Run 3 simulated dispatchBulkJobs ticks in the emulator."
          - "After tick 1: exactly 30 RTDB /bulk_sms_queue nodes exist."
          - "After tick 2: exactly 60 RTDB nodes exist (tick 1 jobs still pending in simulation)."
          - "Verify no more than BULK_DISPATCH_BATCH_SIZE jobs are written per tick."
          - "Verify campaign.estimatedFinishAt ≈ now() + (500 / 30 * 60000) ± 120000 ms."
          - "Verify dispatchCursor increments by 1 per tick."
        verification:
          - type: command
            run: "cd functions && firebase emulators:exec --only functions,firestore,database 'npm test -- bulk/rateLimit.test.js'"
            expect_exit: 0
        depends_on: [BCF-02, BCF-10]
        priority: critical

      - id: BTST-03
        status: "todo"
        task: "Test campaign state machine: all valid and invalid status transitions"
        files_to_create:
          - "functions/test/bulk/stateMachine.test.js"
        test_cases:
          - "pending → sending: triggered by first dispatchBulkJobs tick."
          - "sending → paused: pauseCampaign succeeds, subsequent dispatcher tick skips the campaign."
          - "paused → [no direct resume in v1.0]: pauseCampaign on paused → 409 campaign_not_pausable."
          - "sending → completed: all sentCount + failedCount == totalCount, BCF-07 sets completed."
          - "sending → cancelled: cancelCampaign by admin, pending RTDB jobs deleted, credits refunded."
          - "completed → cancelled: 409 campaign_already_terminal."
          - "cancelled → cancelled: 409 campaign_already_terminal."
          - "completed with failures → retry: retryFailedJobs resets failedCount=0, status='sending'."
          - "failed → retry: retryFailedJobs resets all failed RTDB jobs to pending, status='sending'."
          - "sending + retryFailedJobs: 409 retry_not_allowed."
        verification:
          - type: command
            run: "cd functions && firebase emulators:exec --only functions,firestore,database 'npm test -- bulk/stateMachine.test.js'"
            expect_exit: 0
        depends_on: [BCF-04, BCF-05, BCF-06, BCF-07]
        priority: critical

      - id: BTST-04
        status: "todo"
        task: "Test concurrency safety: race conditions on counter updates and credit operations"
        files_to_create:
          - "functions/test/bulk/concurrency.test.js"
        test_cases:
          - "Concurrent sendOtp calls while a bulk campaign is running: OTP credits (app_credits) not confused with bulk credits."
          - "Last bulk job: two concurrent onBulkJobStatusChange triggers fire simultaneously — only one sets status='completed', no double-decrement."
          - "cancelCampaign fires concurrently with the last job completing: refunded credits are correct, no over-refund."
          - "approveBulkCredit called simultaneously by two admin sessions: only one increments balance (409 on second call)."
          - "createBulkCampaign called twice with same CSV: two separate campaigns created, each with independent credit deduction."
        verification:
          - type: command
            run: "cd functions && firebase emulators:exec --only auth,functions,firestore,database 'npm test -- bulk/concurrency.test.js'"
            expect_exit: 0
        depends_on: [BCF-05, BCF-07, BCF-08]
        priority: critical
        notes: >
          All concurrency safety in this system relies on Firestore runTransaction()
          calls in BCF-05, BCF-07, and BCF-08. If any of those functions use update()
          instead of runTransaction() for counter writes, this test suite will produce
          flaky results under load. A flaky concurrency test is itself a defect.

      - id: BTST-05
        status: "todo"
        task: "Manual end-to-end test against staging with 50 recipients and a physical Android device"
        manual_test_steps:
          - step: "1. Deploy all B1 and B2 artefacts to a staging Firebase project."
            expected: "Cloud Functions deployed with 0 errors. dispatchBulkJobs appears in Cloud Scheduler."
          - step: "2. Purchase 100 bulk credits via dashboard (upsertBulkPackage → requestBulkCredit → submitBulkTrxId → approveBulkCredit)."
            expected: "Firestore bulk_credits/{appId}.balance = 100."
          - step: "3. Create a CSV with 50 valid test phone numbers. Upload via CreateCampaignPage."
            expected: "Campaign created with status='pending', totalCount=50."
          - step: "4. Wait up to 60 seconds for the first dispatchBulkJobs tick."
            expected: "30 RTDB /bulk_sms_queue job nodes appear. Campaign status = 'sending'."
          - step: "5. Connect the Android device running the new APK (BAN-01–04). Observe foreground notification."
            expected: "Notification reads '30 bulk pending'. Device begins sending SMS."
          - step: "6. Monitor CampaignDetailPage in real time."
            expected: "ProgressBar advances. sentCount increments live via Firestore onSnapshot."
          - step: "7. After 30 jobs are sent, wait for the next scheduler tick (up to 60 sec)."
            expected: "20 more job nodes appear. sentCount continues incrementing."
          - step: "8. After all 50 SMS are sent, check campaign document."
            expected: "status='completed', sentCount=50, failedCount=0, completedAt is set."
          - step: "9. Verify bulk credit deduction."
            expected: "bulk_credits/{appId}.balance = 50 (100 - 50)."
          - step: "10. Immediately send a regular OTP via the API Playground."
            expected: "OTP received on phone. app_credits (OTP credits) unchanged. Bulk campaign unaffected."
        verification:
          - type: manual_check
            description: "All 10 steps must pass. Record results in a file: docs/Modification Bulk/test-results/bulk-e2e-manual.md with a date stamp."
        depends_on: [BAN-01, BAN-02, BAN-03, BCF-09, BUI-03]
        priority: critical

      - id: BTST-06
        status: "todo"
        task: "Security audit test: verify all bulk endpoints enforce authentication and tenant isolation"
        files_to_create:
          - "functions/test/bulk/security.test.js"
        test_cases:
          - "createBulkCampaign with no appId/appSecret: 403."
          - "createBulkCampaign with valid appId but wrong appSecret: 403."
          - "getCampaignStatus for a different tenant's campaignId: 403 access_denied."
          - "pauseCampaign for a different tenant's campaignId: 403."
          - "cancelCampaign by non-admin authenticated caller: 403 admin_only."
          - "approveBulkCredit by non-admin authenticated caller: 403."
          - "upsertBulkPackage by non-admin authenticated caller: 403."
          - "Unauthenticated RTDB set() to /bulk_sms_queue: denied by RTDB rules (emulator)."
          - "Authenticated non-owner Firestore write to bulk_campaigns: denied by Firestore rules (emulator)."
          - "Authenticated non-owner Firestore write to bulk_credits: denied by Firestore rules (emulator)."
        verification:
          - type: command
            run: "cd functions && firebase emulators:exec --only auth,functions,firestore,database 'npm test -- bulk/security.test.js'"
            expect_exit: 0
        depends_on: [BCF-01, BCF-03, BCF-04, BCF-05, BCF-08, BCFS-03, BCFS-04]
        priority: critical

      - id: BTST-07
        status: "todo"
        task: "Deploy to production and run smoke tests"
        commands:
          - "firebase deploy --only firestore:rules,firestore:indexes,database,storage:rules"
          - "firebase deploy --only functions"
          - "cd web && npm run build && firebase deploy --only hosting"
        post_deploy_checks:
          - "Verify dispatchBulkJobs appears in Cloud Scheduler UI with 'every 1 minutes' frequency."
          - "Verify /bulk_sms_queue RTDB node has the .indexOn rule active (Firebase console → Realtime Database → Rules)."
          - "Call getCampaignStatus with a fake campaignId via curl → expect 404 campaign_not_found (not 500)."
          - "Attempt a direct RTDB write to /bulk_sms_queue via the browser console Firebase SDK → expect permission denied."
          - "Run the OTP smoke test: POST to sendOtp with valid production credentials → expect { sessionId, expiresAt }."
          - "Confirm Firebase console shows 0 errors in the bulk Cloud Functions within 5 minutes of deploy."
        verification:
          - type: command
            run: "firebase deploy --only functions --dry-run"
            expect_exit: 0
          - type: manual_check
            description: "All post_deploy_checks items verified and documented. Deploy to staging first if a staging project is available."
        depends_on: [BTST-01, BTST-02, BTST-03, BTST-04, BTST-05, BTST-06]
        priority: critical
        notes: >
          Deploy order matters:
          1. Firestore rules and indexes first (they take time to propagate).
          2. RTDB rules and Storage rules second.
          3. Cloud Functions third (dispatchBulkJobs will not fire until Firestore schema is live).
          4. Hosting last (UI depends on all functions being deployed).
          Keep the previous Cloud Functions deployment available for rollback:
          firebase functions:rollback --only createBulkCampaign,dispatchBulkJobs,onBulkJobStatusChange,...

      - id: BTST-08
        status: "todo"
        task: "Unit tests for `validators.js`: CSV parser, E.164 validation, and message segmentation"
        files_to_create:
          - "functions/test/bulk/validators.test.js"
        test_cases:
          parseCsvBuffer:
            - "Valid CSV with 10 rows, all E.164: returns { phones: [...10 phones], errors: [] }."
            - "CSV with row 3 containing '+8801 234 567 890' (spaces): normalised to '+88012345678890' or rejected with E.164 error on row 3."
            - "CSV with row 5 containing '01711000000' (no country code): rejected with E.164 error on row 5."
            - "CSV with row 8 containing 'not-a-phone': rejected with error on row 8."
            - "CSV with 10,001 rows: returns exactly 10,000 phones (hard cap) and a warning."
            - "Empty CSV (header only): returns { phones: [], errors: ['no_recipients'] }."
            - "CSV with Windows-style CRLF line endings: parsed correctly."
            - "CSV with UTF-8 BOM prefix: BOM stripped, first row parsed correctly."
          validateMessage:
            - "Empty string: returns error."
            - "160-char string: valid, segments = 1."
            - "161-char string: valid, segments = 2."
            - "306-char string: valid, segments = 2."
            - "307-char string: valid, segments = 3."
            - "459-char string: valid, segments = 3."
            - "460-char string: returns error (exceeds 3-segment max)."
          calcSegmentsPerMessage:
            - "message.length 1: returns 1."
            - "message.length 160: returns 1."
            - "message.length 161: returns 2."
            - "message.length 306: returns 2."
            - "message.length 307: returns 3."
            - "message.length 459: returns 3."
        verification:
          - type: command
            run: "cd functions && npm test -- validators.test.js"
            expect_exit: 0
        depends_on: [BCF-00, BCFS-08]
        priority: critical
        notes: >
          These tests have zero external dependencies (no Firebase emulator needed).
          They can run in under 1 second and must be included in the CI gate on every PR.

      - id: BTST-09
        status: "todo"
        task: "Set up Cloud Monitoring alerts for bulk SMS operational health"
        files_to_create:
          - "docs/Modification Bulk/monitoring-setup.md"
        monitoring_alerts:
          - name: "stalled_campaign"
            description: "A campaign has been in 'sending' status for > STALL_THRESHOLD_MINUTES (default 30) with no sentCount progress."
            metric: "firestore.googleapis.com/document/write_count filtered on bulk_campaigns collection"
            action: "Alert ops team via email or PagerDuty. Check: (1) dispatchBulkJobs scheduler is running, (2) RTDB /bulk_sms_queue has jobs with status='pending', (3) Android device is online."
          - name: "high_rtdb_bulk_backlog"
            description: "RTDB /bulk_sms_queue node count exceeds 500 (implies Android device is not consuming jobs)."
            metric: "Custom metric via Cloud Function that periodically counts /bulk_sms_queue children (add to dispatchBulkJobs)."
            action: "Alert ops team. Check Android device connectivity, wake-lock status, and SmsManager errors."
          - name: "cf_bulk_error_rate"
            description: "Cloud Functions error rate for dispatchBulkJobs or onBulkJobStatusChange exceeds 5 errors in 5 minutes."
            metric: "cloudfunctions.googleapis.com/function/execution_count filtered on error status."
            action: "Page on-call engineer. Likely cause: Firestore runTransaction contention or RTDB write failure."
          - name: "cancelling_status_stuck"
            description: "A campaign has been in 'cancelling' status for > 5 minutes (implies cancelCampaign crashed mid-execution)."
            metric: "Firestore query for campaigns with status='cancelling' and updatedAt < now() - 5min."
            action: "Admin must manually complete the cancellation or trigger the cleanup job."
        verification:
          - type: file_exists
            path: "docs/Modification Bulk/monitoring-setup.md"
          - type: contains
            file: "docs/Modification Bulk/monitoring-setup.md"
            patterns:
              - "stalled_campaign\\|stall"
              - "bulk_backlog\\|RTDB.*queue"
              - "cancelling.*stuck\\|stuck.*cancelling"
        depends_on: [BCF-02, BCF-07, BTST-07]
        priority: high

      - id: BTST-10
        status: "todo"
        task: "Update CI/CD pipeline to run bulk tests on every PR and pre-deploy"
        files_to_modify:
          - ".github/workflows/ci.yml"
        changes:
          - "Add a 'bulk-tests' job that runs after 'unit-tests': cd functions && firebase emulators:exec --only functions,firestore,database,auth 'npm test -- --testPathPattern=test/bulk/'"
          - "Add validators test as a fast pre-check (no emulator): cd functions && npm test -- validators.test.js"
          - "Add Android unit tests step: cd app && ./gradlew testDebugUnitTest --tests '*.SmsRateLimiterTest' --tests '*.BulkQueueListenerTest'"
          - "Enforce: if any bulk test fails, block merge (required status check)."
          - "OTP regression test (BTST-01 commands) must also run in CI: cd functions && npm test -- sendOtp.test.js verifyOtp.test.js."
          - "DO NOT remove or weaken any existing CI checks."
        verification:
          - type: contains
            file: ".github/workflows/ci.yml"
            patterns:
              - "bulk-tests\\|bulk tests"
              - "validators.test.js"
              - "SmsRateLimiterTest"
              - "firebase emulators:exec"
          - type: anti_pattern_check
            file: ".github/workflows/ci.yml"
            forbidden: "sendOtp.test.js.*#.*removed\\|# bulk tests disabled"
            description: "Neither OTP tests nor bulk tests may be commented out in CI"
        depends_on: [BTST-08, BAN-09]
        priority: high
        notes: >
          ⚠️ FLAG: If a .github/workflows/ci.yml does not exist, this task becomes
          'Create CI/CD pipeline from scratch'. Flag this gap and ask the user before proceeding.
          Do NOT create a CI file that only runs bulk tests — the OTP regression suite must run too.

      - id: BTST-11
        status: "todo"
        task: "Set up Firestore TTL policy and archival for completed bulk campaigns"
        files_to_create:
          - "docs/Modification Bulk/data-retention-policy.md"
        files_to_modify:
          - "firestore.indexes.json"
        changes:
          - "Define retention policy: bulk_campaigns with status IN ['completed', 'cancelled'] and completedAt or cancelledAt older than CAMPAIGN_RETENTION_DAYS (default: 90) should be archived and deleted."
          - "Enable Firestore TTL: add a TTL policy on bulk_campaigns using a field archiveAt (Firestore Timestamp). Set archiveAt = completedAt + CAMPAIGN_RETENTION_DAYS when a campaign reaches terminal status in BCF-07 or cancelCampaign."
          - "Alternatively: a scheduled Cloud Function (monthly) moves old campaign metadata to Firebase Storage as JSON, then deletes the Firestore documents."
          - "recipient_batches sub-collection: delete when the parent bulk_campaigns document is deleted (via Firestore bulk delete or extension)."
          - "failed_jobs sub-collection: delete alongside parent."
          - "RTDB: orphaned /bulk_sms_queue jobs (status='pending', createdAt older than BULK_SMS_JOB_TTL_HOURS) must be purged by a scheduled Cloud Function or by dispatchBulkJobs on each tick."
          - "Document the full policy in docs/Modification Bulk/data-retention-policy.md."
        verification:
          - type: file_exists
            path: "docs/Modification Bulk/data-retention-policy.md"
          - type: contains
            file: "docs/Modification Bulk/data-retention-policy.md"
            patterns:
              - "retention\\|archiv"
              - "TTL\\|archiveAt"
              - "CAMPAIGN_RETENTION_DAYS"
              - "recipient_batches"
        depends_on: [BCF-07, BCF-05, BCFS-01]
        priority: medium
        notes: >
          ⚠️ FLAG: Firestore TTL (native) is only available in Firestore in Native mode.
          If the project uses Firestore in Datastore mode, TTL is not available
          and a scheduled delete Cloud Function is the only option.

  # ───────────────────────────────────────────────────────────────────────────
  - id: B6
    name: "Documentation, Environment Variables & Runbook"
    blocking: false
    description: >
      Ensure all new environment variables, deployment steps, and operational procedures
      are documented. Update the central ENV-VARS doc and deployment runbook. This phase
      can run in parallel with B5 but must be complete before BTST-07 (production deploy).
    items:
      - id: BDOC-01
        status: "todo"
        task: "Update `docs/Plan/11-ENV-VARS.md` with all new bulk SMS environment variables"
        files_to_modify:
          - "docs/Plan/11-ENV-VARS.md"
        new_vars:
          - "BULK_SMS_RATE_LIMIT_PER_MINUTE — Default SMS/min per campaign. Carrier-safe default: 30."
          - "BULK_SMS_MAX_PER_CAMPAIGN — Hard cap on recipients per campaign. Default: 10000."
          - "BULK_SMS_MAX_RETRIES — Max retry attempts per failed job. Default: 3."
          - "BULK_SMS_DISPATCH_BATCH_SIZE — Jobs pushed to RTDB per scheduler tick. Default: 30."
          - "BULK_SMS_JOB_TTL_HOURS — Hours before orphaned bulk jobs are purged. Default: 48."
          - "BULK_SMS_CORS_ORIGIN — Allowed CORS origin for bulk HTTPS Cloud Functions. No wildcard."
          - "CAMPAIGN_RETENTION_DAYS — Days before completed/cancelled campaigns are archived. Default: 90."
          - "STALL_THRESHOLD_MINUTES — Minutes of no-progress before stalled campaign alert fires. Default: 30."
          - "VITE_BULK_SMS_ENABLED — Set to 'true' to show Bulk SMS UI in the React dashboard."
          - "VITE_BULK_SMS_MAX_CSV_ROWS — Max rows validated client-side by PapaParse preview. Default: 10000."
        verification:
          - type: contains
            file: "docs/Plan/11-ENV-VARS.md"
            patterns:
              - "BULK_SMS_RATE_LIMIT_PER_MINUTE"
              - "BULK_SMS_CORS_ORIGIN"
              - "CAMPAIGN_RETENTION_DAYS"
              - "VITE_BULK_SMS_ENABLED"
        depends_on: [BCFS-07, BCF-11]
        priority: critical
        notes: >
          Per project rules (docs/Plan/11-ENV-VARS.md), every environment variable used
          in production code must be listed here with a description, whether it has a
          default, and where to get the value. Do NOT list actual values in this doc.

      - id: BDOC-02
        status: "todo"
        task: "Update `docs/Plan/15-RUNBOOK-DEPLOY.md` with bulk SMS deploy sequence and smoke tests"
        files_to_modify:
          - "docs/Plan/15-RUNBOOK-DEPLOY.md"
        changes:
          - "Add section 'Bulk SMS Deploy Sequence' with the required deploy order:"
          - "  (1) firebase deploy --only firestore:rules,firestore:indexes (wait for index build: 5-15 min)"
          - "  (2) firebase deploy --only database (RTDB rules)"
          - "  (3) firebase deploy --only storage:rules"
          - "  (4) firebase deploy --only functions"
          - "  (5) cd web && npm run build && firebase deploy --only hosting"
          - "  (6) adb install -r app/build/outputs/apk/release/app-release.apk (on gateway device)"
          - "Add Bulk SMS smoke tests section:"
          - "  (a) curl -X POST {FUNCTION_URL}/getCampaignStatus?campaignId=fake123 → expect 404 campaign_not_found"
          - "  (b) firebase database:get /bulk_sms_queue → expect empty or {} (no orphaned jobs)"
          - "  (c) Open /bulk in browser as authenticated user → expect BulkCampaignsPage renders without JS errors"
          - "  (d) Send a test OTP via API Playground → expect delivery, confirming OTP non-regression"
          - "Add Rollback procedure:"
          - "  Cloud Functions: firebase functions:rollback --only {functionName}"
          - "  Android: adb install -r releases/app-{previousVersionCode}-release.apk"
          - "  Firestore rules: revert to previous rules file via git, redeploy"
        verification:
          - type: contains
            file: "docs/Plan/15-RUNBOOK-DEPLOY.md"
            patterns:
              - "Bulk SMS Deploy Sequence\\|bulk.*deploy"
              - "firestore:indexes"
              - "adb install"
              - "smoke test\\|smoke tests"
              - "Rollback\\|rollback"
        depends_on: [BTST-07, BAN-10]
        priority: critical

      - id: BDOC-03
        status: "todo"
        task: "Create `docs/Modification Bulk/api-reference.md` documenting all new public Cloud Function endpoints"
        files_to_create:
          - "docs/Modification Bulk/api-reference.md"
        required_sections:
          - "createBulkCampaign: method, URL, auth, request fields (with types and validation), success response, all error codes."
          - "getCampaignStatus: method, URL, auth, query params, response fields."
          - "pauseCampaign: method, URL, auth, request, response, 409 conditions."
