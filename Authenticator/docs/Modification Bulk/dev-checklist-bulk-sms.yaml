          - "Verify campaign.appId matches the authenticated caller's appId (or caller is admin). Return 403 { error: 'access_denied' } on mismatch."
          - "Return 200: { campaignId, name, status, totalCount, sentCount, failedCount, progressPercent: Number(((sentCount + failedCount) / totalCount * 100).toFixed(1)), createdAt, startedAt, completedAt, estimatedFinishAt, rateLimit, messagePreview: message.slice(0, 50) + (message.length > 50 ? '...' : '') }."
        verification:
          - type: file_exists
            path: "functions/src/bulk/getCampaignStatus.js"
          - type: contains
            file: "functions/src/bulk/getCampaignStatus.js"
            patterns:
