      - id: BCF-05
        status: "todo"
        task: "Implement `cancelCampaign` Cloud Function (HTTPS POST, admin-only)"
        files_to_create:
          - "functions/src/bulk/cancelCampaign.js"
        behaviour:
          - "Authentication: Firebase Auth ID token with admin custom claim ONLY. Return 403 { error: 'admin_only' } for non-admin callers."
          - "Accept: { campaignId }."
          - "Read Firestore bulk_campaigns/{campaignId}. Return 404 if not found."
          - "If status IN ['completed', 'cancelled']: return 409 { error: 'campaign_already_terminal', currentStatus }."
          - "Step 1 (LOCK): Update Firestore bulk_campaigns/{campaignId}: status = 'cancelling', updatedAt = now(). This acts as a distributed lock — dispatchBulkJobs and BCF-07 must skip campaigns in 'cancelling' state. If this update fails due to a concurrent write, retry once; if it fails again, return 409 { error: 'concurrent_modification' }."
          - "Step 2 (DRAIN): Wait 3 seconds (or poll) to allow any in-flight BCF-07 triggers that were already queued to complete their runTransaction writes. This bounds the race window for the last in-flight jobs."
          - "Step 3 (PURGE QUEUE): Re-read the latest campaign snapshot to get fresh sentCount + failedCount. Query RTDB /bulk_sms_queue ordered by campaignId. Delete all nodes where campaignId matches and status == 'pending'. Process in batches of 100 RTDB deletes to avoid payload limits."
          - "Step 4 (REFUND): Run Firestore runTransaction on bulk_credits/{appId}: read current campaign sentCount + failedCount (fresh from Firestore, not from the initial read). Calculate refundCount = campaign.totalCost - (campaign.sentCount + campaign.failedCount). If refundCount > 0: balance += refundCount."
          - "Step 5: Update campaign: status = 'cancelled', cancelledAt = now(), updatedAt = now()."
          - "Return 200 { success: true, cancelledAt, refundedCredits: refundCount }."
          - "IMPORTANT: 'cancelling' is a transient internal status. The campaign must end in 'cancelled'. If the function crashes after Step 1 but before Step 5, a Cloud Scheduler or admin-triggered cleanup job must detect 'cancelling' campaigns older than 5 minutes and complete the cancellation."
        verification:
          - type: file_exists
            path: "functions/src/bulk/cancelCampaign.js"
          - type: contains
            file: "functions/src/bulk/cancelCampaign.js"
            patterns:
              - "admin_only"
              - "campaign_already_terminal"
              - "bulk_sms_queue"
              - "runTransaction"
              - "refundCount\\|refundedCredits"
              - "status.*cancelling"
              - "totalCost"
              - "concurrent_modification"
        depends_on: [BCF-01, BCFS-04]
        priority: critical
        security_notes:
          - "Restrict to admin callers only — clients must not be able to cancel another user's campaign or manipulate credit refunds."
          - "Credit refund uses runTransaction to prevent race conditions with concurrent BCF-07 counter updates."

      - id: BCF-06
        status: "todo"
        task: "Implement `retryFailedJobs` Cloud Function (HTTPS POST)"
        files_to_create:
          - "functions/src/bulk/retryFailedJobs.js"
        behaviour:
          - "Authentication: validate appId + appSecret (owner) OR admin custom claim."
          - "Accept: { campaignId }."
          - "Read Firestore bulk_campaigns/{campaignId}. Verify ownership."
          - "If status NOT IN ['completed', 'failed']: return 409 { error: 'retry_not_allowed', reason: 'Campaign must be in completed or failed state to retry' }."
          - "Query RTDB /bulk_sms_queue where campaignId == campaignId and status == 'failed'. For each node: reset { status: 'pending', attempts: 0, error: null }."
          - "Update Firestore bulk_campaigns/{campaignId}: status = 'sending', set failedCount = 0 (the retried jobs will re-increment if they fail again)."
          - "dispatchBulkJobs will resume dispatching on the next scheduler tick."
          - "Return 200 { success: true, retriedCount }."
        verification:
          - type: file_exists
            path: "functions/src/bulk/retryFailedJobs.js"
          - type: contains
            file: "functions/src/bulk/retryFailedJobs.js"
            patterns:
              - "retry_not_allowed"
              - "status.*pending"
              - "attempts.*0\\|attempts: 0"
              - "failedCount.*0\\|failedCount: 0"
        depends_on: [BCF-01, BCF-07]
        priority: high

      - id: BCF-07
        status: "todo"
        task: "Implement RTDB `onUpdate` trigger on `/bulk_sms_queue/{jobId}` to update campaign counters"
        files_to_create:
          - "functions/src/bulk/onBulkJobStatusChange.js"
        behaviour:
          - "Trigger: database().ref('/bulk_sms_queue/{jobId}').onUpdate()"
          - "Read beforeStatus = change.before.data().status and afterStatus = change.after.data().status."
          - "Only act on transitions TO 'sent' or 'failed'. Ignore all other transitions (e.g. pending→pending, attempts increment)."
          - "On transition to 'sent':"
          - "  Run Firestore runTransaction on bulk_campaigns/{campaignId}:"
          - "    sentCount++."
          - "    Recalculate estimatedFinishAt."
          - "    If sentCount + failedCount >= totalCount: set status = 'completed', completedAt = now()."
          - "  Delete the RTDB /bulk_sms_queue/{jobId} node (job is resolved — clean up queue)."
          - "On transition to 'failed':"
          - "  Read attempts and maxRetries from the after snapshot."
          - "  If attempts < maxRetries: increment attempts, reset status = 'pending' in RTDB. BCF-02 will re-dispatch on next tick."
          - "  If attempts >= maxRetries (permanently failed):"
          - "    Run Firestore runTransaction on bulk_campaigns/{campaignId}: failedCount++, check completion condition."
          - "    Write audit record to Firestore bulk_campaigns/{campaignId}/failed_jobs/{jobId}: { to: phone (hashed as SHA-256 — do NOT store raw phone number), error, attempts, failedAt: now() }."
          - "    Delete the RTDB /bulk_sms_queue/{jobId} node."
          - "CRITICAL: This trigger fires because the Android app writes status BEFORE the job is deleted. This is different from the /pending_sms flow (which uses removeValue). Do not confuse the two patterns."
        verification:
          - type: file_exists
            path: "functions/src/bulk/onBulkJobStatusChange.js"
          - type: contains
            file: "functions/src/bulk/onBulkJobStatusChange.js"
            patterns:
              - "onUpdate"
              - "bulk_sms_queue"
              - "sentCount\\|failedCount"
              - "runTransaction"
              - "status.*completed"
              - "attempts.*maxRetries\\|maxRetries.*attempts"
              - "createHash.*sha256\\|phone.*hash"
          - type: anti_pattern_check
            file: "functions/src/bulk/onBulkJobStatusChange.js"
            forbidden: "update\\(.*sentCount\\|update\\(.*failedCount"
            description: "Counter updates MUST use runTransaction, never update() — race condition risk"
        depends_on: [BCF-01, BCFS-01, BCFS-04]
        priority: critical
        security_notes:
          - "Phone numbers in the failed_jobs audit record must be stored as SHA-256 hashes — never raw PII."
          - "runTransaction is non-negotiable for counter updates. Any rewrite using update() is a data integrity defect."

      - id: BCF-08
        status: "todo"
        task: "Implement bulk credit management: `upsertBulkPackage`, `requestBulkCredit`, `submitBulkTrxId`, `approveBulkCredit`, `getBulkCredits`"
        files_to_create:
          - "functions/src/bulk/upsertBulkPackage.js"
          - "functions/src/bulk/requestBulkCredit.js"
          - "functions/src/bulk/submitBulkTrxId.js"
          - "functions/src/bulk/approveBulkCredit.js"
          - "functions/src/bulk/getBulkCredits.js"
        behaviour:
          - "upsertBulkPackage: mirrors BK-00 (upsertPackage) but targets bulk_packages collection. Admin auth required."
          - "requestBulkCredit: mirrors BK-01 (requestCredit) but targets bulk_packages / bulk_transactions. Returns bKash payment instructions using BKASH_PERSONAL_NUMBER env var."
          - "submitBulkTrxId: mirrors BK-02 (submitTrxId) but for bulk_transactions. Checks for duplicate trxId across all bulk_transactions."
          - "approveBulkCredit: mirrors BK-03 (approveCredit) but credits go to bulk_credits/{appId}.balance (NOT app_credits.sms_remaining). Idempotency: if transaction.status != 'pending' → 409 { error: 'already_resolved' }. Run Firestore runTransaction: bulk_credits/{appId}.balance += transaction.smsQuota."
          - "getBulkCredits: authenticate via appId + appSecret. Return { balance, lifetimePurchased, updatedAt } from bulk_credits/{appId}. Return { balance: 0, lifetimePurchased: 0 } if document does not exist."
          - "IMPORTANT: These functions do not share code with the OTP billing functions. Each reads/writes its own collection hierarchy."
        verification:
          - type: file_exists
            paths:
              - "functions/src/bulk/upsertBulkPackage.js"
              - "functions/src/bulk/requestBulkCredit.js"
              - "functions/src/bulk/submitBulkTrxId.js"
              - "functions/src/bulk/approveBulkCredit.js"
              - "functions/src/bulk/getBulkCredits.js"
          - type: contains
            file: "functions/src/bulk/approveBulkCredit.js"
            patterns:
              - "bulk_credits"
              - "already_resolved"
              - "runTransaction"
              - "balance.*smsQuota\\|smsQuota.*balance"
          - type: contains
            file: "functions/src/bulk/getBulkCredits.js"
            patterns:
              - "bulk_credits"
              - "balance"
          - type: anti_pattern_check
            file: "functions/src/bulk/approveBulkCredit.js"
            forbidden: "app_credits\\|sms_remaining"
            description: "approveBulkCredit must only modify bulk_credits, never app_credits"
        depends_on: [BCFS-02, BCFS-03, BCF-00]
        priority: critical
        notes: >
          These functions are intentionally modelled after the existing OTP billing functions
          (BK-00 through BK-03) to minimise the learning curve for developers. The key
          invariant: bulk credits and OTP credits are stored in completely separate Firestore
          collections and are managed by completely separate Cloud Functions.

