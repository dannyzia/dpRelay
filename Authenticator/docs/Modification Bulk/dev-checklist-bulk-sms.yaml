        depends_on: [BCF-01]
        priority: critical

      - id: BCF-04
        status: "todo"
        task: "Implement `pauseCampaign` Cloud Function (HTTPS POST)"
        files_to_create:
          - "functions/src/bulk/pauseCampaign.js"
        behaviour:
          - "Authentication: validate appId + appSecret (app owner) OR admin custom claim."
          - "Accept: { campaignId }."
          - "Read Firestore bulk_campaigns/{campaignId}. Verify appId ownership (or admin)."
          - "If status != 'sending': return 409 { error: 'campaign_not_pausable', currentStatus }."
          - "Update Firestore: status = 'paused', pausedAt = now()."
          - "Return 200 { success: true, campaignId, status: 'paused' }."
          - "Effect: dispatchBulkJobs (BCF-02) skips paused campaigns on subsequent ticks. Jobs already in /bulk_sms_queue continue to be processed by the Android device — do not cancel in-flight jobs."
          - "TODO (v1.1): add resumeCampaign function that sets status back to 'sending'."
        verification:
          - type: file_exists
