      # --- Modify existing: approveCredit ---
      - id: BS-CF-11
        task: "Modify `approveCredit` to handle bulk-type packages (ONLY existing function modification)"
        files_to_modify:
          - "functions/src/billing/approveCredit.js"
        changes:
          - "Inside the Firestore transaction in approveCredit, AFTER reading transactionData, also read the package document to determine its type:"
          - "  const packageRef = db.collection('packages').doc(transactionData.package_id);"
          - "  const packageDoc = await t.get(packageRef);"
          - "  const packageType = packageDoc.exists ? (packageDoc.data().type || 'otp') : 'otp';"
          - "Modify the credit update inside the transaction to route credits by type:"
          - "  if (packageType === 'otp' || packageType === 'both'):{"
          - "    sms_remaining += transactionData.sms_quota;  // existing behavior"
          - "    expires_at = Math.max(current, now + validity_days);  // existing behavior"
          - "  }"
          - "  if (packageType === 'bulk' || packageType === 'both'):{"
          - "    bulk_sms_remaining = (creditsData.bulk_sms_remaining || 0) + transactionData.sms_quota;"
          - "    bulk_expires_at = Math.max(creditsData.bulk_expires_at || 0, now + validity_days);"
          - "    bulk_last_package_id = transactionId;"
          - "    bulk_purchased_at = now();"
          - "  }"
          - "  Add bulk_* fields to the t.set() updateData object when packageType is bulk or both."
          - "Default to 'otp' for packages without type field (backward-compatible)."
          - "Update the return value to include both OTP and bulk balances."
        verification:
          - type: contains
            file: "functions/src/billing/approveCredit.js"
            patterns:
              - "bulk_sms_remaining"
              - "packageType\\|type.*bulk\\|bulk.*type"
              - "packages.*doc\\|package_id"
        depends_on: [BS-FS-03, BS-FS-04]
        priority: critical
        notes: >
          This is the ONLY modification to an existing production function. The change
          is additive: existing packages without 'type' field default to 'otp' — behavior
          unchanged. New bulk packages with type='bulk' go through the new code path.

          IMPORTANT: The current approveCredit reads the transaction doc (which has
          sms_quota, validity_days, appId, package_id) but does NOT read the package
          document. This modification adds a package read inside the Firestore
          transaction to determine the package type. The package_id is already stored
          on the transaction document, so this is a straightforward addition.

