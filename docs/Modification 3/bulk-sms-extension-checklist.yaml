  # =========================================================================
  # PHASE 16 — Testing, Monitoring & Migration
  # =========================================================================
  - id: 16
    name: "Testing, Monitoring & Migration"
    blocking: false
    description: >
      Comprehensive testing: unit tests for all new CFs, integration tests for
      the full campaign lifecycle, OTP regression tests, rate limiting verification,
      and a zero-downtime migration plan.
    items:
      # --- Unit Tests ---
      - id: BS-TEST-01
        task: "Write unit tests for bulkHelpers validation utilities"
        files_to_create:
          - "functions/test/bulk/bulkHelpers.test.js"
        test_cases:
          - "validateE164: '+8801712345678' → true, '01712345678' → false (no +), '+1abc' → false, '' → false."
          - "validateBulkMessage GSM: 'Hello world' (11 chars, GSM) → { valid: true, charset: 'gsm' }."
          - "validateBulkMessage UCS-2: 'Hello 🌍' (contains emoji) → { valid: true, charset: 'ucs2' }."
          - "validateBulkMessage over limit GSM: 161 'a's → { valid: false, error: 'Message exceeds 160 chars' }."
          - "validateBulkMessage over limit UCS-2: 71 Bengali chars → { valid: false, error: 'Message exceeds 70 chars' }."
          - "parseCSV valid: 'phone\\n+8801\\n+8802' → ['+8801', '+8802']."
          - "parseCSV no phone column: 'name\\nJohn' → throws error."
          - "parseCSV empty: '' → throws error."
          - "deduplicatePhones no dupes: ['+1', '+2'] → { unique: ['+1', '+2'], duplicateCount: 0 }."
          - "deduplicatePhones with dupes: ['+1', '+1', '+2'] → { unique: ['+1', '+2'], duplicateCount: 1 }."
          - "isGsm7Bit: 'Hello world 123!' → true. 'Hello 🌍' → false. 'আমি' → false."
        verification:
          - type: command
            run: "cd functions && npm test -- bulkHelpers.test.js"
            expect_exit: 0
        depends_on: [BS-CF-UTILS]
        priority: critical

      - id: BS-TEST-02
        task: "Write unit tests for createBulkCampaign Cloud Function"
        files_to_create:
          - "functions/test/bulk/createBulkCampaign.test.js"
        test_cases:
          - "Valid campaign: Firestore doc created, recipients sub-collection populated, credits deducted, RTDB progress node created."
          - "Feature flag disabled (bulk_enabled=false): returns 403 bulk_not_enabled."
          - "Feature flag enabled: proceeds normally."
          - "Invalid phone: returns 400."
          - "Over campaign limit (10001 phones): returns 400."
          - "Insufficient bulk credits: returns 402 insufficient_bulk_credits."
          - "Expired bulk credits: returns 402."
          - "Daily quota exceeded: returns 429."
          - "Unauthenticated: returns 401."
          - "Non-owner: returns 403."
          - "Duplicate phones: proceeds with unique set, response includes duplicateCount."
        verification:
          - type: command
            run: "cd functions && npm test -- createBulkCampaign.test.js"
            expect_exit: 0
        depends_on: [BS-CF-01]
        priority: critical

      - id: BS-TEST-03
        task: "Write unit tests for onSmsCompleted RTDB trigger"
        files_to_create:
          - "functions/test/bulk/onSmsCompleted.test.js"
        test_cases:
          - "Bulk job (batchId present, no error): /bulk_progress sentCount incremented, Firestore recipient status = 'sent'."
          - "OTP job (batchId absent): function returns immediately, no RTDB/Firestore writes."
          - "Bulk job with error field (stale): no counter update (handled by processBulkQueue instead)."
          - "Unknown batchId (campaign not found): logs warning, no crash."
        verification:
          - type: command
            run: "cd functions && npm test -- onSmsCompleted.test.js"
            expect_exit: 0
        depends_on: [BS-CF-02]
        priority: critical

      - id: BS-TEST-04
        task: "Write unit tests for processBulkQueue Cloud Function"
        files_to_create:
          - "functions/test/bulk/processBulkQueue.test.js"
        test_cases:
          - "One queued campaign (50 recipients): creates 30 entries (rate limit), updates recipient status to 'queued', updates campaign.nextRecipientIndex."
          - "Second invocation: creates next 20, campaign fully queued."
          - "Queue at limit (BULK_MAX_PENDING_QUEUE): skips enqueue phase."
          - "Paused campaign: skipped entirely."
          - "Two concurrent campaigns: each gets floor(30/2)=15 slots (round-robin)."
          - "Stale errored entry (5+ min old, retryCount < max): deleted, recipient status → 'retrying'."
          - "Stale errored entry (retryCount >= max): deleted, failedCount incremented, recipient status → 'failed'."
          - "OTP entries in /pending_sms: not counted toward bulk queue limit, not touched."
        verification:
          - type: command
            run: "cd functions && npm test -- processBulkQueue.test.js"
            expect_exit: 0
        depends_on: [BS-CF-03]
        priority: critical

      - id: BS-TEST-05
        task: "Write unit tests for campaign lifecycle functions (pause/resume/cancel)"
        files_to_create:
          - "functions/test/bulk/campaignLifecycle.test.js"
        test_cases:
          - "pauseCampaign on 'sending': status → paused in Firestore + RTDB."
          - "pauseCampaign on 'completed': rejected 409."
          - "resumeCampaign on 'paused': status → sending."
          - "cancelCampaign on 'sending': credits refunded, /pending_sms bulk entries deleted, recipients status → cancelled."
          - "cancelCampaign on 'completed': rejected 409."
          - "Non-owner: rejected 403."
        verification:
          - type: command
            run: "cd functions && npm test -- campaignLifecycle.test.js"
            expect_exit: 0
        depends_on: [BS-CF-07, BS-CF-08, BS-CF-09]
        priority: critical

      # --- Integration Test ---
      - id: BS-TEST-06
        task: "End-to-end integration test — full bulk campaign lifecycle with OTP regression"
        files_to_create:
          - "functions/test/bulk/e2e-bulk-campaign.test.js"
        test_steps:
          - "1. Set /config/bulk_enabled = true."
          - "2. Seed a bulk-type package via upsertPackage."
          - "3. Register app, create bulk transaction, approve → bulk_sms_remaining set."
          - "4. Create bulk campaign with 5 phones → status='queued', credits reserved."
          - "5. Run processBulkQueue → creates /pending_sms entries."
          - "6. Simulate Android: delete /pending_sms entries (triggers onSmsCompleted)."
          - "7. Run processBulkQueue again → remaining entries queued."
          - "8. Simulate remaining deletions."
          - "9. Run finalizeCompletedCampaigns → status='completed'."
          - "10. Verify Firestore: sentCount=5, failedCount=0, status='completed'."
          - "11. Verify bulk webhook was called (mock endpoint)."
          - "12. Send OTP via sendOtp → succeeds, sms_remaining decremented (NOT bulk)."
          - "13. Verify OTP /pending_sms entry has NO batchId."
        verification:
          - type: command
            run: "cd functions && firebase emulators:exec --only auth,functions,firestore,database 'npm test -- e2e-bulk-campaign.test.js'"
            expect_exit: 0
        depends_on: [BS-TEST-02, BS-TEST-03, BS-TEST-04, BS-TEST-05]
        priority: critical

      # --- OTP Regression Test ---
      - id: BS-TEST-07
        task: "OTP regression test — verify sendOtp flow UNAFFECTED after all bulk changes deployed"
        files_to_create:
          - "functions/test/bulk/otp-regression.test.js"
        test_cases:
          - "sendOtp creates /pending_sms entry WITHOUT batchId field."
          - "sendOtp decrements sms_remaining (NOT bulk_sms_remaining)."
          - "verifyOtp works identically with all bulk CFs deployed."
          - "otpStatus webhook delivery unaffected."
          - "onDelete trigger on OTP /pending_sms deletion: returns immediately (no bulk counter update)."
          - "approveCredit for OTP-type package: increments sms_remaining only (not bulk)."
          - "aggregateStats still populates OTP metrics correctly alongside new bulk metrics."
        verification:
          - type: command
            run: "cd functions && npm test -- otp-regression.test.js"
            expect_exit: 0
        depends_on: [BS-CF-14]
        priority: critical
        notes: >
          This is the MOST IMPORTANT test. It verifies that the onDelete trigger
          correctly ignores OTP deletions (returns immediately) and that ALL existing
          OTP functions work without any change. If this test fails, the bulk extension
          is blocked from deployment.

      # --- Rate Limiting Verification ---
      - id: BS-TEST-08
        task: "Verify rate limiting prevents queue overflow"
        files_to_create:
          - "functions/test/bulk/rateLimiting.test.js"
        test_cases:
          - "processBulkQueue respects BULK_SMS_RATE_PER_MINUTE per campaign."
          - "processBulkQueue respects BULK_MAX_PENDING_QUEUE global limit."
          - "Round-robin: two active campaigns each get equal budget."
          - "Retry budget (BULK_RETRY_BUDGET_PER_MINUTE) is separate from new-campaign budget."
          - "Daily quota enforced at campaign creation."
        verification:
          - type: command
            run: "cd functions && npm test -- rateLimiting.test.js"
            expect_exit: 0
        depends_on: [BS-TEST-04]
        priority: critical

      # --- Stress Test ---
      - id: BS-TEST-09
        task: "Stress test — 10 000 recipients, verify no timeouts"
        files_to_create:
          - "functions/test/bulk/stressTest.test.js"
        test_cases:
          - "Generate 10 000 unique E.164 phone numbers."
          - "Call createBulkCampaign — must complete within 60 seconds (CF timeout)."
          - "Verify recipients sub-collection has 10 000 documents."
          - "Run processBulkQueue multiple times until all queued."
          - "Verify total /pending_sms entries created == 10 000."
          - "Verify total Firestore reads per processBulkQueue invocation <= 30 + 1 (query)."
        verification:
          - type: command
            run: "cd functions && firebase emulators:exec --only auth,functions,firestore,database 'npm test -- stressTest.test.js'"
            expect_exit: 0
        depends_on: [BS-TEST-06]
        priority: high

      # --- Migration Plan ---
      - id: BS-MIGRATE-01
        task: "Execute zero-downtime migration plan"
        migration_steps:
          - step: 1
            action: "Deploy updated Firestore security rules (firestore.rules) — additive, no breaking changes."
            risk: "none — new rules only add bulk_campaigns, do not modify existing rules."
          - step: 2
            action: "Deploy updated RTDB security rules (database.rules.json) — adds /bulk_progress read rule, /config write rule. Existing rules unchanged."
            risk: "none"
          - step: 3
            action: "Set /config/bulk_enabled = false in RTDB (if not already done in BS-RT-05)."
            risk: "none"
          - step: 4
            action: "Deploy all new Cloud Functions (BS-CF-01 through BS-CF-14). Only existing function modifications: approveCredit (additive: defaults to 'otp' for existing packages) and aggregateStats (additive: new fields in /stats)."
            risk: "low — approveCredit is additive; sendOtp is documentation-only."
          - step: 5
            action: "Deploy Firestore indexes (firestore.indexes.json). Indexes build asynchronously in background."
            risk: "none"
          - step: 6
            action: "Run seedPackages script to add bulk-type packages. Existing OTP packages untouched."
            risk: "none — additive data."
          - step: 7
            action: "Deploy React PWA update (new bulk pages + updated sidebar + updated credits views). Existing pages unchanged."
            risk: "none — new routes, existing pages untouched. Sidebar shows 'Bulk SMS' only when /config/bulk_enabled = true."
          - step: 8
            action: "Deploy Android app update (SmsRateLimiter only). This adds a 2-second delay between SMS sends — acceptable for OTP. Existing SMS logic unchanged: send → delete on success, write error on failure."
            risk: "low — rate limiter adds at most 2-second delay to OTP sends. The onDelete trigger (already deployed in step 4) ignores OTP deletions."
          - step: 9
            action: "Verify OTP flow still works end-to-end after Android update."
            risk: "none — just verification."
          - step: 10
            action: "Set /config/bulk_enabled = true in RTDB via Firebase Console. This enables bulk campaign creation. The processBulkQueue CF starts processing campaigns."
            risk: "none — no campaigns exist yet, so nothing changes until first campaign is created."
          - step: 11
            action: "Announce bulk SMS feature. Users can now create campaigns."
            risk: "none"
        verification:
          - type: manual_check
            description: "Follow steps 1-11 in order. Verify OTP flow after step 8. Verify bulk_enabled=true after step 10."
        depends_on: [BS-TEST-07]
        priority: critical
        notes: >
          KEY SAFETY FEATURE: Steps 1-9 can be deployed in any order without any
          risk because /config/bulk_enabled is false (step 3). No bulk campaigns
          can be created until step 10. This provides a clean activation gate.
          If any issue is found during steps 4-9, simply don't do step 10.

      # --- Monitoring ---
      - id: BS-MON-01
        task: "Add monitoring alerts for bulk campaign health"
        files_to_create:
          - "functions/src/bulk/bulkAlerts.js"
        behaviour:
          - "Integrate into finalizeCompletedCampaigns:"
          - "Campaign stuck in 'sending' for > 2 hours: log warning to Cloud Logging."
          - "Bulk failure rate > 20% at campaign completion: log warning with campaign details."
          - "/pending_sms bulk queue depth > BULK_MAX_PENDING_QUEUE for > 5 minutes: log warning."
        verification:
          - type: file_exists
            path: "functions/src/bulk/bulkAlerts.js"
        depends_on: [BS-CF-04]
        priority: medium

# ---------------------------------------------------------------------------
# FAILURE CONDITIONS — Deployment Blockers for Bulk SMS
# ---------------------------------------------------------------------------
failure_conditions:
  - condition: "processBulkQueue creates more entries than BULK_SMS_RATE_PER_MINUTE per campaign"
    check: "grep -L 'BULK_SMS_RATE_PER_MINUTE' functions/src/bulk/processBulkQueue.js"
    action: "BLOCK_DEPLOY"

  - condition: "No rate limiter in Android SMS sending code"
    check: "grep -rL 'SmsRateLimiter\\|postDelayed' authenticator-app/app/src/main/java/"
    action: "BLOCK_DEPLOY"

  - condition: "createBulkCampaign does not check bulk_sms_remaining"
    check: "grep -L 'bulk_sms_remaining' functions/src/bulk/createBulkCampaign.js"
    action: "BLOCK_DEPLOY"

  - condition: "Credit reservation not in Firestore transaction (race condition)"
    check: "grep -L 'runTransaction' functions/src/bulk/createBulkCampaign.js"
    action: "BLOCK_DEPLOY"

  - condition: "onDelete trigger does not skip OTP jobs (would corrupt OTP flow)"
    check: "grep -L 'batchId.*null\\|return.*batchId\\|OTP.*return\\|return.*null' functions/src/bulk/onSmsCompleted.js"
    action: "BLOCK_DEPLOY"

  - condition: "sendOtp accidentally writes batchId to /pending_sms"
    check: "grep 'batchId.*=' functions/index.js | grep -v '// .*batchId\\|null\\|comment'"
    action: "BLOCK_DEPLOY"

  - condition: "cancelCampaign does not refund unused bulk credits"
    check: "grep -L 'refund\\|bulk_sms_remaining' functions/src/bulk/cancelCampaign.js"
    action: "BLOCK_DEPLOY"

  - condition: "OTP regression test fails — bulk changes broke existing OTP flow"
    check: "cd functions && npm test -- otp-regression.test.js 2>&1 | grep -i 'fail\\|error'"
    action: "BLOCK_DEPLOY"

  - condition: "Feature flag /config/bulk_enabled not checked by createBulkCampaign"
    check: "grep -L 'bulk_enabled' functions/src/bulk/createBulkCampaign.js"
    action: "BLOCK_DEPLOY"

  - condition: "No per-campaign SMS limit enforced"
    check: "grep -L 'BULK_SMS_PER_CAMPAIGN_LIMIT' functions/src/bulk/createBulkCampaign.js"
    action: "BLOCK_DEPLOY"

  - condition: "Phone numbers stored unhashed in bulk usage audit log"
    check: "grep -r 'phone.*bulk_usage\\|bulk_usage.*phone' functions/src/bulk/createBulkCampaign.js | grep -v 'hash\\|sha256\\|phone_hash'"
    action: "BLOCK_DEPLOY"

  - condition: "processBulkQueue does not handle stale errored entries (jobs stuck forever)"
    check: "grep -L 'stale\\|STALE_ENTRY_TIMEOUT\\|error.*retryCount' functions/src/bulk/processBulkQueue.js"
    action: "BLOCK_DEPLOY"


# =============================================================================
# PHASE 17 — OTP Resend Guard & Per-Phone Delivery Cooldown
# =============================================================================
# Added post-launch to close the "hundred SMS for one click" abuse vector.
# All items in this phase are complete and deployed.
# =============================================================================

  - id: 17
    status: complete
    name: "OTP Resend Guard & Per-Phone Delivery Cooldown"
    blocking: false
    description: >
      Closes the loop that allowed a single OTP session to trigger hundreds of
      outgoing SMS messages.  Three root causes were addressed:
        (1) No confirmed-delivery signal — the server never knew the SMS actually
            reached the device, so otpStatus could queue unlimited resends.
        (2) Resend path had no per-session retry cap or shared cooldown check.
        (3) processBulkQueue had no per-phone cooldown awareness, so a phone
            that had just received an OTP or bulk SMS could be queued again
            immediately.

    items:
      - id: RS-01
        status: complete
        task: "Write sent_at to otp_requests when Authenticator app confirms delivery"
        files_modified:
          - "functions/src/bulk/onSmsCompleted.js"
        description: >
          The Android app signals a successful send by DELETING /pending_sms/{sessionId}.
          onSmsCompleted (the RTDB onValueDeleted trigger) now handles OTP jobs
          (batchId absent) as well as bulk:
            - Writes sent_at: ServerValue.TIMESTAMP to /otp_requests/{sessionId}.
            - Extends the per-phone otp_cooldown entry to POST_CONFIRM_COOLDOWN_MS
              (2 minutes) from the moment of confirmed delivery.
          This is the authoritative "this SMS was sent" record — it cannot be faked
          by the client and cannot be bypassed by calling otpStatus directly.
        depends_on: []
        priority: critical

      - id: RS-02
        status: complete
        task: "Block otpStatus resend if sent_at is already stamped on the session"
        files_modified:
          - "functions/index.js  (otpStatus handler)"
        description: >
          After reading otp_requests/{sessionId}, otpStatus now checks for the
          sent_at field before doing anything else.  If present:
            - Returns HTTP 200 { status: 'sent', sent_at: <epoch> }.
            - Does NOT queue a new pending_sms entry under any circumstances.
          This is the primary resend guard.  Even if the client sends resend:true,
          or polls repeatedly, it will always receive 'sent' once delivery is confirmed.
        depends_on: [RS-01]
        priority: critical

      - id: RS-03
        status: complete
        task: "Cap resend attempts per session to MAX_RESENDS (2)"
        files_modified:
          - "functions/index.js  (otpStatus resend block)"
        description: >
          otp_requests/{sessionId} now tracks resend_count (incremented each time
          otpStatus queues a resend).  If resend_count >= MAX_RESENDS (2), the
          request is rejected with HTTP 429 { error: 'max_resends_exceeded' }.
          This prevents infinite retry loops from SDK polling logic in the event
          of repeated SMS delivery failures.
        depends_on: []
        priority: high

      - id: RS-04
        status: complete
        task: "Add per-phone RTDB cooldown check to otpStatus resend path"
        files_modified:
          - "functions/index.js  (otpStatus resend block)"
        description: >
          The resend path in otpStatus now checks otp_cooldown/{phoneHash} —
          the same shared RTDB node checked by sendOtp.  If an active cooldown
          exists, resend returns HTTP 429 { error: 'cooldown', waitSeconds: N }.
          On a successful resend queue, the cooldown is re-armed for 30 seconds.
          Note: the cooldown is NOT checked for the resend itself (the phone
          hasn't received anything if the first send failed), but it prevents
          a failure → immediate-resend → failure loop from happening faster
          than the 30-second window.
        depends_on: []
        priority: high

      - id: RS-05
        status: complete
        task: "Add per-phone cooldown check to processBulkQueue before enqueue"
        files_modified:
          - "functions/src/bulk/processBulkQueue.js"
        description: >
          Before writing a bulk recipient to /pending_sms, processBulkQueue now
          calls isPhoneOnCooldown(phone) — which reads otp_cooldown/{hash} from
          RTDB.  Phones with an active cooldown are skipped for that batch and
          will be retried on the next scheduler run (1 minute later).
          Reads are parallelised with Promise.all so the overhead is ~5-10 ms
          per batch regardless of batch size.
          Effect: a phone that just received a confirmed OTP SMS cannot receive
          a bulk SMS within 2 minutes, and vice versa.
        depends_on: [RS-01]
        priority: medium

    post_deploy_verification:
      - "Send an OTP → wait for Android delivery confirmation → call otpStatus with resend:true → expect HTTP 200 {status:'sent'}"
      - "Send an OTP (undelivered) → call otpStatus with resend:true 3 times → 3rd call should return HTTP 429 {error:'max_resends_exceeded'}"
      - "Send an OTP to phone X → within 2 minutes, start a bulk campaign that includes phone X → verify phone X is skipped in processBulkQueue until cooldown expires"
