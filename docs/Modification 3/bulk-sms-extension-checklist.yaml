  # =========================================================================
  # PHASE 14 — Android App — Rate Limiter Only
  # =========================================================================
  - id: 14
    status: complete
    name: "Android App — Rate Limiter Only"
    blocking: true
    description: >
      The ONLY Android change required for bulk SMS is adding a rate limiter
      to prevent carrier blocking. The Android app's core behavior is UNCHANGED:
      it still sends SMS via SmsManager and deletes /pending_sms on success.
      Bulk progress tracking is handled entirely by the onDelete server-side
      trigger — the Android app does not know about bulk campaigns.
    items:
      - id: BS-AN-01
        task: "Add SMS rate limiter to Android foreground service"
        files_to_create:
          - "authenticator-app/app/src/main/java/com/digitalpapyrus/authenticator/ratelimit/SmsRateLimiter.kt"
        behaviour:
          - "Implement a Handler-based rate limiter on a single background thread."
          - "Minimum interval between SMS sends: 2 seconds (configurable)."
          - "All SmsManager.sendTextMessage() calls must go through this limiter — both OTP and bulk."
          - "Interface:"
          - "  fun enqueueSms(destination: String, text: String, sentIntent: PendingIntent?, deliveryIntent: PendingIntent?, onComplete: () -> Unit)"
          - "  fun getQueueDepth(): Int"
          - "  fun getEstimatedWaitMs(): Long"
          - "Thread-safe: all sends serialized through a single Handler."
          - "The rate limiter sits between the existing SmsListenerService and SmsManager — a thin wrapper."
        verification:
          - type: file_exists
            path: "authenticator-app/app/src/main/java/com/digitalpapyrus/authenticator/ratelimit/SmsRateLimiter.kt"
          - type: contains
            file: "authenticator-app/app/src/main/java/com/digitalpapyrus/authenticator/ratelimit/SmsRateLimiter.kt"
            patterns:
              - "Handler\\|postDelayed"
              - "sendTextMessage\\|SmsManager"
              - "enqueueSms"
        depends_on: []
        priority: critical

      - id: BS-AN-02
        task: "Integrate SmsRateLimiter into existing PendingSmsListener"
        files_to_modify:
          - "authenticator-app/app/src/main/java/com/digitalpapyrus/authenticator/PendingSmsListener.kt"
        changes:
          - "Replace direct SmsManager.sendTextMessage() calls with SmsRateLimiter.enqueueSms()."
          - "In the onComplete callback: perform the existing post-send logic (delete /pending_sms/{sessionId} on success, write error on failure)."
          - "The rate limiter delays the actual send but the completion callback handles the rest."
          - "No branching logic for batchId — the service does not care if it's OTP or bulk."
        verification:
          - type: contains
            file: "authenticator-app/app/src/main/java/com/digitalpapyrus/authenticator/PendingSmsListener.kt"
            patterns:
              - "SmsRateLimiter"
              - "enqueueSms"
        depends_on: [BS-AN-01]
        priority: critical
        notes: >
          This is a thin integration. The rate limiter wraps the existing SmsManager call.
          The onChildAdded handler enqueues the SMS, and the onComplete callback does
          exactly what the current code does: delete /pending_sms or write error.

      - id: BS-AN-03
        task: "Verify OTP flow works identically with rate limiter enabled"
        files_to_modify: []
        behaviour:
          - "Send an OTP via the existing sendOtp flow."
          - "Verify: SMS is sent (with a possible 2-second delay if another SMS was just sent)."
          - "Verify: /pending_sms/{sessionId} is deleted on success."
          - "Verify: OTP verification (verifyOtp) still works."
          - "Verify: webhook is delivered."
        verification:
          - type: manual_check
            description: "OTP E2E test with rate limiter active — all steps pass"
        depends_on: [BS-AN-02]
        priority: critical
        notes: "The 2-second delay is acceptable for OTP (user waits for SMS anyway)."

