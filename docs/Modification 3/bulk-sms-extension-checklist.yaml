# =============================================================================
# Bulk SMS Campaign Extension — Development Checklist (v1.1 — Improved)
# =============================================================================
# Extends: dev-checklist.yaml (v2.0) — AuthenticatorService
# Format: YAML 1.2
#
# v1.1 Improvements over v1.0:
#   - Replaced reportBulkSmsResult (HTTPS CF) with onDelete RTDB trigger →
#     Android app behavior is now COMPLETELY unchanged for bulk jobs.
#   - Recipients stored in sub-collection (indexed queries) instead of
#     monolithic array → scales cleanly to 10K without reading 200 KB/min.
#   - Added BULK_ENABLED feature flag → safe rollout switch.
#   - Added GSM 03.38 charset detection in message validation.
#   - Added bulk campaign completion webhook (reuses sendWebhook utility).
#   - Round-robin fairness across concurrent campaigns in processBulkQueue.
#   - Separate retry budget so retries don't starve new campaigns.
#
# AI Instructions:
#   - Parse alongside the parent dev-checklist.yaml.
#   - Phase IDs continue from 11 (parent ends at Phase 10).
#   - All depends_on references use IDs from this file AND the parent.
#   - Items marked `blocking: true` must be deployed before any bulk campaign
#     can be created via the UI.
#   - The existing OTP flow (sendOtp → pending_sms → device sends → status)
#     MUST NOT be altered in any breaking way. Every item below is additive.
#
# PROJECT PATHS (actual codebase, verified):
#   - Cloud Functions:   functions/                          (Node 20, firebase-functions v7)
#   - Functions entry:   functions/index.js                  (monolithic ~1560 lines + re-exports)
#   - Web app:           web/                                (React + Vite, already built)
#   - Android app:       authenticator-app/                  (Kotlin, package com.digitalpapyrus.authenticator)
#   - RTDB rules:        functions/database.rules.json       (only /verification_requests + /health have rules)
#
# KEY CODEBASE FINDINGS:
#   1. sendOtp writes /pending_sms with: { appId, to, message, status, createdAt,
#      webhookUrl?, webhookSecretHash? }. NO batchId field.
#   2. Android PendingSmsListener uses ChildEventListener on /pending_sms.
#      On success: deletes node. On failure: writes error sub-node.
#      PendingSmsData: { appId, to, message, status, createdAt }.
#      Adding batchId/jobId to RTDB entries is safe — Firebase SDK ignores unknown fields.
#   3. sendWebhook reads from /pending_sms/{sessionId} — bulk completion webhook
#      must read from /registered_apps/{appId} instead (entries deleted after send).
#   4. approveCredit reads transaction doc but NOT package doc — needs package.type.
#   5. aggregateStats bug: success_count hardcoded to 0 (const, not let).
#   6. RTDB rules are INCOMPLETE — /pending_sms, /otp_requests, /registered_apps,
#      /stats, /webhook_failures have NO rules defined yet.
# =============================================================================

version: "1.1"
extends: "dev-checklist.yaml"
project: AuthenticatorService_BulkSMS
total_phases: 6

# ---------------------------------------------------------------------------
# CRITICAL PATH — phases that block bulk SMS from functioning
# ---------------------------------------------------------------------------
critical_path:
  - phase: 11
    name: "Firestore Schema & Data Model for Bulk Campaigns"
    must_complete_before: [12, 13]
    reason: "Collections, indexes, and security rules must exist before any CF or UI can reference them"

  - phase: 12
    name: "RTDB Schema Updates & Feature Flag"
    must_complete_before: [13, 14]
    reason: "New /bulk_progress node, /config flag, and extended rules must exist before CF writes or Android reads them"

  - phase: 13
    name: "Cloud Functions for Bulk SMS Processing"
    must_complete_before: [14, 15]
    reason: "All bulk CFs must be deployed before Android rate limiter is needed or UI can create campaigns"

  - phase: 14
    name: "Android App — Rate Limiter Only"
    must_complete_before: [15]
    reason: "Android rate limiter must be deployed before bulk campaigns go live (feature flag prevents early creation)"

  - phase: 15
    name: "Web UI (React) Bulk SMS Pages"
    must_complete_before: []
    reason: "UI is the last layer — depends on all backend and Android changes being complete"

  - phase: 16
    name: "Testing, Monitoring & Migration"
    must_complete_before: []
    reason: "Validation phase — cannot be marked complete until all regression and bulk-specific tests pass"

# ---------------------------------------------------------------------------
# ARCHITECTURE DECISIONS (reference for implementers)
# ---------------------------------------------------------------------------
architecture_decisions:
  queue_reuse:
    decision: "Reuse /pending_sms RTDB node for bulk jobs (add optional batchId field)"
    rationale: >
      The Android app already has a ChildEventListener on /pending_sms. Adding
      batchId is backward-compatible — OTP jobs have batchId=null, bulk jobs
      carry a campaignId. The Android app's behavior does NOT change: it sends
      the SMS and deletes the node on success (identical to OTP). A server-side
      onDelete RTDB trigger detects bulk completions and updates counters.
    alternative_rejected: "Separate /bulk_sms_queue RTDB node — would require a second listener in Android."

  progress_tracking_via_trigger:
    decision: "RTDB onDelete trigger on /pending_sms/{sessionId} updates bulk counters"
    rationale: >
      When the Android app deletes a /pending_sms node (on SMS send success),
      the onDelete trigger fires. If the deleted snapshot has a batchId, the
      trigger increments /bulk_progress/{campaignId}/sentCount. If no batchId
      (OTP job), the trigger returns immediately — zero impact on OTP flow.
      This eliminates the need for the Android app to call any new HTTP
      endpoint or authenticate with a device token.
    alternative_rejected: "HTTPS CF (reportBulkSmsResult) called by Android — adds device auth complexity, new HTTP client class, and ANDROID_DEVICE_TOKEN secret. The trigger approach is simpler and requires ZERO Android behavior changes."

  credit_pool:
    decision: "Separate bulk_sms_remaining field on app_credits/{appId}"
    rationale: >
      User requirement: separate credit pool for bulk. Adding bulk_sms_remaining
      and bulk_expires_at to the existing app_credits document. Packages gain a
      'type' field (otp | bulk | both) to distinguish quotas.
    alternative_rejected: "Dedicated bulk_credits collection — adds collection sprawl for no benefit."

  recipient_storage:
    decision: "Sub-collection bulk_campaigns/{id}/recipients with indexed queries"
    rationale: >
      Each recipient is a document: { phone, index, status, attempts }.
      processBulkQueue queries recipients WHERE status='pending' ORDER BY
      index LIMIT N. This reads only the slice it needs, not the entire list.
      Scales cleanly to 10K without reading a 200KB array every minute.
      Batch writes (500/batch) create all documents at campaign creation.
    alternative_rejected: "Monolithic array in campaign document — reads entire array every minute (200 KB for 10K entries), doesn't scale."

  rate_limiting_strategy:
    decision: "Two-tier rate limiting — server-side drip-feed + Android-side cooldown"
    rationale: >
      processBulkQueue CF creates at most N /pending_sms entries per minute
      (BULK_SMS_RATE_PER_MINUTE, default 30). The Android app enforces a
      2-second minimum gap between consecutive sends as a safety net.
    config_vars:
      - "BULK_SMS_RATE_PER_MINUTE=30       # Max entries queued per campaign per minute"
      - "BULK_MAX_PENDING_QUEUE=100         # Max bulk jobs in /pending_sms globally"
      - "BULK_RETRY_BUDGET_PER_MINUTE=10    # Max retries re-queued per minute"
      - "BULK_SMS_PER_CAMPAIGN_LIMIT=10000  # Hard cap per single campaign"
      - "BULK_DAILY_APP_LIMIT=50000         # Max bulk SMS per app per UTC day"

  feature_flag:
    decision: "RTDB /config/bulk_enabled boolean — admin must explicitly enable"
    rationale: >
      Default false. createBulkCampaign CF checks this flag before allowing
      campaign creation. Admin sets to true via Firebase Console or a CF
      AFTER the Android app update is deployed. Provides a clean kill switch
      and prevents accidental bulk campaign creation before infrastructure is ready.

  campaign_fairness:
    decision: "Round-robin budget allocation across concurrent active campaigns"
    rationale: >
      When multiple campaigns are in 'sending' status, processBulkQueue
      divides the per-minute budget evenly. Each campaign gets
      floor(BULK_SMS_RATE_PER_MINUTE / activeCampaignCount) slots. This
      prevents a large campaign from starving smaller ones.

  bulk_webhook:
    decision: "Separate sendBulkWebhook helper — reads from /registered_apps instead of /pending_sms"
    rationale: >
      The existing sendWebhook in webhook.js reads from /pending_sms/{sessionId}.
      But by the time a bulk campaign completes, all /pending_sms entries are deleted.
      The new sendBulkWebhook reads webhookUrl and webhookSecretHash from
      /registered_apps/{appId} instead. It reuses the HMAC-SHA256 signing and
      exponential backoff retry pattern from the existing webhook.js.

  firebase_region:
    decision: "All new Cloud Functions use region asia-southeast1 (matching existing functions)"
    rationale: >
      The existing functions/index.js and approveCredit.js both specify
      region: 'asia-southeast1'. All new bulk CFs must use the same region
      for consistency and to avoid cross-region latency.

  no_new_dependencies:
    decision: "No new npm packages — implement CSV parsing manually"
    rationale: >
      The current functions/package.json only has firebase-admin and firebase-functions.
      CSV parsing for bulk campaigns is trivial (single 'phone' column, no quoting)
      and does not warrant adding papaparse or csv-parse as dependencies.

# ---------------------------------------------------------------------------
# PHASES
# ---------------------------------------------------------------------------
phases:
  # =========================================================================
  # PHASE 11 — Firestore Schema & Data Model
  # =========================================================================
  - id: 11
    status: complete
    name: "Firestore Schema & Data Model for Bulk Campaigns"
    blocking: true
    description: >
      Add new Firestore collections and indexes for bulk campaign management.
      Extend the existing app_credits and packages schemas to support bulk credits.
      Update Firestore security rules. All changes are additive — no migration
      needed for existing documents.
    items:
      - id: BS-FS-01
        task: "Define `bulk_campaigns` Firestore collection schema"
        files_to_modify:
          - "docs/FIRESTORE-SCHEMA.md"
        schema:
          collection: "bulk_campaigns"
          document_id: "{campaignId}  # auto-generated Firestore ID"
          fields:
            id: "string  # campaignId, same as document ID"
            appId: "string  # referencing /registered_apps/{appId}"
            ownerUid: "string  # Firebase Auth UID of campaign creator"
            campaignName: "string  # user-provided name (max 100 chars)"
            message: "string  # SMS body (length validated against GSM charset)"
            status: "enum: queued | sending | paused | completed | cancelled | failed"
            totalRecipients: "integer  # count of recipients sub-collection docs"
            sentCount: "integer  # successfully sent (updated by sync CF)"
            failedCount: "integer  # permanently failed after all retries"
            queuedCount: "integer  # currently in /pending_sms (not yet sent)"
            createdAt: "timestamp"
            startedAt: "timestamp|null"
            completedAt: "timestamp|null"
            bulkCreditCost: "integer  # total credits reserved (= totalRecipients)"
            errorMessage: "string|null  # campaign-level error message"
            nextRecipientIndex: "integer  # cursor for processBulkQueue — next unqueued recipient index"
        verification:
          - type: contains
            file: "docs/FIRESTORE-SCHEMA.md"
            pattern: "bulk_campaigns"
        depends_on: []
        priority: critical

      - id: BS-FS-02
        task: "Define `bulk_campaigns/{campaignId}/recipients` sub-collection schema"
        files_to_modify:
          - "docs/FIRESTORE-SCHEMA.md"
        schema:
          collection: "bulk_campaigns/{campaignId}/recipients"
          document_id: "auto-generated"
          fields:
            phone: "string  # E.164 phone number"
            index: "integer  # 0-based ordinal for deterministic queue ordering"
            status: "enum: pending | queued | sent | failed | retrying"
            attempts: "integer  # number of send attempts (starts at 0)"
            lastAttemptAt: "timestamp|null"
            errorCode: "string|null  # Android SmsManager error code"
            errorMessage: "string|null"
        verification:
          - type: contains
            file: "docs/FIRESTORE-SCHEMA.md"
            pattern: "recipients.*sub.collection\\|bulk_campaigns.*recipients"
        depends_on: [BS-FS-01]
        priority: critical
        notes: >
          Each recipient is a separate document (not an array element). This allows
          indexed queries: WHERE status='pending' ORDER BY index LIMIT 30 — reads
          only the slice processBulkQueue needs, not the entire list.

      - id: BS-FS-03
        task: "Extend `app_credits` schema with bulk credit fields"
        files_to_modify:
          - "docs/FIRESTORE-SCHEMA.md"
        changes:
          - "Add to app_credits/{appId} document:"
          - "  bulk_sms_remaining: integer  # separate credit pool for bulk SMS (default 0 if absent)"
          - "  bulk_expires_at: timestamp|null  # expiry for bulk credits (independent of OTP expiry)"
          - "  bulk_last_package_id: string|null"
          - "  bulk_purchased_at: timestamp|null"
        verification:
          - type: contains
            file: "docs/FIRESTORE-SCHEMA.md"
            pattern: "bulk_sms_remaining"
        depends_on: []
        priority: critical
        notes: >
          Existing app_credits documents without these fields work fine — code treats
          undefined bulk_sms_remaining as 0. No migration needed.

      - id: BS-FS-04
        task: "Extend `packages` schema with type field (otp vs bulk)"
        files_to_modify:
          - "docs/FIRESTORE-SCHEMA.md"
        changes:
          - "Add to packages/{packageId} document:"
          - "  type: enum 'otp' | 'bulk' | 'both'  # determines which credit pool is incremented on approval"
          - "  sms_quota: integer  # unchanged — applies to the type-specific pool"
          - "Existing packages without 'type' field default to 'otp' (no migration)."
          - "Seed at least two bulk packages alongside existing OTP packages."
        verification:
          - type: contains
            file: "docs/FIRESTORE-SCHEMA.md"
            pattern: "type.*otp.*bulk\\|bulk.*otp.*type"
        depends_on: []
        priority: critical

      - id: BS-FS-05
        task: "Add Firestore composite indexes for bulk campaign queries"
        files_to_modify:
          - "firestore.indexes.json"
        indexes:
          - collection: "bulk_campaigns"
            fields: ["appId ASC", "createdAt DESC"]
            description: "Client dashboard: list own bulk campaigns sorted by date"
          - collection: "bulk_campaigns"
            fields: ["status ASC", "createdAt ASC"]
            description: "processBulkQueue: pick up active campaigns in creation order"
          - collection: "bulk_campaigns"
            fields: ["ownerUid ASC", "status ASC", "createdAt DESC"]
            description: "Admin: filter campaigns by owner and status"
          - collection: "bulk_campaigns/{campaignId}/recipients"
            fields: ["status ASC", "index ASC"]
            description: "processBulkQueue: fetch next batch of pending recipients in order"
          - collection: "bulk_campaigns/{campaignId}/recipients"
            fields: ["status ASC", "lastAttemptAt DESC"]
            description: "Retry: find failed recipients for retry"
        verification:
          - type: contains
            file: "firestore.indexes.json"
            pattern: "bulk_campaigns"
        depends_on: [BS-FS-01, BS-FS-02]
        priority: high

      - id: BS-FS-06
        task: "Update Firestore security rules for bulk_campaigns"
        files_to_modify:
          - "firestore.rules"
        rules:
          bulk_campaigns:
            read: "request.auth != null && (request.auth.token.admin == true || request.auth.uid == resource.data.ownerUid)"
            write: "false  # Cloud Functions (Admin SDK) only"
          "bulk_campaigns/{campaignId}/recipients":
            read: "request.auth != null && (request.auth.token.admin == true || request.auth.uid == get(/databases/$(database)/documents/bulk_campaigns/$(campaignId)).data.ownerUid)"
            write: "false  # Cloud Functions only"
          "app_credits/{appId}/bulk_usage":
            read: "request.auth != null && request.auth.token.admin == true"
            write: "false"
        verification:
          - type: contains
            file: "firestore.rules"
            patterns:
              - "bulk_campaigns"
        depends_on: [BS-FS-01, BS-FS-02, BS-FS-03]
        priority: critical
        security_notes:
          - "Clients cannot directly create or modify bulk_campaigns — all writes via CFs."
          - "Recipient reads require ownerUid match via get() on parent campaign doc."

      - id: BS-FS-07
        task: "Seed bulk SMS packages via seedPackages script"
        files_to_modify:
          - "functions/src/billing/seedPackages.js"
        changes:
          - "Add bulk-type packages to seed data:"
          - "  { name: 'Bulk Starter', type: 'bulk', sms_quota: 1000, price_bdt: 800, validity_days: 30, is_active: true }"
          - "  { name: 'Bulk Pro', type: 'bulk', sms_quota: 5000, price_bdt: 3500, validity_days: 30, is_active: true }"
          - "  { name: 'Bulk Enterprise', type: 'bulk', sms_quota: 10000, price_bdt: 6000, validity_days: 30, is_active: true }"
          - "Add 'type' field with value 'otp' to existing OTP seed data entries."
        verification:
          - type: contains
            file: "functions/src/billing/seedPackages.js"
            pattern: "type.*bulk\\|bulk.*type"
        depends_on: [BS-FS-04]
        priority: high

  # =========================================================================
  # PHASE 12 — RTDB Schema Updates & Feature Flag
  # =========================================================================
  - id: 12
    status: complete
    name: "RTDB Schema Updates & Feature Flag"
    blocking: true
    description: >
      Extend the /pending_sms node to carry bulk campaign metadata (batchId, jobId),
      add /bulk_progress node for real-time campaign tracking, and add /config/bulk_enabled
      feature flag. Update RTDB security rules. All changes are backward-compatible.
    items:
      - id: BS-RT-01
        task: "Document extended /pending_sms schema with optional bulk fields"
        files_to_modify:
          - "docs/FIRESTORE-SCHEMA.md"
        changes:
          - "Add optional fields to /pending_sms/{sessionId}:"
          - "  batchId: string|null  # campaignId if bulk job, null if OTP"
          - "  jobId: string|null    # Firestore recipient doc ID for status updates"
          - "  retryCount: number    # 0 for first attempt, incremented on retry"
          - "Existing OTP entries do NOT include these fields — null/undefined."
          - "Android app behavior is UNCHANGED: send SMS, delete node on success, write error on failure."
        verification:
          - type: contains
            file: "docs/FIRESTORE-SCHEMA.md"
            pattern: "batchId.*pending_sms\\|pending_sms.*batchId"
        depends_on: []
        priority: critical

      - id: BS-RT-02
        task: "Define /bulk_progress/{campaignId} RTDB node schema"
        files_to_modify:
          - "docs/FIRESTORE-SCHEMA.md"
        schema:
          node: "/bulk_progress/{campaignId}"
          fields:
            campaignId: "string"
            sentCount: "integer  # atomically incremented by onDelete trigger"
            failedCount: "integer  # atomically incremented by processBulkQueue for permanent failures"
            totalCount: "integer  # set once at campaign creation"
            updatedAt: "timestamp  # server timestamp"
            status: "enum: queued | sending | paused | completed | cancelled"
        verification:
          - type: contains
            file: "docs/FIRESTORE-SCHEMA.md"
            pattern: "bulk_progress"
        depends_on: []
        priority: critical
        notes: >
          Exists only while campaign is active. Deleted by finalizeCompletedCampaigns
          after syncing final counters to Firestore.

      - id: BS-RT-03
        task: "Add /config/bulk_enabled feature flag node"
        files_to_modify:
          - "docs/FIRESTORE-SCHEMA.md"
        schema:
          node: "/config"
          fields:
            bulk_enabled: "boolean  # default: false. Admin sets to true via Firebase Console or CF."
        verification:
          - type: contains
            file: "docs/FIRESTORE-SCHEMA.md"
            pattern: "bulk_enabled"
        depends_on: []
        priority: critical
        notes: >
          This flag is the safety switch. createBulkCampaign CF checks it before
          allowing campaign creation. Set to true ONLY after Android app update is
          deployed and verified. Can be toggled back to false at any time to
          immediately halt new campaign creation without affecting in-progress campaigns.

      - id: BS-RT-04
        task: "Update RTDB security rules — add /bulk_progress, /config, /pending_sms, /otp_requests, /registered_apps, /stats, /webhook_failures"
        files_to_modify:
          - "functions/database.rules.json"
        rules:
          "/verification_requests": "# EXISTING — keep as-is (auth.token.role == 'authenticator')"
          "/health": "# EXISTING — keep as-is (auth.token.role == 'authenticator')"
          "/registered_apps/{appId}":
            read: "auth != null && (auth.token.admin == true || auth.uid == data.child('ownerUid').val())"
            write: "auth != null && auth.token.admin == true  # Cloud Functions write via Admin SDK"
          "/pending_sms/{sessionId}":
            read: "auth != null && (auth.token.admin == true || auth.token.role == 'authenticator')"
            write: "false  # Cloud Functions only"
          "/otp_requests/{sessionId}":
            read: "auth != null && auth.token.admin == true"
            write: "false  # Cloud Functions only"
          "/stats":
            read: "auth != null"
            write: "false  # aggregateStats CF only"
          "/webhook_failures":
            read: "auth != null && auth.token.admin == true"
            write: "false  # sendWebhook CF only"
          "/bulk_progress/{campaignId}":
            read: "auth != null"
            write: "false  # Cloud Functions only (onDelete trigger + scheduled CF)"
          "/config":
            read: "auth != null"
            write: "auth != null && auth.token.admin == true"
        verification:
          - type: contains
            file: "functions/database.rules.json"
            patterns:
              - "bulk_progress"
              - "pending_sms"
              - "registered_apps"
              - "config"
        depends_on: [BS-RT-02, BS-RT-03]
        priority: critical
        security_notes:
          - "⚠️ EXISTING RULES GAP: The current database.rules.json only defines rules for /verification_requests and /health. All other nodes (/pending_sms, /otp_requests, /registered_apps, /stats, /webhook_failures) have NO rules. This task adds rules for ALL nodes including the new bulk paths."
          - "/pending_sms read access includes auth.token.role == 'authenticator' to allow the Android device (which authenticates with role: 'authenticator' custom claim) to read the queue."
          - "/bulk_progress writes come only from Cloud Functions (onDelete trigger + scheduled CFs)."
          - "/config/bulk_enabled writable only by admins — prevents accidental enablement."
          - "The Android device uses a Firebase custom token with role: 'authenticator' (set by registerAuthenticator CF), NOT email/password auth with admin claims."

      - id: BS-RT-05
        task: "Set /config/bulk_enabled = false in RTDB (manual)"
        commands:
          - "In Firebase Console → Realtime Database → click 'import JSON' or use the CLI:"
          - "firebase database:set /config/bulk_enabled false"
        verification:
          - type: manual_check
            description: "Verify /config/bulk_enabled exists and is false in Firebase Console"
        depends_on: [BS-RT-04]
        priority: critical
        notes: "Do NOT set to true until Android app with rate limiter is deployed and verified."

  # =========================================================================
  # PHASE 13 — Cloud Functions for Bulk SMS
  # =========================================================================
  - id: 13
    status: complete
    name: "Cloud Functions for Bulk SMS Processing"
    blocking: true
    description: >
      Create all server-side logic for bulk campaign lifecycle. Key design:
      the onDelete RTDB trigger on /pending_sms detects bulk completions (no
      Android changes needed for this). processBulkQueue drip-feeds jobs.
      Existing functions (sendOtp, approveCredit, aggregateStats) get minimal
      additive changes only.
    items:
      # --- Environment Config ---
      - id: BS-CF-ENV
        task: "Add bulk SMS environment variables to functions/.env.example"
        files_to_modify:
          - "functions/.env.example"
        required_vars:
          - "BULK_SMS_RATE_PER_MINUTE=30       # Max entries queued per campaign per minute"
          - "BULK_MAX_PENDING_QUEUE=100         # Max bulk jobs in /pending_sms globally"
          - "BULK_RETRY_BUDGET_PER_MINUTE=10    # Max retries re-queued per minute (separate budget)"
          - "BULK_SMS_PER_CAMPAIGN_LIMIT=10000  # Hard cap per single campaign"
          - "BULK_DAILY_APP_LIMIT=50000         # Max bulk SMS per app per UTC day"
          - "BULK_MAX_MESSAGE_CHARS_GSM=160     # Max SMS body for GSM 7-bit charset"
          - "BULK_MAX_MESSAGE_CHARS_UCS2=70     # Max SMS body for UCS-2 charset (emoji, Bengali)"
          - "BULK_RETRY_MAX_ATTEMPTS=3          # Max send attempts per recipient"
          - "BULK_STALE_ENTRY_TIMEOUT_MS=300000 # 5 min — entries with error older than this are retried"
        verification:
          - type: contains
            file: "functions/.env.example"
            patterns:
              - "BULK_SMS_RATE_PER_MINUTE"
              - "BULK_MAX_PENDING_QUEUE"
              - "BULK_RETRY_BUDGET_PER_MINUTE"
              - "BULK_SMS_PER_CAMPAIGN_LIMIT"
        depends_on: []
        priority: critical

      # --- Validation Helpers ---
      - id: BS-CF-UTILS
        task: "Create shared validation and parsing utilities for bulk campaigns"
        files_to_create:
          - "functions/src/bulk/bulkHelpers.js"
        behaviour:
          - "validateE164(phone): returns boolean — checks +{1-3 digit country code}{7-15 digits}. Regex: /^\\+[1-9]\\d{6,14}$/ ."
          - "validateBulkMessage(message): detect charset (GSM 7-bit or UCS-2), enforce corresponding length limit, return { valid, charset, maxChars, error? }."
          - "parseCSV(csvString): parse CSV with 'phone' column header, return array of strings. Skip empty rows. Trim whitespace. IMPLEMENT WITHOUT EXTERNAL DEPENDENCIES — use String.split() and manual parsing (the CSV format is simple: single column, no quoting needed)."
          - "deduplicatePhones(phoneArray): return { unique: string[], duplicates: Set, duplicateCount: number }."
          - "checkBulkCreditBalance(appId, db): read app_credits bulk_sms_remaining, return integer (0 if absent)."
          - "checkDailyAppQuota(appId, db, todayStart): sum totalRecipients from today's bulk_campaigns, return remaining."
          - "isGsm7Bit(text): check if text contains only GSM 03.38 basic charset characters. Return boolean."
          - "⚠️ FLAG: No new npm dependencies. The current functions/package.json only has firebase-admin and firebase-functions. Parse CSV manually — do not add papaparse or csv-parse."
        verification:
          - type: file_exists
            path: "functions/src/bulk/bulkHelpers.js"
          - type: contains
            file: "functions/src/bulk/bulkHelpers.js"
            patterns:
              - "validateE164"
              - "parseCSV"
              - "deduplicatePhones"
              - "isGsm7Bit"
              - "BULK_MAX_MESSAGE_CHARS"
        depends_on: [BS-CF-ENV]
        priority: critical

      # --- createBulkCampaign ---
      - id: BS-CF-01
        task: "Create `createBulkCampaign` Cloud Function — validates, reserves credits, creates campaign + recipients"
        files_to_create:
          - "functions/src/bulk/createBulkCampaign.js"
        behaviour:
          - "Authenticate via Firebase Auth ID token (admin claim OR app owner)."
          - "Accept: { appId, campaignName, message, phones: string[] }."
          - "GUARD: Read RTDB /config/bulk_enabled. If false, return 403 { error: 'bulk_not_enabled' }."
          - "Validate:"
          - "  campaignName: non-empty, max 100 chars."
          - "  message: non-empty, charset detection via isGsm7Bit, enforce GSM 160 / UCS-2 70 char limit."
          - "  phones: array of 1–BULK_SMS_PER_CAMPAIGN_LIMIT valid E.164 numbers."
          - "  Deduplicate phones. If duplicates found: include warning in response but proceed with unique set."
          - "Check daily quota: uniqueCount + today's totalSent <= BULK_DAILY_APP_LIMIT."
          - "Check bulk credits: Firestore transaction on app_credits/{appId} — verify bulk_sms_remaining >= uniqueCount and (bulk_expires_at is null or > now()). If insufficient: return 402 { error: 'insufficient_bulk_credits' }."
          - "Reserve credits: decrement bulk_sms_remaining by uniqueCount inside the same transaction."
          - "Create Firestore bulk_campaigns/{campaignId} document with all schema fields, status='queued', nextRecipientIndex=0."
          - "Create recipients sub-collection: batch write (500 docs/batch) to bulk_campaigns/{campaignId}/recipients — each doc { phone, index, status: 'pending', attempts: 0, lastAttemptAt: null, errorCode: null, errorMessage: null }."
          - "Create RTDB /bulk_progress/{campaignId}: { sentCount: 0, failedCount: 0, totalCount: uniqueCount, updatedAt: now(), status: 'queued' }."
          - "Write usage audit: batch write to app_credits/{appId}/bulk_usage — { deducted_at: now(), campaign_id, phone_hash: SHA-256(phone) }."
          - "Return: { campaignId, totalRecipients: uniqueCount, creditsReserved: uniqueCount, charset, status: 'queued' }."
        verification:
          - type: file_exists
            path: "functions/src/bulk/createBulkCampaign.js"
          - type: contains
            file: "functions/src/bulk/createBulkCampaign.js"
            patterns:
              - "bulk_campaigns"
              - "bulk_sms_remaining"
              - "runTransaction"
              - "bulk_enabled"
              - "insufficient_bulk_credits"
              - "recipients"
        depends_on: [BS-CF-UTILS, BS-FS-06, BS-RT-03, BS-RT-04]
        priority: critical
        security_notes:
          - "Credits reserved at creation. Cancelled campaigns get refunds."
          - "Phone numbers SHA-256 hashed in audit — no raw PII."
          - "Feature flag must be true — provides safe rollout control."

      # --- onSmsCompleted (onDelete trigger) ---
      - id: BS-CF-02
        task: "Create `onSmsCompleted` RTDB trigger — detects bulk SMS completion via /pending_sms deletion"
        files_to_create:
          - "functions/src/bulk/onSmsCompleted.js"
        behaviour:
          - "RTDB trigger: functions.database.ref('/pending_sms/{sessionId}').onDelete."
          - "Read the snapshot data (values just before deletion)."
          - "If batchId is null or absent: return immediately — this is an OTP job, do nothing."
          - "If batchId is present (bulk job):"
          - "  Check if the deleted snapshot had an error field:"
          - "    If snapshot.error exists and is non-null:"
          - "      This means the node was NOT deleted by the Android app (it writes error and keeps the node)."
          - "      This deletion was likely caused by processBulkQueue cleanup — skip counter update."
          - "    If snapshot.error is null/absent (clean deletion = successful send):"
          - "      Atomically increment /bulk_progress/{batchId}/sentCount by 1."
          - "      Update Firestore recipient doc (jobId): status='sent', attempts+1, lastAttemptAt=now()."
          - "      Update /bulk_progress/{batchId}/updatedAt = now()."
          - "Log completion for monitoring."
        verification:
          - type: file_exists
            path: "functions/src/bulk/onSmsCompleted.js"
          - type: contains
            file: "functions/src/bulk/onSmsCompleted.js"
            patterns:
              - "onDelete"
              - "batchId"
              - "sentCount.*increment\\|increment.*sentCount"
              - "return.*null\\|OTP.*skip"
        depends_on: [BS-RT-01, BS-RT-02]
        priority: critical
        notes: >
          This is the KEY design decision. The Android app does NOT know about bulk
          campaigns. It deletes /pending_sms on success (same as OTP). This trigger
          detects the deletion and, if batchId is present, updates bulk counters.
          For OTP (no batchId), it returns immediately — zero overhead.

      # --- processBulkQueue (Scheduled) ---
      - id: BS-CF-03
        task: "Create `processBulkQueue` scheduled CF — drip-feeds bulk jobs + handles stale retries"
        files_to_create:
          - "functions/src/bulk/processBulkQueue.js"
        schedule: "every 1 minutes"
        behaviour:
          # --- Phase 1: Handle stale/errored entries ---
          - "Read all /pending_sms entries where batchId != null (bulk entries only)."
          - "For each entry:"
          - "  If entry.error exists and entry.createdAt < now() - BULK_STALE_ENTRY_TIMEOUT_MS (stale failure):"
          - "    If entry.retryCount < BULK_RETRY_MAX_ATTEMPTS:"
          - "      Delete the stale entry."
          - "      Update Firestore recipient status to 'retrying'."
          - "      Recipient will be re-queued in Phase 2 (status='retrying' treated like 'pending')."
          - "    Else (max retries reached):"
          - "      Delete the stale entry."
          - "      Atomically increment /bulk_progress/{batchId}/failedCount by 1."
          - "      Update Firestore recipient: status='failed', errorCode, errorMessage, attempts=retryCount."
          - "      Continue to next entry."

          # --- Phase 2: Enqueue new jobs ---
          - "Count current bulk entries in /pending_sms (where batchId != null). If >= BULK_MAX_PENDING_QUEUE: skip enqueue phase this run."
          - "Query Firestore bulk_campaigns WHERE status IN ['queued', 'sending'] ORDER BY createdAt ASC."
          - "Calculate per-campaign budget: floor(BULK_SMS_RATE_PER_MINUTE / activeCampaignCount). Minimum 1."
          - "If this invocation handled retries in Phase 1: subtract retry_count from total budget. New campaigns get remaining budget."
          - "For each campaign (round-robin):"
          - "  If status == 'queued': update to 'sending', set startedAt = now(). Update RTDB /bulk_progress status to 'sending'."
          - "  Query recipients WHERE status IN ['pending', 'retrying'] ORDER BY index LIMIT perCampaignBudget."
          - "  For each recipient:"
          - "    Create /pending_sms entry: { to: phone, message: campaign.message, appId: campaign.appId, batchId: campaignId, jobId: recipient.docId, retryCount: recipient.attempts, createdAt: now() }."
          - "    Update Firestore recipient: status='queued'."
          - "  Update campaign: queuedCount += batch size, nextRecipientIndex updated."
          - "Log: total entries created, retries re-queued, campaigns processed."
        verification:
          - type: file_exists
            path: "functions/src/bulk/processBulkQueue.js"
          - type: contains
            file: "functions/src/bulk/processBulkQueue.js"
            patterns:
              - "BULK_SMS_RATE_PER_MINUTE\\|BULK_MAX_PENDING_QUEUE"
              - "batchId"
              - "pending_sms"
              - "retrying\\|stale\\|STALE_ENTRY_TIMEOUT"
              - "round.robin\\|activeCampaignCount\\|perCampaignBudget"
        depends_on: [BS-CF-01, BS-CF-02, BS-RT-01]
        priority: critical
        notes: >
          Phase 1 (retry handling) runs before Phase 2 (new enqueues). This ensures
          retries are accounted for before allocating budget to new entries.
          OTP entries (no batchId) are never touched by this function.

      # --- finalizeCompletedCampaigns (Scheduled) ---
      - id: BS-CF-04
        task: "Create `finalizeCompletedCampaigns` scheduled CF — detects completion, syncs, sends webhook"
        files_to_create:
          - "functions/src/bulk/finalizeCompletedCampaigns.js"
          - "functions/src/bulk/sendBulkWebhook.js"
        schedule: "every 1 minutes"
        behaviour:
          - "Query Firestore bulk_campaigns WHERE status == 'sending'."
          - "For each campaign:"
          - "  Read RTDB /bulk_progress/{campaignId} for live counters."
          - "  Read campaign.nextRecipientIndex and campaign.totalRecipients to check if fully queued."
          - "  Count recipients WHERE status IN ['pending', 'queued', 'retrying']. If 0 AND nextRecipientIndex >= totalRecipients: all recipients processed."
          - "  If all processed:"
          - "    Final counters: sentCount = RTDB sentCount, failedCount = RTDB failedCount."
          - "    Update Firestore campaign: { status: 'completed', sentCount, failedCount, completedAt: now() }."
          - "    Delete RTDB /bulk_progress/{campaignId}."
          - "    Send campaign completion webhook via sendBulkWebhook helper:"
          - "  Else:"
          - "    Sync counters to Firestore (non-final update): { sentCount, failedCount, queuedCount }."
          - "sendBulkWebhook(campaignId, appId, results) — NEW helper, separate from sendWebhook:"
          - "  Read /registered_apps/{appId} to get webhookUrl and webhookSecretHash."
          - "  Construct payload: { event: 'bulk_campaign.completed', campaignId, appId, sentCount, failedCount, totalRecipients, completedAt }."
          - "  Sign with HMAC-SHA256 using the app's webhook secret (from env var WEBHOOK_SECRET_{appId})."
          - "  POST to webhookUrl with retry logic (reuse attemptWebhookWithRetry pattern from webhook.js)."
          - "  Log failures to /webhook_failures/bulk_{campaignId}."
        verification:
          - type: file_exists
            path: "functions/src/bulk/finalizeCompletedCampaigns.js"
          - type: file_exists
            path: "functions/src/bulk/sendBulkWebhook.js"
          - type: contains
            file: "functions/src/bulk/finalizeCompletedCampaigns.js"
            patterns:
              - "bulk_progress"
              - "completed"
              - "sendBulkWebhook"
          - type: contains
            file: "functions/src/bulk/sendBulkWebhook.js"
            patterns:
              - "registered_apps"
              - "webhookUrl"
              - "HMAC\\|createHmac\\|X-Webhook-Signature"
        depends_on: [BS-CF-02, BS-CF-03]
        priority: critical
        notes: >
          WHY A SEPARATE sendBulkWebhook? The existing sendWebhook in webhook.js reads
          from /pending_sms/{sessionId} — but by the time a campaign completes, all
          /pending_sms entries are deleted. Bulk webhooks need to read webhook config
          from /registered_apps/{appId} instead. The signing and retry logic can be
          reused (import attemptWebhookWithRetry from webhook.js or reimplement inline).

