  - id: 4
    name: "Billing Integration — bKash (Manual Admin Verification)"
    blocking: false
    status: deprecated
    deprecation_note: >
      All BI-* items are superseded by Phases 6–9 which implement the same flow using
      Firestore instead of RTDB. The RTDB data model here (/topup_requests, /app_credits)
      conflicts with the Firestore collections defined in Phase 6. If you are building
      Phases 6–9, skip this entire phase. Do NOT implement both.
    description: >
      Simple bKash top-up flow with NO official API and NO automated SMS scraping.
      The merchant bKash personal/Send Money number is +8801613249520.
      Flow: user pays via bKash → submits TrxID in dashboard → admin checks their
      own bKash SMS/app history → admin manually confirms in the admin panel →
      OTP credits are added to the app's balance.
    payment_flow:
      - "1. App owner clicks 'Top Up Credits' in the admin dashboard."
      - "2. Dashboard shows the bKash personal number (+8801613249520) and exact BDT amount to send."
      - "3. App owner opens bKash app (or dials *247#) and sends money to +8801613249520."
      - "4. bKash sends a confirmation SMS to the app owner's phone containing a TrxID."
      - "5. App owner enters the TrxID and amount into the dashboard form and clicks 'Submit'."
      - "6. A top-up request is created in RTDB with status=pending."
      - "7. Admin receives a notification (or sees it on the Pending Payments list)."
      - "8. Admin checks their own bKash SMS / bKash app transaction history to verify the TrxID and amount."
      - "9. If verified, admin clicks 'Confirm' in the dashboard — OTP credits are added. Otherwise, admin clicks 'Reject'."
    security_notes:
      - "TrxID is user-submitted — trust is established by the admin manually cross-checking against real bKash history."
      - "Store bKash personal number in environment variable, never hardcoded in client code."
      - "TrxIDs are idempotency-keyed to prevent double-crediting the same transaction."
    items:
      - id: BI-01
        task: "Add bKash environment variables to .env.example and functions/.env.example"
        files_to_modify:
          - ".env.example"
          - "functions/.env.example"
        required_vars:
          - "BKASH_PERSONAL_NUMBER=   # Merchant Send Money number shown to payers (+8801613249520)"
          - "BKASH_MIN_TOPUP_AMOUNT=  # Minimum acceptable BDT amount per top-up"
        verification:
          - type: contains
            file: ".env.example"
            pattern: "BKASH_PERSONAL_NUMBER"
          - type: anti_pattern_check
            file: ".env.example"
            forbidden: "01613249520"
            description: "Real bKash number must not appear in the example file — use empty placeholder"
        depends_on: []
        priority: critical

      - id: BI-02
        task: "Add RTDB data model for top-up requests and app credit balances"
        files_to_modify:
          - "docs/DATA-MODEL.md"
        data_model:
          "/topup_requests/{requestId}":
            fields:
              appId: string
              amountBDT: number # BDT amount the app owner claims to have sent
              otpCreditsToAdd: number # Credits to grant on confirmation
              trxId: string # bKash TrxID submitted by app owner
              status: "pending|confirmed|rejected"
              createdAt: timestamp
              confirmedAt: timestamp|null
              adminUid: string|null # Firebase UID of admin who confirmed/rejected
              adminNote: string|null # Optional note from admin
          "/app_credits/{appId}":
            fields:
              balance: number # Remaining OTP credits
              lifetimeTopupBDT: number # Total BDT credited across all time
              lastTopupAt: timestamp
        verification:
          - type: file_exists
            path: "docs/DATA-MODEL.md"
          - type: contains
            file: "docs/DATA-MODEL.md"
            pattern: "topup_requests"
        depends_on: [BI-01]
        priority: critical

      - id: BI-03
        task: "Create Cloud Function `submitTopupRequest` — app owner submits payment claim"
        files_to_create:
          - "functions/src/billing/topupRequest.js"
        behaviour:
          - "Authenticated (admin dashboard Firebase ID token, admin claim required)."
          - "Accept: { appId, amountBDT, otpCreditsToAdd, trxId }."
          - "Validate: amountBDT >= BKASH_MIN_TOPUP_AMOUNT, trxId is non-empty string, trxId not already used in /topup_requests."
          - "Write to RTDB `/topup_requests/{requestId}` with status=pending and createdAt=now."
          - "Return: { requestId, message: 'Pending admin review.' }."
        verification:
          - type: file_exists
            path: "functions/src/billing/topupRequest.js"
          - type: contains
            file: "functions/src/billing/topupRequest.js"
            patterns:
              - "submitTopupRequest"
              - "/topup_requests"
              - "status.*pending"
        depends_on: [BI-02]
        priority: critical

      - id: BI-04
        task: "Create Cloud Function `resolveTopupRequest` — admin confirms or rejects"
        files_to_modify:
          - "functions/src/billing/topupRequest.js"
        behaviour:
          - "Authenticated (admin claim required)."
          - "Accept: { requestId, action: 'confirm'|'reject', adminNote? }."
          - "Read `/topup_requests/{requestId}` — reject if already resolved (idempotency)."
          - "If action=confirm: increment `/app_credits/{appId}/balance` by otpCreditsToAdd using RTDB transaction(); set status=confirmed."
          - "If action=reject: set status=rejected, no credit change."
          - "Write adminUid, confirmedAt, adminNote to the request record."
        verification:
          - type: contains
            file: "functions/src/billing/topupRequest.js"
            patterns:
              - "resolveTopupRequest"
              - "transaction()"
              - "confirmed\\|rejected"
              - "adminUid"
        depends_on: [BI-03]
        priority: critical
        notes: "Use RTDB transaction() for balance increment to prevent race conditions on concurrent confirmations."

      - id: BI-05
        task: "Build bKash top-up UI in admin dashboard (app owner side)"
        files_to_create:
          - "web/src/pages/Billing.jsx"
        ui_requirements:
          - "Form fields: Amount (BDT), OTP Credits to receive (auto-calculated or entered), TrxID."
          - "Above the form: display bKash personal number (returned from server, not hardcoded in JS) and instructions."
          - "On submit: call `submitTopupRequest` Cloud Function."
          - "On success: show 'Your top-up is pending admin approval. Credits will appear once confirmed.'"
          - "Table of past top-up requests with columns: Date, TrxID, Amount, Credits, Status (pending/confirmed/rejected)."
          - "Credit balance shown prominently (read from /app_credits/{appId}/balance)."
        verification:
          - type: contains
            file: "web/src/pages/Billing.jsx"
            patterns:
              - "submitTopupRequest"
              - "pending"
              - "trxId"
        depends_on: [BI-03, AD-02]
        priority: critical
        notes: "bKash number must come from Cloud Function response — never from import.meta.env or any client bundle."

      - id: BI-06
        task: "Build Pending Payments admin panel (admin side)"
        files_to_create:
          - "web/src/pages/PendingPayments.jsx"
        ui_requirements:
          - "Table of all top-up requests with status=pending, columns: App ID, TrxID, Amount (BDT), Credits, Submitted At."
          - "Each row has 'Confirm' (green) and 'Reject' (red) buttons."
          - "Clicking Confirm: prompts admin 'Have you verified TrxID {trxId} for Tk {amount} in your bKash history?' → on OK, calls `resolveTopupRequest` with action=confirm."
          - "Clicking Reject: optional note input → calls `resolveTopupRequest` with action=reject."
          - "After action: row disappears from pending list; show toast 'Credits added' or 'Request rejected'."
          - "Reminder text at top: 'Verify each TrxID against your bKash SMS or bKash app transaction history before confirming.'"
        verification:
          - type: contains
            file: "web/src/pages/PendingPayments.jsx"
            patterns:
              - "resolveTopupRequest"
              - "confirm\\|reject"
              - "pending"
        depends_on: [BI-04, AD-02]
        priority: critical

      - id: BI-07
        task: "Add credit balance guard in `sendOtp`"
        files_to_modify:
          - "functions/index.js"
        changes:
          - "After app validation, read `/app_credits/{appId}/balance`."
          - "If balance <= 0: return 402 { error: 'insufficient_credits', message: 'Top up OTP credits via the admin dashboard.' }."
          - "After successful OTP send, decrement balance by 1 using RTDB transaction()."
        verification:
          - type: contains
            file: "functions/index.js"
            pattern: "insufficient_credits\\|402"
        depends_on: [BI-04]
        priority: critical
        notes: "Use transaction() not set() to safely handle concurrent sendOtp calls."

      - id: BI-08
        task: "Create test plan for bKash manual billing"
        manual_test_steps:
          - step: "App owner fills top-up form with a valid TrxID and amount, submits"
            expected: "Request created in RTDB with status=pending. Success message shown."
          - step: "App owner submits the same TrxID again"
            expected: "Rejected — duplicate TrxID error returned."
          - step: "Admin sees pending request in PendingPayments page, clicks Confirm"
            expected: "resolveTopupRequest sets status=confirmed, balance incremented."
          - step: "Admin clicks Reject with a note"
            expected: "status=rejected, no balance change, note stored."
          - step: "Call sendOtp with zero-balance app"
            expected: "402 insufficient_credits returned."
          - step: "Call sendOtp after credit confirmed"
            expected: "OTP sent, balance decremented by 1."
        verification:
          - type: manual_check
            description: "All 6 steps pass."
        depends_on: [BI-07]
        priority: critical

