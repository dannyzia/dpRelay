  - id: 6
    name: "Billing Database & Firestore Setup"
    blocking: true
    description: >
      Enable Cloud Firestore in the project and define the three billing collections:
      packages (admin-seeded credit bundles), app_credits (per-app balance + expiry),
      and transactions (audit log for every credit purchase request).
      Write Firestore security rules to enforce Cloud-Functions-only writes on sensitive
      collections, and create the necessary composite indexes.
    items:
      - id: BILL-ENV
        task: "Verify billing environment variables in functions/.env.example (Phase 6 owns this — Phase 4 deprecated)"
        files_to_modify:
          - "functions/.env.example"
        required_vars:
          - "BKASH_PERSONAL_NUMBER=   # bKash Send Money number displayed to clients during credit purchase"
          - "BKASH_MIN_TOPUP_AMOUNT=  # Minimum BDT per top-up (e.g. 500)"
        verification:
          - type: contains
            file: "functions/.env.example"
            patterns:
              - "BKASH_PERSONAL_NUMBER"
              - "BKASH_MIN_TOPUP_AMOUNT"
          - type: anti_pattern_check
            file: "functions/.env.example"
            forbidden: "01613249520"
            description: "Real bKash number must use a placeholder in the example file"
        depends_on: [ENV-01]
        priority: critical
        notes: "ENV-01 (Phase 1) creates functions/.env.example. This task verifies the billing-specific vars are present. Phase 4 (BI-01) previously owned this — now Phase 6 owns it since Phase 4 is deprecated."

      - id: FS-01
        task: "Enable Firestore in the Firebase project and update firebase.js SDK init"
        files_to_modify:
          - "web/src/firebase.js"
          - "functions/index.js"
        changes:
          - "Add getFirestore() initialisation alongside the existing RTDB getDatabase() call."
          - "Export db (Firestore) from firebase.js alongside the RTDB ref."
        verification:
          - type: contains
            file: "web/src/firebase.js"
            pattern: "getFirestore"
        depends_on: []
        priority: critical

      - id: FS-02
        task: "Define `packages` Firestore collection schema and seed initial packages"
        files_to_create:
          - "functions/src/billing/seedPackages.js"
          - "docs/FIRESTORE-SCHEMA.md"
        schema:
          collection: "packages"
          fields:
            id: "auto (Firestore document ID)"
            name: "string  # e.g. 'Starter 500', 'Pro 2000'"
            sms_quota: "integer  # number of OTP sends included"
            price_bdt: "integer  # price in Bangladeshi Taka"
            validity_days: "integer  # how many days the credits last from purchase"
            is_active: "boolean  # soft-delete flag"
            created_at: "timestamp"
        seed_data:
          - name: "Starter"
            sms_quota: 500
            price_bdt: 500
            validity_days: 30
            is_active: true
          - name: "Pro"
            sms_quota: 2000
            price_bdt: 1800
            validity_days: 60
            is_active: true
          - name: "Enterprise"
            sms_quota: 10000
            price_bdt: 8000
            validity_days: 90
            is_active: true
        verification:
          - type: file_exists
            path: "functions/src/billing/seedPackages.js"
          - type: contains
            file: "functions/src/billing/seedPackages.js"
            pattern: "packages.*set\\|firestore.*packages"
        depends_on: [FS-01]
        priority: critical

      - id: FS-03
        task: "Define `app_credits` Firestore collection schema"
        files_to_modify:
          - "docs/FIRESTORE-SCHEMA.md"
        schema:
          collection: "app_credits"
          document_id: "{appId}  # same key as RTDB /registered_apps/{appId}"
          fields:
            appId: "string"
            sms_remaining: "integer  # credits left; decremented by sendOtp"
            expires_at: "timestamp  # when this credit bundle expires"
            last_package_id: "string  # Firestore packages/{id}"
            purchased_at: "timestamp"
            updated_at: "timestamp"
          sub_collections:
            "app_credits/{appId}/usage":
              fields:
                deducted_at: "timestamp"
                session_id: "string  # OTP sessionId that consumed the credit"
                phone_number_hash: "string  # SHA-256 of phone, for privacy"
        verification:
          - type: contains
            file: "docs/FIRESTORE-SCHEMA.md"
            pattern: "app_credits"
        depends_on: [FS-01]
        priority: critical
        architecture_notes:
          - "The Firestore document ID is the appId (string) generated by registerApp CF (CF-01), NOT the Firebase Auth UID."
          - "The Firestore security rule `request.auth.uid == resource.data.appId` therefore only works if the Firebase Auth UID happens to equal appId, which it does NOT."
          - "CORRECT security approach: approveCredit CF (Admin SDK) writes the document. Client reads must be gated differently."
          - "RECOMMENDED FIX for FS-05: store ownerUid in the app_credits document and use `request.auth.uid == resource.data.ownerUid` as the read rule."
          - "approveCredit CF should write ownerUid into app_credits when creating the document (read ownerUid from RTDB /registered_apps/{appId}/ownerUid)."
          - "Update FS-05 firestore.rules to use: `request.auth.uid == resource.data.ownerUid` not `resource.data.appId`."

      - id: FS-04
        task: "Define `transactions` Firestore collection schema"
        files_to_modify:
          - "docs/FIRESTORE-SCHEMA.md"
        schema:
          collection: "transactions"
          document_id: "{transactionId}  # UUID generated by requestCredit CF"
          fields:
            appId: "string"
            package_id: "string  # Firestore packages/{id}"
            sms_quota: "integer  # copied from package at time of request"
            validity_days: "integer  # copied from package at time of request"
            amount_bdt: "integer  # copied from package at time of request"
            trx_id: "string|null  # bKash TrxID submitted by client"
            status: "enum: pending | approved | rejected"
            requested_at: "timestamp"
            approved_at: "timestamp|null"
            admin_id: "string|null  # Firebase UID of approving admin"
            admin_notes: "string|null"
        verification:
          - type: contains
            file: "docs/FIRESTORE-SCHEMA.md"
            pattern: "transactions"
        depends_on: [FS-01]
        priority: critical

      - id: FS-05
        task: "Write Firestore security rules for billing collections"
        files_to_create:
          - "firestore.rules"
        rules:
          packages:
            read: "request.auth != null  # any authenticated user"
            write: "false  # Cloud Functions (Admin SDK) only"
          app_credits:
            read: "request.auth != null && (request.auth.token.admin == true || request.auth.uid == resource.data.ownerUid)"
            write: "false  # Cloud Functions (Admin SDK) only — never direct client write"
          "app_credits/{appId}/usage":
            read: "request.auth != null && request.auth.token.admin == true  # Admin-only reads"
            write: "false"
          transactions:
            read: >
              request.auth != null &&
              (request.auth.token.admin == true || request.auth.uid == resource.data.ownerUid)
            write: "false  # Cloud Functions only"
        verification:
          - type: file_exists
            path: "firestore.rules"
          - type: contains
            file: "firestore.rules"
            patterns:
              - "packages"
              - "app_credits"
              - "transactions"
              - "request.auth.token.admin"
        depends_on: [FS-02, FS-03, FS-04]
        priority: critical
        security_notes:
          - "All writes go through Cloud Functions using the Firebase Admin SDK, which bypasses security rules — but rules protect against direct client SDK manipulation."
          - "Never grant write access to app_credits directly from the client."

      - id: FS-06
        task: "Create Firestore composite indexes for billing queries"
        files_to_create:
          - "firestore.indexes.json"
        indexes:
          - collection: "transactions"
            fields: ["appId ASC", "requested_at DESC"]
            description: "Client portal: list own transactions sorted by date"
          - collection: "transactions"
            fields: ["status ASC", "requested_at ASC"]
            description: "Admin: list pending transactions in submission order"
          - collection: "packages"
            fields: ["is_active ASC", "price_bdt ASC"]
            description: "Client portal: show active packages sorted by price"
        verification:
          - type: file_exists
            path: "firestore.indexes.json"
          - type: contains
            file: "firestore.indexes.json"
            pattern: "transactions\\|packages"
        depends_on: [FS-04, FS-05]
        priority: high

  - id: 7
    name: "Credit Check & Deduction in Cloud Functions"
    blocking: true
    description: >
      Modify the existing `sendOtp` Cloud Function to gate OTP delivery on a valid,
      non-expired credit balance from Firestore `app_credits`. After a successful SMS
      queue, decrement `sms_remaining` inside a Firestore transaction and write a usage
      audit record. Add a new `getCredits` function for clients to check their balance.
    items:
      - id: CR-01
        task: "Modify `sendOtp` to read and validate app_credits before generating OTP"
        files_to_modify:
          - "functions/index.js"
        changes:
          - "After app validation (appId + appSecret check), read Firestore `app_credits/{appId}`."
          - "If document does not exist: return 402 { error: 'no_credits', message: 'No credit package purchased. Visit the dashboard to buy credits.' }."
          - "If sms_remaining <= 0: return 402 { error: 'no_credits', message: 'Out of SMS credits. Please top up.' }."
          - "If expires_at < Date.now(): return 402 { error: 'credits_expired', message: 'Credit package expired. Please purchase a new one.' }."
          - "Only proceed to OTP generation and SMS queue if all checks pass."
        verification:
          - type: contains
            file: "functions/index.js"
            patterns:
              - "app_credits"
              - "sms_remaining"
              - "credits_expired"
              - "no_credits"
              - "expires_at"
        depends_on: [FS-03, WH-01]
        priority: critical
        notes: >
          This modifies sendOtp in functions/index.js, which was already modified by WH-01
          (webhook copy). Merge both changes carefully into one function body.
          This Firestore-based guard supersedes the RTDB-based guard in BI-07 — do not implement both.

      - id: CR-02
        task: "Add Firestore transaction to decrement `sms_remaining` after successful OTP queue"
        files_to_modify:
          - "functions/index.js"
        changes:
          - "After confirming SMS is queued to /pending_sms (RTDB), run a Firestore transaction on app_credits/{appId}."
          - "Inside the transaction: read sms_remaining, verify still > 0 (double-check), write sms_remaining - 1 and updated_at = now()."
          - "If the transaction fails (concurrent call raced to 0): return 402 no_credits."
          - "Use runTransaction() — never use update() for this decrement."
        verification:
          - type: contains
            file: "functions/index.js"
            patterns:
              - "runTransaction"
              - "sms_remaining.*-.*1\\|sms_remaining - 1"
        depends_on: [CR-01]
        priority: critical
        notes: "runTransaction provides optimistic locking — safe for concurrent sendOtp calls from the same app."

      - id: CR-03
        task: "Write usage audit record to `app_credits/{appId}/usage` sub-collection after deduction"
        files_to_modify:
          - "functions/index.js"
        changes:
          - "After successful Firestore transaction in CR-02, write a document to app_credits/{appId}/usage."
          - "Fields: deducted_at (now()), session_id (the OTP sessionId), phone_number_hash (SHA-256 of the target phone number — never store raw phone here)."
          - "This write is outside the transaction (eventual consistency is acceptable for audit logs)."
        verification:
          - type: contains
            file: "functions/index.js"
            patterns:
              - "app_credits.*usage\\|usage.*collection"
              - "createHash.*sha256\\|phone_number_hash"
        depends_on: [CR-02]
        priority: critical
        security_notes:
          - "Hash the phone number (SHA-256) — do not store PII in the audit log."

      - id: CR-04
        task: "Create `getCredits` Cloud Function (HTTPS GET) — client balance check"
        files_to_create:
          - "functions/src/billing/getCredits.js"
        behaviour:
          - "Authenticate via appId + appSecret (same validation as sendOtp)."
          - "Read Firestore app_credits/{appId}."
          - "Return: { sms_remaining, expires_at, last_package_id, purchased_at } or { sms_remaining: 0, expires_at: null } if no document."
        verification:
          - type: file_exists
            path: "functions/src/billing/getCredits.js"
          - type: contains
            file: "functions/src/billing/getCredits.js"
            patterns:
              - "app_credits"
              - "sms_remaining"
              - "expires_at"
        depends_on: [FS-03]
        priority: high

      - id: CR-05
        task: "Write tests for credit check and deduction"
        files_to_create:
          - "functions/test/creditCheck.test.js"
        test_cases:
          - "sendOtp with no app_credits document: expect 402 no_credits."
          - "sendOtp with sms_remaining = 0: expect 402 no_credits."
          - "sendOtp with expires_at in the past: expect 402 credits_expired."
          - "sendOtp with valid credits: expect OTP queued and sms_remaining decremented."
          - "Concurrent sendOtp calls that drain last credit: only one succeeds, other gets 402."
          - "getCredits with valid app: returns correct balance."
        verification:
          - type: command
            run: "cd functions && npm test -- creditCheck.test.js"
            expect_exit: 0
        depends_on: [CR-01, CR-02, CR-03, CR-04]
        priority: critical

  - id: 8
    name: "Manual bKash Credit Request & Admin Approval (Cloud Functions)"
    blocking: false
    description: >
      Add four new Cloud Functions: `upsertPackage` (admin creates/edits packages — BK-00),
      `requestCredit` (client initiates purchase, gets bKash payment instructions — BK-01),
      `submitTrxId` (client attaches bKash TrxID to pending transaction — BK-02),
      and `approveCredit` (admin approves or rejects, credits added via Firestore transaction — BK-03).
      All writes use the Firebase Admin SDK. Idempotency enforced on approveCredit.
    items:
      - id: BK-00
        task: "Create `upsertPackage` Cloud Function — admin creates or updates a credit package"
        files_to_create:
          - "functions/src/billing/upsertPackage.js"
        behaviour:
          - "Authenticate via Firebase Auth ID token (must have admin custom claim)."
          - "Accept: { packageId?: string, name, sms_quota, price_bdt, validity_days, is_active }."
          - "If packageId provided and document exists: update the document (partial merge)."
          - "If no packageId: create a new document with auto-generated ID and set created_at=now()."
          - "Return: { packageId, success: true }."
          - "Validate inputs: sms_quota > 0, price_bdt > 0, validity_days > 0, name is non-empty string."
        verification:
          - type: file_exists
            path: "functions/src/billing/upsertPackage.js"
          - type: contains
            file: "functions/src/billing/upsertPackage.js"
            patterns:
              - "admin.*claim\\|request.auth.token.admin"
              - "packages"
              - "sms_quota"
              - "is_active"
        depends_on: [FS-02, FS-05]
        priority: critical
        notes: >
          Required because Firestore security rules set write=false on the packages collection
          for all clients. The Admin SDK (used in Cloud Functions) bypasses rules — this is
          the only safe write path. RM-01 (Package Manager UI) calls this function.

      - id: BK-01
        task: "Create `requestCredit` Cloud Function — client initiates credit purchase"
        files_to_create:
          - "functions/src/billing/requestCredit.js"
        behaviour:
          - "Authenticate via appId + appSecret."
          - "Accept: { appId, appSecret, packageId }."
          - "Read Firestore packages/{packageId}; if not found or is_active=false: return 404."
          - "Generate transactionId (UUID v4)."
          - "Write to Firestore transactions/{transactionId}: { appId, package_id, sms_quota, validity_days, amount_bdt, trx_id: null, status: 'pending', requested_at: now() }."
          - "Return: { transactionId, paymentInstructions: { bkashNumber: process.env.BKASH_PERSONAL_NUMBER, amount: package.price_bdt, reference: transactionId, note: 'Send exact amount. Use transactionId as reference.' } }."
        verification:
          - type: file_exists
            path: "functions/src/billing/requestCredit.js"
          - type: contains
            file: "functions/src/billing/requestCredit.js"
            patterns:
              - "transactions"
              - "status.*pending"
              - "BKASH_PERSONAL_NUMBER"
              - "uuid\\|randomUUID"
        depends_on: [FS-02, FS-04]
        priority: critical
        notes: "Snapshot the package fields (sms_quota, validity_days, price_bdt) into the transaction document at creation time — so package edits don't retroactively change pending transactions."

      - id: BK-02
        task: "Create `submitTrxId` Cloud Function — client attaches bKash TrxID to pending transaction"
        files_to_create:
          - "functions/src/billing/submitTrxId.js"
        behaviour:
          - "Authenticate via appId + appSecret."
          - "Accept: { appId, appSecret, transactionId, trxId }."
          - "Read Firestore transactions/{transactionId}; verify appId matches and status == 'pending'."
          - "Check no other transaction document has the same trxId (duplicate TrxID guard)."
          - "Update transaction: { trx_id: trxId, updated_at: now() } — status stays 'pending'."
          - "Return: { message: 'TrxID submitted. Awaiting admin approval.' }."
        verification:
          - type: file_exists
            path: "functions/src/billing/submitTrxId.js"
          - type: contains
            file: "functions/src/billing/submitTrxId.js"
            patterns:
              - "trxId\\|trx_id"
              - "status.*pending"
              - "duplicate\\|already.*used"
        depends_on: [BK-01]
        priority: critical
        security_notes:
          - "Query Firestore for existing trxId before writing to prevent double-crediting via TrxID reuse."

      - id: BK-03
        task: "Create `approveCredit` Cloud Function — admin approves or rejects transaction"
        files_to_create:
          - "functions/src/billing/approveCredit.js"
        behaviour:
          - "Authenticate via Firebase Auth ID token (must have admin custom claim)."
          - "Accept: { transactionId, approve: boolean, rejectReason?: string }."
          - "Read Firestore transactions/{transactionId}."
          - "IDEMPOTENCY: if status != 'pending', return 409 { error: 'already_resolved', status: current_status }."
          - "If approve=true:"
          - "  Run Firestore transaction on app_credits/{appId}:"
          - "    Read current doc (create if not exists with sms_remaining=0, expires_at=null)."
          - "    new_sms_remaining = current.sms_remaining + transaction.sms_quota."
          - "    new_expires_at = max(current.expires_at ?? 0, Date.now() + transaction.validity_days * 86400000)."
          - "    Write: { sms_remaining: new_sms_remaining, expires_at: new_expires_at, last_package_id, purchased_at: now(), updated_at: now() }."
          - "  Outside transaction: update transactions/{transactionId}: { status: 'approved', approved_at: now(), admin_id: caller.uid }."
          - "If approve=false: update status='rejected', admin_notes=rejectReason, admin_id=caller.uid."
          - "Return: { success: true, new_balance: new_sms_remaining } on approve; { success: true } on reject."
        verification:
          - type: file_exists
            path: "functions/src/billing/approveCredit.js"
          - type: contains
            file: "functions/src/billing/approveCredit.js"
            patterns:
              - "already_resolved\\|status.*pending"
              - "runTransaction"
              - "sms_remaining.*sms_quota\\|sms_quota.*sms_remaining"
              - "admin_id"
              - "approved_at"
        depends_on: [BK-01, FS-03, FS-04]
        priority: critical
        security_notes:
          - "The 409 idempotency check (status != pending) prevents double-crediting even if the admin clicks Approve twice."
          - "The Firestore transaction ensures the balance increment is atomic."

      - id: BK-04
        task: "Write tests for the bKash credit request and approval flow"
        files_to_create:
          - "functions/test/approveCredit.test.js"
        test_cases:
          - "requestCredit with valid package: returns transactionId and bKash instructions."
          - "requestCredit with inactive package: returns 404."
          - "submitTrxId with valid pending transaction: updates trx_id field."
          - "submitTrxId with duplicate TrxID (used in another transaction): rejected."
          - "approveCredit on pending transaction: app_credits balance incremented, status=approved."
          - "approveCredit called twice on same transaction: second call returns 409 already_resolved."
          - "approveCredit with reject=true: status=rejected, balance unchanged."
          - "approveCredit by non-admin caller: rejected with 403."
        verification:
          - type: command
            run: "cd functions && npm test -- approveCredit.test.js"
            expect_exit: 0
        depends_on: [BK-01, BK-02, BK-03]
        priority: critical

      - id: BK-05
        task: "Write tests for `upsertPackage` Cloud Function"
        files_to_create:
          - "functions/test/upsertPackage.test.js"
        test_cases:
          - "Admin creates new package: Firestore document created with auto-ID, all fields set."
          - "Admin updates existing package (packageId provided): only changed fields updated."
          - "Admin deactivates package (is_active=false): package no longer returned in active-packages query."
          - "Non-admin caller: rejected with 403."
          - "Invalid inputs (sms_quota=0, price_bdt=-1): rejected with 400."
          - "Name is empty string: rejected with 400."
        verification:
          - type: command
            run: "cd functions && npm test -- upsertPackage.test.js"
            expect_exit: 0
        depends_on: [BK-00]
        priority: critical

      - id: TEST-E2E
        task: "End-to-end integration test — full billing cycle (register → buy credits → send OTP)"
        files_to_create:
          - "functions/test/e2e-billing.test.js"
        test_steps:
          - "1. Admin seeds a test package via upsertPackage."
          - "2. Client calls registerApp — receives appId + appSecret."
          - "3. Client calls sendOtp — expect 402 no_credits (no credits yet)."
          - "4. Client calls requestCredit with valid packageId — receives transactionId + bKash instructions."
          - "5. Client calls submitTrxId with a fake TrxID — transaction updated."
          - "6. Admin calls approveCredit — app_credits balance set to package.sms_quota."
          - "7. Client calls sendOtp — expect success, OTP queued, sms_remaining decremented by 1."
          - "8. Client calls getCredits — balance = sms_quota - 1."
          - "9. Admin calls approveCredit again on same transactionId — expect 409 already_resolved."
          - "10. Client calls sendOtp until sms_remaining = 0, then one more — expect 402 no_credits."
        verification:
          - type: command
            run: "cd functions && firebase emulators:exec --only auth,functions,firestore,database 'npm test -- e2e-billing.test.js'"
            expect_exit: 0
        depends_on: [CR-05, BK-04, BK-05]
        priority: critical
        notes: "Run against the Firebase Emulator (INFRA-03). Never run e2e tests against production."

  - id: 9
    name: "React Dashboard — Package Management & Transaction Approval (UI)"
    blocking: false
    description: >
      Extend the existing React PWA with four new pages covering the full billing workflow:
      admin package CRUD, admin transaction approval queue, client buy-credits flow,
      and client credits & usage overview. All pages use Firestore client SDK under
      authenticated Firebase Auth sessions.
    items:
