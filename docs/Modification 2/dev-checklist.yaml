# Development Checklist - Authenticator Service (Consolidated React Platform + Webhooks + Client SDKs + bKash Billing + Marketing)
# Format: YAML 1.2
# AI Instructions:
# - Parse this file at the start of implementation sessions.
# - Use it as the checklist source of truth for task sequencing.
# - Track completion state in your agent or session tooling.

version: "2.0"
# Frontend React PWA is already built and located in the web/ directory. All frontend tasks below are marked complete.
project: AuthenticatorService
total_phases: 10
critical_path:
  - phase: 1
    name: Consolidated React Platform (PWA)
    must_complete_before: [2, 3, 4, 5, 6, 7, 8, 9]
    reason: "All other phases depend on the shared React app shell, Firebase Auth, and app-registry Cloud Functions built here"
  - phase: 2
    name: Webhook Delivery
    must_complete_before: []
    reason: "Independent of billing, but depends on app registry from Phase 1"
  - phase: 3
    name: Client Integration Guides
    must_complete_before: []
    reason: "Documentation can be written in parallel with Phases 2 and 4"
  - phase: 4
    name: Billing Integration (bKash — Manual Admin Verification)
    must_complete_before: []
    reason: "Superseded by Phases 6–9 which deliver a Firestore-backed, fully structured billing system. Phase 4 items (BI-*) are deprecated and should NOT be implemented if Phases 6–9 are being built."
  - phase: 5
    name: Marketing Site
    must_complete_before: []
    reason: "Public pages can be built last; depends on Phase 1 shell and Phase 3 docs being complete"
  - phase: 6
    name: Billing Database & Firestore Setup
    must_complete_before: [7, 8, 9]
    reason: "Firestore schema for packages/app_credits/transactions must exist before Cloud Functions or UI can reference it"
  - phase: 7
    name: Credit Check & Deduction in Cloud Functions
    must_complete_before: [8, 9]
    reason: "sendOtp credit gate (CR-01–03) and getCredits (CR-04) must be in place before the credit request flow (Phase 8) and UI (Phase 9) can be built on top of them"
  - phase: 8
    name: Manual bKash Credit Request & Admin Approval (Cloud Functions)
    must_complete_before: [9]
    reason: "Cloud Functions must exist before the React dashboard UI in Phase 9 can call them"
  - phase: 9
    name: React Dashboard — Package Management & Transaction Approval
    must_complete_before: []
    reason: "UI layer; depends on Phases 6, 7, and 8 being complete"

phases:
  - id: 1
    name: "Consolidated React Platform (PWA) — Firebase Hosting"
    blocking: true
    description: >
      Build a single Progressive Web App (PWA) deployed on Firebase Hosting that serves
      four audiences in one codebase: the super-admin (app management, billing approval),
      client/developer portal (API keys, metrics, credit purchase), API playground
      (interactive sendOtp / verifyOtp console), and public marketing pages.
      All authenticated sections are protected by Firebase Auth with custom claims.
    platform_sections:
      - "Admin Dashboard: app management, usage metrics, pending bKash payment approval"
      - "Client Portal: per-app metrics, API key display/regeneration, credit balance, buy-credits flow"
      - "API Playground: interactive console — enter appId + appSecret, test sendOtp/verifyOtp, see raw JSON"
      - "Marketing / Landing: public Home, Pricing, Documentation, code-snippet guides"
    items:
      - id: INFRA-01
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Initialize Firebase project and enable all required services"
        commands:
          - "firebase login"
          - "firebase projects:create <project-id> --display-name 'Authenticator Service'"
          - "firebase use <project-id>"
          - "firebase init  # select: Firestore, Functions, Hosting, RTDB, Emulators"
        services_to_enable:
          - "Authentication (Email/Password provider)"
          - "Realtime Database (production mode)"
          - "Cloud Firestore (production mode, nam5 multi-region)"
          - "Cloud Functions (Node 18)"
          - "Firebase Hosting"
        verification:
          - type: file_exists
            path: ".firebaserc"
          - type: contains
            file: ".firebaserc"
            pattern: "projects.*default"
        depends_on: []
        priority: critical
        notes: "Must run before any other task. Record the project ID in .env.example as FIREBASE_PROJECT_ID."

      - id: INFRA-02
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Create firebase.json with hosting, functions, emulator, and rules deploy config"
        files_to_create:
          - "firebase.json"
          - ".firebaserc"
        config_requirements:
          hosting:
            public: "web/dist"
            rewrites: "all traffic → /index.html (SPA mode)"
            headers: "Cache-Control for static assets"
          functions:
            source: "functions"
            runtime: "nodejs20"
          emulators:
            - auth (port 9099)
            - functions (port 5001)
            - firestore (port 8080)
            - database (port 9000)
            - hosting (port 5000)
          rules:
            firestore: "firestore.rules"
            database: "database.rules.json"
        verification:
          - type: file_exists
            path: "firebase.json"
          - type: contains
            file: "firebase.json"
            patterns:
              - "rewrites"
              - "emulators"
              - "firestore"
        depends_on: [INFRA-01]
        priority: critical

      - id: INFRA-03
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Set up Firebase Emulator Suite for local development"
        files_to_create:
          - ".env.local"
          - "functions/.env.local"
        commands:
          - "firebase emulators:start"
        setup_requirements:
          - "Add FIREBASE_EMULATOR=true check in firebase.js to connect to emulator when running locally."
          - "In web/src/firebase.js: if (import.meta.env.VITE_USE_EMULATOR) { connectAuthEmulator(...); connectDatabaseEmulator(...); connectFirestoreEmulator(...); }"
          - "In functions/index.js: emulator is auto-detected via FIREBASE_EMULATOR env variable."
        verification:
          - type: command
            run: "firebase emulators:exec --only auth,functions,firestore,database 'echo ok'"
            expect_exit: 0
        depends_on: [INFRA-02]
        priority: critical
        notes: "All development and testing must use the emulator. Never test against production Firebase with test data."

      - id: ENV-01
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Define all environment variables in .env.example files"
        files_to_create:
          - "web/.env.example"
          - "functions/.env.example"
        react_env_vars:
          - "VITE_FIREBASE_API_KEY=          # Firebase project API key"
          - "VITE_FIREBASE_AUTH_DOMAIN=      # project.firebaseapp.com"
          - "VITE_FIREBASE_DATABASE_URL=     # RTDB URL"
          - "VITE_FIREBASE_PROJECT_ID=       # Firebase project ID"
          - "VITE_FIREBASE_STORAGE_BUCKET=   # project.appspot.com"
          - "VITE_FIREBASE_MESSAGING_SENDER_ID="
          - "VITE_FIREBASE_APP_ID="
          - "VITE_USE_EMULATOR=false         # Set true for local dev"
          - "FIREBASE_HOSTING_URL=           # https://your-app.web.app (for AD-08 health check)"
          - "FIREBASE_HOSTING_TARGET=        # firebase hosting target alias"
        functions_env_vars:
          - "APP_MASTER_SECRET=              # Protects setAdminClaim CF. Generate with: openssl rand -hex 32"
          - "BKASH_PERSONAL_NUMBER=          # bKash Send Money number for credit top-ups"
          - "BKASH_MIN_TOPUP_AMOUNT=500      # Minimum acceptable BDT per top-up"
        verification:
          - type: file_exists
            paths:
              - "web/.env.example"
              - "functions/.env.example"
          - type: anti_pattern_check
            file: "web/.env.example"
            forbidden: "=[a-zA-Z0-9+/]{20,}"
            description: "Example files must not contain real secret values"
          - type: anti_pattern_check
            file: "functions/.env.example"
            forbidden: "01613249520"
            description: "Real bKash number must not appear in example files"
        depends_on: [INFRA-01]
        priority: critical
        notes: "Every developer must copy both .env.example files to .env.local before starting. Document this in README.md."

      - id: RTDB-01
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Write Firebase RTDB security rules"
        files_to_create:
          - "database.rules.json"
        rules:
          "/registered_apps/{appId}":
            read: "auth != null && (auth.token.admin == true || auth.uid == data.child('ownerUid').val())"
            write: "auth != null && auth.token.admin == true  # Cloud Functions write via Admin SDK"
          "/pending_sms/{sessionId}":
            read: "auth != null && auth.token.admin == true"
            write: "false  # Cloud Functions only"
          "/otp_requests/{sessionId}":
            read: "auth != null && auth.token.admin == true"
            write: "false  # Cloud Functions only"
          "/stats":
            read: "auth != null"
            write: "false  # aggregateStats CF only"
          "/webhook_failures":
            read: "auth != null && auth.token.admin == true"
            write: "false  # sendWebhook CF only"
        verification:
          - type: file_exists
            path: "database.rules.json"
          - type: contains
            file: "database.rules.json"
            patterns:
              - "ownerUid"
              - "auth.token.admin"
              - "registered_apps"
        depends_on: [CF-01]
        priority: critical
        security_notes:
          - "Client SDK reads of /registered_apps/{appId} are scoped to ownerUid — clients cannot see other apps."
          - "All write paths go through Cloud Functions (Admin SDK bypasses rules) — rules serve as a defence-in-depth layer."

      - id: ROUTE-01
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Set up React Router v6 with all application routes"
        files_to_create:
          - "web/src/router.jsx"
        routes:
          public:
            - "/ → Home.jsx"
            - "/pricing → Pricing.jsx"
            - "/docs → Docs.jsx"
            - "/login → Login.jsx"
          client_protected:
            - "/portal → ClientPortal.jsx (ClientRoute guard)"
            - "/portal/apps → MyApps.jsx"
            - "/portal/apps/:appId → AppDetail.jsx"
            - "/portal/credits → CreditsOverview.jsx"
            - "/portal/buy-credits → BuyCredits.jsx"
            - "/playground → Playground.jsx"
          admin_protected:
            - "/admin → Dashboard.jsx (AdminRoute guard)"
            - "/admin/apps → AppsList.jsx"
            - "/admin/packages → PackageManager.jsx"
            - "/admin/transactions → TransactionQueue.jsx"
        verification:
          - type: file_exists
            path: "web/src/router.jsx"
          - type: contains
            file: "web/src/router.jsx"
            patterns:
              - "createBrowserRouter\\|BrowserRouter"
              - "AdminRoute\\|ClientRoute"
              - "/admin"
              - "/portal"
        depends_on: [AD-02]
        priority: critical

      - id: ROUTE-02
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Build shared NavBar / Sidebar component (role-aware)"
        files_to_create:
          - "web/src/components/NavBar.jsx"
          - "web/src/components/Sidebar.jsx"
        ui_requirements:
          - "Unauthenticated: show public links only (Home, Pricing, Docs, Login)."
          - "Client authenticated: show portal links (My Apps, Credits, Buy Credits, Playground, Logout)."
          - "Admin authenticated: show all client links PLUS admin links (All Apps, Packages, Transactions)."
          - "Active route highlighted. Responsive: collapses to hamburger on mobile."
          - "Role detection via Firebase Auth custom claims (getIdTokenResult().claims)."
        verification:
          - type: contains
            file: "web/src/components/NavBar.jsx"
            patterns:
              - "admin.*claim\\|isAdmin"
              - "Logout\\|signOut"
        depends_on: [AD-02, ROUTE-01]
        priority: critical

      - id: AD-01
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Initialize React project with Vite + Firebase SDK"
        files_to_create:
          - "web/package.json"
          - "web/vite.config.js"
          - "web/index.html"
          - "web/src/main.jsx"
          - "web/src/App.jsx"
          - "web/src/firebase.js"
          - "web/.env.example"
        verification:
          - type: file_exists
            paths:
              - "web/package.json"
              - "web/src/firebase.js"
          - type: contains
            file: "web/src/firebase.js"
            pattern: "initializeApp"
          - type: anti_pattern_check
            file: "web/.env.example"
            forbidden: "API_KEY.*="
            description: "Env example must not contain real keys"
        depends_on: []
        priority: critical
        notes: "Use Firebase JS SDK (not admin SDK) — authentication via Firebase Auth with custom claims."

      - id: AD-02
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Implement Firebase Authentication with email/password + custom admin claim"
        files_to_create:
          - "web/src/context/AuthContext.jsx"
          - "web/src/pages/Login.jsx"
          - "web/src/components/ProtectedRoute.jsx"
          - "web/src/components/AdminRoute.jsx"
          - "web/src/components/ClientRoute.jsx"
        verification:
          - type: contains
            file: "web/src/context/AuthContext.jsx"
            pattern: "signInWithEmailAndPassword"
          - type: contains
            file: "web/src/components/ProtectedRoute.jsx"
            pattern: "customClaim.*admin\\|hasAdminClaim"
        depends_on: [AD-01]
        priority: critical
        notes: "Requires a Cloud Function to set admin claims when first admin is created."

      - id: AD-03
        task: "Create Cloud Function `setAdminClaim` (HTTP) to assign admin role to a Firebase user"
        files_to_modify:
          - "functions/index.js"
        verification:
          - type: contains
            file: "functions/index.js"
            patterns:
              - "setAdminClaim"
              - "setCustomUserClaims"
        depends_on: []
        priority: high
        notes: "This function must be protected by a master secret (APP_MASTER_SECRET). Called once during initial setup."

      - id: CF-01
        task: "Create `registerApp` Cloud Function (HTTP POST) — new app registration"
        files_to_create:
          - "functions/src/apps/registerApp.js"
        behaviour:
          - "Accept: { appName, webhookUrl?, webhookSecret?, rateLimit? }."
          - "Authenticate via Firebase Auth ID token (client claim or admin). The caller's Firebase UID becomes the app owner."
          - "Generate appId (UUID v4) and appSecret (crypto.randomBytes(32).toString('hex'))."
          - "Hash appSecret with SHA-256 — store only the hash in RTDB."
          - "Write to RTDB `/registered_apps/{appId}`: { appName, ownerUid, appSecretHash, webhookUrl, webhookSecretHash, rateLimit, active: true, createdAt }."
          - "Return: { appId, appSecret } — plaintext secret returned ONCE only. Warn caller to save it."
        verification:
          - type: file_exists
            path: "functions/src/apps/registerApp.js"
          - type: contains
            file: "functions/src/apps/registerApp.js"
            patterns:
              - "randomBytes\\|crypto"
              - "appSecretHash"
              - "/registered_apps"
              - "ownerUid"
        depends_on: [AD-03]
        priority: critical
        security_notes:
          - "Never store plaintext appSecret — only SHA-256 hash."
          - "The returned appSecret must be shown to the user once and then discarded from server memory."

      - id: CF-02
        task: "Create `revokeApp` Cloud Function (HTTP POST) — deactivate a registered app"
        files_to_create:
          - "functions/src/apps/revokeApp.js"
        behaviour:
          - "Authenticate via Firebase Auth ID token (admin claim required OR ownerUid matches caller)."
          - "Accept: { appId }."
          - "Read RTDB `/registered_apps/{appId}`; verify caller is admin or owns the app."
          - "Set `active: false` and `revokedAt: now()` on the RTDB record."
          - "Return: { success: true, message: 'App revoked. All future OTP requests will be rejected.' }."
          - "sendOtp must already check `active` flag — this ensures OTPs stop immediately."
        verification:
          - type: file_exists
            path: "functions/src/apps/revokeApp.js"
          - type: contains
            file: "functions/src/apps/revokeApp.js"
            patterns:
              - "active.*false\\|revokedAt"
              - "/registered_apps"
              - "ownerUid\\|admin"
        depends_on: [CF-01]
        priority: critical

      - id: CF-03
        task: "Create `updateAppWebhook` Cloud Function (HTTP POST) — update webhook URL and secret"
        files_to_create:
          - "functions/src/apps/updateAppWebhook.js"
        behaviour:
          - "Authenticate via Firebase Auth ID token (admin or app owner)."
          - "Accept: { appId, webhookUrl, regenerateSecret?: boolean }."
          - "Verify caller owns appId (ownerUid match) or has admin claim."
          - "Update RTDB `/registered_apps/{appId}/webhookUrl`."
          - "If regenerateSecret=true: generate new webhookSecret (crypto.randomBytes(32)), hash it, update `webhookSecretHash`, return plaintext once."
          - "Return: { success: true, webhookSecret?: '<new-plaintext-if-regenerated>' }."
        verification:
          - type: file_exists
            path: "functions/src/apps/updateAppWebhook.js"
          - type: contains
            file: "functions/src/apps/updateAppWebhook.js"
            patterns:
              - "webhookUrl"
              - "webhookSecretHash"
              - "/registered_apps"
        depends_on: [CF-01]
        priority: high
        notes: "AD-07 webhook configuration UI calls this function."

      - id: CF-04
        task: "Create `aggregateStats` scheduled Cloud Function — write /stats node for dashboard"
        files_to_create:
          - "functions/src/jobs/aggregateStats.js"
        schedule: "every 1 minutes"
        behaviour:
          - "Read from RTDB `/otp_requests` (last 24h window)."
          - "Compute: total_today, success_count, failed_count, pending_count, success_rate."
          - "Read `/pending_sms` to get queue_depth."
          - "Write computed values to RTDB `/stats`: { total_today, success_count, failed_count, success_rate, queue_depth, updated_at }."
          - "Keep a rolling 7-day history at `/stats/history/{YYYY-MM-DD}` for the Recharts trend chart in AD-06."
        verification:
          - type: file_exists
            path: "functions/src/jobs/aggregateStats.js"
          - type: contains
            file: "functions/src/jobs/aggregateStats.js"
            patterns:
              - "/stats"
              - "schedule\\|pubsub"
              - "success_rate\\|total_today"
        depends_on: [AD-01]
        priority: high
        notes: "AD-06 dashboard listens to /stats via onValue(). This function must be deployed before the dashboard metrics display correctly."

      - id: AD-04
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Build App Registration form (self-service)"
        files_to_create:
          - "web/src/pages/RegisterApp.jsx"
        ui_requirements:
          - "Form fields: App Name, SMS Template (optional), Rate Limit (optional, defaults 3/10min), Callback URL for webhook (optional)."
          - "On submit: call Cloud Function `registerApp` (from Phase 9 of main checklist) with masterSecret (stored in admin dashboard env)."
          - "On success: display appId and appSecret in a modal with copy buttons and warning: 'Save this secret now. It will never be shown again.'"
        verification:
          - type: contains
            file: "web/src/pages/RegisterApp.jsx"
            patterns:
              - "registerApp"
              - "appSecret"
              - "Copy to clipboard"
        depends_on: [AD-02]
        priority: critical

      - id: AD-05
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Build App List table with revoke button"
        files_to_create:
          - "web/src/pages/AppsList.jsx"
        ui_requirements:
          - "Fetch list of registered apps from Firebase RTDB `/registered_apps` (read access for admin only via security rules)."
          - "Display columns: App ID, App Name, Active (toggle), Created At, Callback URL, Actions (Revoke)."
          - "Revoke button: calls `revokeApp` Cloud Function (gated by masterSecret)."
          - "Show confirmation modal before revoke."
        verification:
          - type: contains
            file: "web/src/pages/AppsList.jsx"
            patterns:
              - "revokeApp"
              - "/registered_apps"
        depends_on: [AD-02]
        priority: critical

      - id: AD-06
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Implement live metrics dashboard (RTDB listeners + Charts)"
        files_to_create:
          - "web/src/pages/Dashboard.jsx"
          - "web/src/components/MetricsCard.jsx"
        ui_requirements:
          - "Use Firebase RTDB `.onValue` to listen to `/stats` node (populated by a scheduled Cloud Function)."
          - "Display: Total OTP requests today, success rate, failed rate, active devices, pending queue depth."
          - "Chart.js or Recharts for 7-day trend of OTP requests."
        verification:
          - type: contains
            file: "web/src/pages/Dashboard.jsx"
            patterns:
              - "onValue"
              - "Recharts\\|Chart"
              - "/stats"
        depends_on: [AD-02]
        priority: high
        notes: "Stats aggregation can be done with a scheduled Cloud Function writing to `/stats` every minute."

      - id: AD-07
        status: "pending"
        note: "Frontend UI not yet implemented – pending Phase 10"
        task: "Add webhook configuration UI per app (edit callback URL + secret rotation)"
        files_to_modify:
          - "web/src/pages/AppsList.jsx"
        ui_requirements:
          - "Inline edit for webhookUrl and ability to regenerate webhookSecret."
          - "Call Cloud Function `updateAppWebhook` (new) to write to `/registered_apps/{appId}/webhookUrl` and `/registered_apps/{appId}/webhookSecret` (hashed)."
        verification:
          - type: contains
            file: "web/src/pages/AppsList.jsx"
            patterns:
              - "webhookUrl"
              - "webhookSecret"
        depends_on: [AD-05]
        priority: high

      - id: AD-08
        status: "pending"
        note: "Frontend UI not yet implemented – pending Phase 10"
        task: "Deploy consolidated React PWA to Firebase Hosting"
        commands:
          - "cd admin-dashboard && npm run build"
          - "firebase target:apply hosting admin-dashboard ${FIREBASE_HOSTING_TARGET}"
          - "firebase deploy --only hosting:${FIREBASE_HOSTING_TARGET}"
        verification:
          - type: command
            run: "curl -sf $FIREBASE_HOSTING_URL | grep -i 'Authenticator'"
            expect_exit: 0
            description: "PWA is reachable on Firebase Hosting. Set FIREBASE_HOSTING_URL in .env.example."
          - type: file_exists
            path: "web/dist/index.html"
            description: "Production build completed"
        depends_on: [AD-01]
        priority: critical

      - id: CP-01
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Build Client Portal — authenticated area for app owners"
        files_to_create:
          - "web/src/pages/ClientPortal.jsx"
          - "web/src/pages/MyApps.jsx"
        ui_requirements:
          - "After login, clients land on /portal showing their registered apps list."
          - "Each app card shows: App Name, appId (copyable), credit balance, status (active/revoked)."
          - "Link to per-app detail page with full metrics and API key management."
          - "Clients with no registered app see a 'Register Your First App' CTA."
        verification:
          - type: contains
            file: "web/src/pages/MyApps.jsx"
            patterns:
              - "/registered_apps"
              - "appId"
              - "balance"
        depends_on: [AD-02, AD-05]
        priority: critical
        notes: "Client users have a non-admin Firebase custom claim. They can only read their own /registered_apps/{appId} node."

      - id: CP-02
        status: "complete"
        note: "Frontend implemented – see web/ directory"
        task: "Build API Key management UI — appSecret reveal and regeneration"
        files_to_create:
          - "web/src/pages/AppDetail.jsx"
        ui_requirements:
          - "Display appId (always visible) and appSecret (hidden by default, shown as ●●●●●●●●)."
          - "'Reveal Secret' button: shows confirmation dialog — 'Never share your secret or embed it in frontend code' — then reveals the value for 30 seconds before re-hiding."
          - "'Regenerate Secret' button: calls Cloud Function `regenerateAppSecret`; shows new secret once in modal with copy button and same warning."
          - "Sample integration code snippet (curl / fetch) pre-filled with the app's real appId."
        verification:
          - type: contains
            file: "web/src/pages/AppDetail.jsx"
            patterns:
              - "appSecret"
              - "Reveal"
              - "Regenerate"
              - "Never share"
        depends_on: [CP-01]
        priority: critical
        security_notes:
          - "appSecret must never be embedded in any JavaScript bundle. It is fetched on-demand via an authenticated Cloud Function call, never stored in RTDB readable by the client."

      - id: CP-03
        status: "pending"
        note: "Frontend UI not yet implemented – pending Phase 10"
        task: "Create `regenerateAppSecret` Cloud Function — replace appSecret securely"
        files_to_create:
          - "functions/src/apps/regenerateAppSecret.js"
        behaviour:
          - "Authenticated (Firebase Auth ID token required; caller must be the app owner or an admin)."
          - "Accept: { appId } (appId inferred from Firebase Auth UID or passed explicitly for admin calls)."
          - "Generate a new cryptographically random appSecret (32 bytes, hex-encoded) using crypto.randomBytes."
          - "Hash the new secret (SHA-256) and write the hash to RTDB `/registered_apps/{appId}/appSecretHash`. The plaintext is NEVER stored."
          - "Return the plaintext secret ONCE in the response: { appSecret: '<new-secret>' }. After this response, the plaintext is gone."
          - "Invalidate any active OTP sessions tied to the old secret (optional but recommended: set a `secretRotatedAt` timestamp on the app record)."
        verification:
          - type: file_exists
            path: "functions/src/apps/regenerateAppSecret.js"
          - type: contains
            file: "functions/src/apps/regenerateAppSecret.js"
            patterns:
              - "randomBytes\\|crypto"
              - "appSecretHash"
              - "secretRotatedAt"
        depends_on: [AD-03]
        priority: critical
        security_notes:
          - "Use crypto.randomBytes(32) — never Math.random()."
          - "Only return the plaintext once; caller must copy it immediately. Warn in the response: 'Store this secret now. It cannot be shown again.'"
          - "This function must verify the caller owns the appId (match Firebase Auth UID to app owner record)."

      - id: TEST-01
        task: "Write unit and integration tests for core app management Cloud Functions"
        files_to_create:
          - "functions/test/registerApp.test.js"
          - "functions/test/revokeApp.test.js"
          - "functions/test/updateAppWebhook.test.js"
          - "functions/test/regenerateAppSecret.test.js"
        test_cases:
          registerApp:
            - "Valid call: returns appId and plaintext appSecret."
            - "Unauthenticated call: rejected with 401."
            - "Duplicate appName: allowed (no uniqueness constraint on name)."
            - "appSecret stored as hash (SHA-256) not plaintext in RTDB."
          revokeApp:
            - "Admin revokes own app: sets active=false."
            - "Owner revokes own app: sets active=false."
            - "Non-owner non-admin revokes another's app: rejected with 403."
            - "Revoked app subsequent sendOtp call: rejected with 403 app_revoked."
          updateAppWebhook:
            - "Owner updates webhookUrl: RTDB record updated."
            - "regenerateSecret=true: new webhookSecretHash written, plaintext returned once."
            - "Non-owner call: rejected with 403."
          regenerateAppSecret:
            - "Owner calls: new appSecretHash written to RTDB, plaintext returned."
            - "secretRotatedAt timestamp updated."
            - "Old appSecret no longer validates against new hash."
        verification:
          - type: command
            run: "cd functions && npm test -- registerApp.test.js revokeApp.test.js updateAppWebhook.test.js regenerateAppSecret.test.js"
            expect_exit: 0
        depends_on: [CF-01, CF-02, CF-03, CP-03]
        priority: critical

      - id: TEST-RULES
        task: "Write automated tests for RTDB and Firestore security rules"
        files_to_create:
          - "functions/test/rtdb-rules.test.js"
          - "functions/test/firestore-rules.test.js"
        rtdb_test_cases:
          - "Admin can read any /registered_apps/{appId}."
          - "Owner can read own /registered_apps/{appId} (ownerUid matches)."
          - "Non-owner cannot read another app's RTDB record."
          - "Unauthenticated cannot read /registered_apps."
          - "No client can write /registered_apps directly."
          - "No client can write /pending_sms or /stats."
        firestore_test_cases:
          - "Authenticated user can read packages collection."
          - "Unauthenticated user cannot read packages."
          - "No client can write packages directly."
          - "Owner can read own app_credits/{appId}."
          - "Non-owner cannot read another's app_credits."
          - "Admin can read any transaction."
          - "Owner can read own transactions."
          - "No client can write transactions directly."
        verification:
          - type: command
            run: "cd functions && firebase emulators:exec --only firestore,database 'npm test -- rtdb-rules.test.js firestore-rules.test.js'"
            expect_exit: 0
        depends_on: [RTDB-01, FS-05]
        priority: critical
        notes: "This creates the firestore-rules.test.js file referenced in validation_commands."

      - id: PG-01
        status: "pending"
        note: "Frontend UI not yet implemented – pending Phase 10"
        task: "Build API Playground (interactive OTP testing console)"
        files_to_create:
          - "web/src/pages/Playground.jsx"
        ui_requirements:
          - "Route: /playground. Requires authentication (client or admin)."
          - "App selector dropdown: populates appId from the user's registered apps."
          - "appSecret input field (password type): client enters it manually — it is NEVER stored anywhere server-side during this flow."
          - "sendOtp section: phone number input + 'Send OTP' button. Calls sendOtp Cloud Function directly from browser using appId + appSecret entered above."
          - "Response panel: shows raw JSON response (success or error). Displays sessionId on success."
          - "verifyOtp section (unlocked after sendOtp): OTP code input + sessionId (auto-filled) + 'Verify' button. Calls verifyOtp and shows raw JSON result."
          - "Error codes are explained inline (e.g., 402 → 'Insufficient credits — top up via Billing page')."
          - "Security banner at top: 'Requests are made directly from your browser to the API. Your appSecret is never logged or stored by this playground.'"
        verification:
          - type: contains
            file: "web/src/pages/Playground.jsx"
            patterns:
              - "sendOtp"
              - "verifyOtp"
              - "appSecret"
              - "sessionId"
              - "402"
        depends_on: [AD-02, CP-01]
        priority: high
        notes: "The playground calls Cloud Functions directly (not a proxy) so the appSecret never touches the React server. Display a clear disclaimer."

  - id: 2
    name: "Webhook Delivery — Notify App Backends on OTP Status Change"
    blocking: false
    description: >
      Extend the existing Cloud Functions to send HTTP POST callbacks to app-configured webhook URLs
      when an OTP status changes to 'sent', 'failed', or 'expired'. Includes HMAC signature verification.
    items:
      - id: WH-01
        task: "Extend `sendOtp` to store webhookUrl and webhookSecret from app registry into `/pending_sms/{sessionId}`"
        files_to_modify:
          - "functions/index.js"
        changes:
          - "In `sendOtp`, after reading app config, copy webhookUrl and webhookSecret (hashed) into the new `/pending_sms/{sessionId}` node."
        verification:
          - type: contains
            file: "functions/index.js"
            pattern: "webhookUrl.*pending_sms\\|pending_sms.*webhookUrl"
        depends_on: [AD-01, CF-01]
        priority: critical
        notes: "Requires registerApp CF (CF-01) to have written webhookUrl into /registered_apps first."

      - id: WH-02
        task: "Create utility function `sendWebhook(sessionId, status, details)`"
        files_to_create:
          - "functions/src/lib/webhook.js"
        behaviour:
          - "Read `/pending_sms/{sessionId}` to get webhookUrl, webhookSecret, to, message, etc."
          - "Construct payload: { sessionId, status, phoneNumber, timestamp, error? }"
          - "Compute HMAC-SHA256 signature using webhookSecret over the JSON stringified payload."
          - "Add header: X-Webhook-Signature: base64(signature)"
          - "POST to webhookUrl with timeout 5 seconds. Retry up to 3 times with exponential backoff (1s, 2s, 4s)."
          - "Log failures (non-200 response or timeout) to Firebase Crashlytics and RTDB `/webhook_failures/{sessionId}`."
        verification:
          - type: file_exists
            path: "functions/src/lib/webhook.js"
          - type: contains
            file: "functions/src/lib/webhook.js"
            patterns:
              - "hmac\\|createHmac"
              - "X-Webhook-Signature"
              - "retry"
              - "fetch\\|axios"
        depends_on: [WH-01]
        priority: critical

      - id: WH-03
        task: "Call webhook from `otpStatus` when status transitions to 'sent', 'failed', or 'expired'"
        files_to_modify:
          - "functions/index.js"
        changes:
          - "In `otpStatus`, after determining the final status (sent/failed/expired), call sendWebhook() asynchronously (do not await – fire and forget but log errors)."
          - "If status is 'failed' and resend triggered, also send webhook for the failure before regenerating."
        verification:
          - type: contains
            file: "functions/index.js"
            pattern: "sendWebhook\\|webhook"
        depends_on: [WH-02]
        priority: high

      - id: WH-04
        task: "Add scheduled cleanup for webhook failure logs"
        files_to_modify:
          - "functions/index.js"
        changes:
          - "Extend `cleanupOldRequests` to delete `/webhook_failures/*` older than 7 days."
        verification:
          - type: contains
            file: "functions/index.js"
            pattern: "webhook_failures.*remove\\|delete.*webhook_failures"
        depends_on: [WH-02]
        priority: medium

      - id: WH-05
        task: "Write test for webhook delivery (local emulator + mock endpoint)"
        files_to_create:
          - "functions/test/webhook.test.js"
        test_cases:
          - "Send OTP, manually set status to 'sent' via RTDB, verify webhook called with correct signature."
          - "Simulate webhook endpoint returning 500, verify retry logic."
        verification:
          - type: command
            run: "cd functions && npm test -- webhook.test.js"
            expect_exit: 0
        depends_on: [WH-02, WH-03]
        priority: high

