# Failure Conditions - deployment blockers
failure_conditions:
  - condition: "bKash personal number hardcoded in client-side JavaScript bundles"
    check: "grep -r '01613249520' web/src --include='*.js' --include='*.jsx'"
    action: "BLOCK_DEPLOY"

  - condition: "Webhook signature verification missing"
    check: "grep -L 'X-Webhook-Signature\\|verifySignature' functions/src/lib/webhook.js"
    action: "BLOCK_DEPLOY"

  - condition: "sendOtp does not check Firestore app_credits before sending OTP"
    check: "grep -L 'app_credits\\|sms_remaining' functions/index.js"
    action: "BLOCK_DEPLOY"

  - condition: "Credit deduction not wrapped in Firestore transaction (race condition risk)"
    check: "grep -L 'runTransaction\\|firestore().runTransaction' functions/index.js"
    action: "BLOCK_DEPLOY"

  - condition: "approveCredit allows double credit addition (no idempotency check on transaction status)"
    check: "grep -L 'status.*pending\\|pending.*status' functions/src/billing/approveCredit.js"
    action: "BLOCK_DEPLOY"

  - condition: "No audit trail written after credit deduction in sendOtp"
    check: "grep -L 'app_credits.*usage\\|usage.*sub' functions/index.js"
    action: "BLOCK_DEPLOY"

  - condition: "Missing per-OTP credit guard (could allow unlimited free OTP)"
    check: "grep -L 'insufficient_credits\\|402' functions/index.js"
    action: "BLOCK_DEPLOY"

  - condition: "appSecret exposed in admin dashboard frontend"
    check: "grep -r 'import.meta.env.*APP_SECRET\\|process.env.*APP_SECRET' web/src"
    action: "BLOCK_DEPLOY"

validation_commands:
  dashboard_build: "cd web && npm run build"
  webhook_test: "cd functions && npm test -- webhook.test.js"
  credit_guard_test: "cd functions && npm test -- sendOtp.test.js"
  topup_test: "cd functions && npm test -- topupRequest.test.js"
  approve_credit_test: "cd functions && npm test -- approveCredit.test.js"
  app_management_test: "cd functions && npm test -- registerApp.test.js revokeApp.test.js updateAppWebhook.test.js regenerateAppSecret.test.js"
  upsert_package_test: "cd functions && npm test -- upsertPackage.test.js"
  security_rules_test: "cd functions && firebase emulators:exec --only firestore,database 'npm test -- rtdb-rules.test.js firestore-rules.test.js'"
  e2e_billing_test: "cd functions && firebase emulators:exec --only auth,functions,firestore,database 'npm test -- e2e-billing.test.js'"
